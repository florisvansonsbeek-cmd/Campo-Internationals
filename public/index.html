<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campo International</title>
<meta name="description" content="Campo International, wholesale in pot plants and cut flowers from Nootdorp, the Netherlands.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* The picture on the right of the front page changes with every visit: the globe and three photographs,
   in turn. ?beeld=kiem, wereldbol, tulp or dauw shows one on purpose. */
(function () {
  var L = ['kiem', 'wereldbol', 'tulp', 'dauw'], i, m = /[?&]beeld=([a-z]+)/.exec(location.search);
  try {
    if (m && L.indexOf(m[1]) >= 0) i = L.indexOf(m[1]);
    else {
      i = (parseInt(localStorage.getItem('campo.beeld'), 10) + 1) % L.length;
      if (!(i >= 0)) i = Math.floor(Math.random() * L.length);
      localStorage.setItem('campo.beeld', String(i));
    }
  } catch (e) { i = Math.floor(Math.random() * L.length); }
  document.documentElement.setAttribute('data-beeld', L[i]);
  if (L[i] === 'wereldbol' || (location.hash && location.hash !== '#/' && location.hash !== '#')) return;
  var l = document.createElement('link');
  l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif';
  l.setAttribute('imagesrcset', [480, 760, 1100].map(function (w) { return '/img/' + L[i] + '-' + w + '.avif ' + w + 'w'; }).join(', '));
  l.setAttribute('imagesizes', '(max-width: 900px) 86vw, 440px');
  document.head.appendChild(l);
})();
</script>

/* Layout: a quiet paper page with an ink header, one serif headline and hairline grids. The desk inside keeps the same paper, ink, leaf and brass, with hairline-ruled panels. One deliberate light theme. */
:root{
  --ink:#15201a;
  --ink-2:#525c55;
  --ink-3:#5f6963;
  --paper:#f4f5f0;
  --paper-2:#e8ebe3;
  --sheet:#fcfcf9;
  --line:#d8ddd2;
  --line-2:#c2c9bb;
  --leaf:#1f5138;
  --leaf-deep:#143826;
  --leaf-bg:#e2ece2;
  --forest:#10291e;
  --sage:#e5ebdf;
  --sage-2:#d2ddca;
  --sprout:#33923c;
  --brass:#7d6740;
  --warn:#8a3d2a;
  --warn-bg:#f3e3dc;
  --wait:#7a5c22;
  --wait-bg:#f2ead8;
  --info:#3c5560;
  --info-bg:#e3e8e9;
  --track:#e2e5dc;
  --on-ink:#f4f5f0;
  --on-ink-2:rgba(244,245,240,.74);
  --on-ink-line:rgba(244,245,240,.32);
  --scrim:rgba(16,41,30,.45);
  --shadow:0 1px 2px rgba(16,41,30,.06),0 12px 32px rgba(16,41,30,.10);
  --font-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --font-ui:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-data:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-ui);font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
[hidden]{display:none!important}
*,*::before,*::after{font-variant-numeric:lining-nums!important}
img,svg{max-width:100%}
a{color:inherit;text-underline-offset:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.site-top :focus-visible,.desk-top :focus-visible,.orderbar :focus-visible{outline-color:var(--on-ink)}
.mono{font-family:var(--font-data);font-size:.92em}
.num{font-variant-numeric:lining-nums tabular-nums!important}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13.5px}
.eyebrow{font:600 11.5px/1.35 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow-b{font:600 12px/1.35 var(--font-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.wrap{max-width:1152px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 20px;border:1px solid transparent;border-radius:0;font-weight:600;font-size:15.5px;line-height:1.2;text-decoration:none;white-space:nowrap;background:var(--paper-2);color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.btn-sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn-leaf{background:var(--leaf);color:var(--on-ink)}
.btn-leaf:hover{background:var(--leaf-deep)}
.btn-outline{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--paper-2)}
.btn-line{background:var(--sheet);border-color:var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-bad{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn-bad:hover{background:var(--warn-bg)}
.btn-on-ink{background:transparent;border-color:var(--on-ink-line);color:var(--on-ink)}
.btn-on-ink:hover{border-color:var(--on-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.25;padding:2px 7px;border-radius:2px;background:var(--paper-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip.ok{background:var(--leaf-bg);color:var(--leaf)}
.chip.wait{background:var(--wait-bg);color:var(--wait)}
.chip.bad{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.wk{display:inline-block;font:700 10.5px/1 var(--font-ui);letter-spacing:.12em;padding:3px 5px;border:1px solid var(--brass);border-radius:2px;color:var(--brass);vertical-align:1px;white-space:nowrap}
.site-top .wk,.desk-top .wk{border-color:var(--on-ink-line);color:var(--on-ink)}
.size{display:inline-block;font:600 12.5px/1.35 var(--font-ui);letter-spacing:.02em;padding:0 6px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2);white-space:nowrap}
.ribbon{background:var(--paper-2);color:var(--ink-2);font-size:13px;line-height:1.4;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line)}
.ribbon b{color:var(--ink)}

/* ---------- brand: Jan's globe with the leafy branch, CAMPO over INTERNATIONAL ---------- */
.wordmark{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:none}
.wordmark .mark{height:46px;width:auto;max-width:none;flex:none;overflow:visible}
.wm-txt{display:grid;justify-items:start;gap:6px;line-height:1}
.wm-txt b{font:600 28px/.78 var(--font-display);letter-spacing:.1em;color:var(--forest)}
.wm-txt i{font:600 8.9px/1 var(--font-ui);font-style:normal;letter-spacing:.45em;margin-right:-.45em;text-transform:uppercase;color:var(--leaf)}
.desk-top .wm-txt b,.foot .wm-txt b{color:#fff}
.desk-top .wm-txt i,.foot .wm-txt i{color:var(--on-ink-2)}

/* ---------- outside ---------- */
.ribbon{background:var(--sage);border-bottom-color:var(--sage-2)}
.site-top{background:var(--sheet);color:var(--ink);border-bottom:1px solid var(--line)}
.site-top :focus-visible{outline-color:var(--leaf)}
.top-bar{display:flex;align-items:center;gap:12px 28px;padding-block:13px}
.top-nav{display:flex;align-items:center;gap:26px;margin-left:auto;font-size:15px}
.top-nav a{color:var(--ink-2);text-decoration:none;padding-block:6px;border-bottom:2px solid transparent}
.top-nav a:hover{color:var(--ink)}
.top-nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sprout)}
.lang{position:relative;flex:none}
.lang summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 10px;border:1px solid var(--line-2);background:var(--sheet);font-weight:600;font-size:13.5px;letter-spacing:.06em;color:var(--ink);cursor:pointer;user-select:none}
.lang summary::-webkit-details-marker{display:none}
.lang summary::marker{content:""}
.lang summary svg{width:16px;height:16px;color:var(--leaf)}
.lang summary:hover,.lang[open] summary{border-color:var(--ink)}
.lang-chev{width:7px;height:7px;margin:0 1px 3px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.lang[open] .lang-chev{transform:rotate(-135deg);margin-bottom:-2px}
.lang-list{position:absolute;right:0;top:calc(100% + 6px);z-index:60;list-style:none;margin:0;padding:6px;min-width:190px;display:grid;gap:1px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow)}
.lang-list button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:9px 10px;border:0;background:none;text-align:left;font-size:15px;color:var(--ink)}
.lang-list button:hover{background:var(--paper-2)}
.lang-list button span{font-size:11.5px;letter-spacing:.12em;color:var(--ink-3)}
.lang-list button[aria-current="true"]{font-weight:700;color:var(--leaf);background:var(--leaf-bg)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:15px;color:var(--ink-2)}
.kicker{display:flex;align-items:center;gap:10px;font:600 12px/1.35 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--leaf)}
.kicker::before{content:"";flex:none;width:18px;height:2px;background:var(--sprout)}
.lede{font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:var(--ink-2);max-width:34rem;margin-top:22px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.go{margin-top:auto;padding-top:10px;font-weight:600;color:var(--leaf);text-decoration:none;width:fit-content}
.go:hover{text-decoration:underline}

/* front page: the hero, with the plants growing up from its bottom edge */
.hero{background:linear-gradient(180deg,var(--sheet) 0%,var(--paper) 100%);border-bottom:1px solid var(--sage-2)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:end;padding-top:clamp(40px,6vw,72px)}
.hero-copy{align-self:center;padding-bottom:clamp(40px,6vw,72px)}
.hero h1{font:500 clamp(44px,4.9vw,68px)/1 var(--font-display);letter-spacing:-.012em;margin-top:20px;color:var(--forest);text-wrap:wrap}
.hero h1 em{display:block;font-style:italic;color:var(--leaf);text-wrap:balance}
.hero h1.long{font-size:clamp(40px,4.4vw,60px)}
.hero-facts{display:grid;grid-template-columns:auto minmax(0,1.6fr) auto;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px;max-width:40rem}
.hero-facts > div{background:var(--sheet);padding:12px 16px}
.hero-facts dt,.visit-facts dt,.cust-sum dt{font:600 11px/1.3 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.hero-facts dd{margin-top:5px;font-weight:600;line-height:1.35}
/* the picture on the right of the hero, a different one with every visit:
   a photograph in an arched window standing on the line under the hero, or a drawing in the place of the old globe */
.plate{position:relative;margin:0;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.plate.arch{align-self:end;justify-self:center;width:min(100%,440px,calc(72vh * 11 / 14))}
.plate.arch picture{display:block;aspect-ratio:11/14;border-radius:999px 999px 0 0;overflow:hidden;background:var(--sage)}
.plate.arch img{display:block;width:100%;height:100%;object-fit:cover}
.plate.drawn{align-self:end;justify-self:end;width:min(100%,470px);aspect-ratio:1/1;margin-bottom:clamp(20px,3vw,44px)}
.plate .hero-art{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.globe-art .g-sphere{fill:url(#globe-fill)}
.globe-art .g-grid{fill:none;stroke:var(--leaf);stroke-opacity:.15;stroke-width:1}
.globe-art .g-main{fill:none;stroke:var(--leaf);stroke-opacity:.3;stroke-width:1.2}
.globe-art .g-rim{fill:none;stroke:var(--leaf);stroke-opacity:.4;stroke-width:1.4}
.globe-art .g-halo{fill:var(--sprout);fill-opacity:.16}
.globe-art .g-dot{fill:var(--sprout);stroke:var(--sheet);stroke-width:2}
.globe-art .g-name{font:600 12.5px var(--font-ui);letter-spacing:.24em;fill:var(--forest)}
.globe-art .g-coord{font:400 12px var(--font-ui);letter-spacing:.04em;fill:var(--ink-3)}
@keyframes grow{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* sections */
.sec{padding-block:clamp(56px,8vw,100px)}
.sec-sage{background:var(--sage);border-block:1px solid var(--sage-2)}
.s-head{display:grid;gap:12px;max-width:46rem;margin-bottom:clamp(28px,4vw,40px)}
.s-head h2{font:500 clamp(34px,4.2vw,52px)/1.04 var(--font-display);color:var(--forest)}
.s-head > p:not(.kicker){color:var(--ink-2);line-height:1.6;max-width:40rem}

/* the range */
.range-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pcard{background:var(--sheet);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-width:0}
.pcard-art{position:relative;background:var(--sage);aspect-ratio:5/4;display:grid;place-items:end center;overflow:hidden}
.pcard-art .plant{width:76%;height:auto;display:block}
.badge{position:absolute;top:10px;left:10px;font:700 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--forest);color:#fff}
.badge.quiet{background:var(--sheet);color:var(--leaf);border:1px solid var(--sage-2)}
.pcard-body{padding:16px 16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:3px;align-content:start}
.pcard h3{font:600 24px/1.1 var(--font-display);color:var(--forest);overflow-wrap:anywhere;hyphens:auto}
.p-latin{font:italic 500 17px/1.3 var(--font-display);color:var(--ink-2);min-height:1.3em}
.p-latin.p-common{font:400 14.5px/1.55 var(--font-ui);font-style:normal}
.p-size{font-size:13.5px;color:var(--ink-3)}
.season{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;margin-top:12px}
.season i{height:7px;background:var(--track)}
.season i.on{background:var(--sprout)}
.season i.now{box-shadow:0 0 0 1.5px var(--sheet),0 0 0 3px var(--forest)}
.season-txt{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.season-txt span:first-child{font-weight:600;color:var(--ink-2)}

/* the documents list on the growers' page */
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px}
.docs li{position:relative;padding-top:38px}
.docs h2{font:600 26px/1.1 var(--font-display);color:var(--forest)}
.docs p{color:var(--ink-2);margin-top:6px;line-height:1.55;font-size:15.5px;max-width:20rem}

/* growers and customers */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.door{position:relative;overflow:hidden;background:var(--sheet);border:1px solid var(--line);padding:clamp(24px,3vw,36px) clamp(136px,15vw,190px) clamp(24px,3vw,32px) clamp(24px,3vw,36px);display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:310px}
.door-art{position:absolute;right:clamp(12px,2vw,28px);bottom:0;width:clamp(110px,12vw,150px);max-width:40%}
.door-art .door-plant{width:100%;height:auto;display:block}
.door h2{font:500 clamp(28px,3vw,36px)/1.08 var(--font-display);color:var(--forest)}
.door p{color:var(--ink-2);line-height:1.6;max-width:30rem}
.door .go{margin-top:auto}
.door-btn{margin-top:6px}
.door .door-note{margin-top:auto;font-size:15px}
.door-note a{color:var(--leaf);font-weight:600;overflow-wrap:anywhere}
.mailchip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);max-width:100%}
.mailchip span{font-weight:600;overflow-wrap:anywhere}

/* contact */
.visit{position:relative;border-top:1px solid var(--line);padding-bottom:clamp(72px,9vw,112px)}
.visit-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:24px 48px;align-items:start}
.visit h2{font:500 clamp(32px,3.6vw,44px)/1.05 var(--font-display);color:var(--forest);margin-top:12px}
.visit-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}

/* A year of earlier orders, generated the same way on every visit */
function seeded(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function inSeason(p, d) {
  const s = PLANTS[p].season; if (!s) return true;
  const m = d.getMonth() + 1;
  return s[0] <= s[1] ? m >= s[0] && m <= s[1] : m >= s[0] || m <= s[1];
}
const HISTORY = (() => {
  const out = [];
  Object.keys(CUSTOMERS).forEach((key, ci) => {
    const c = CUSTOMERS[key], r = seeded(1009 + ci * 7919);
    const stopAt = c.stopped ? T(-58) : T(-10);
    let d = addDays(T(-364), Math.floor(r() * c.every));
    while (d < stopAt) {
      const pool = c.mix.filter(p => inSeason(p, d));
      const use = pool.length ? pool : c.mix;
      const picked = use.slice().sort(() => r() - 0.5).slice(0, 1 + Math.floor(r() * Math.min(3, use.length)));
      const lines = picked.map(p => {
        const pl = PLANTS[p], steps = Math.floor((pl.range[1] - pl.range[0]) / pl.step);
        return [p, pl.size, pl.range[0] + pl.step * Math.floor(r() * (steps + 1)), Math.round(pl.sell * (0.95 + r() * 0.1) * 100) / 100];
      });
      out.push({ cust: key, lines, ordered: d, when: addDays(d, 3 + Math.floor(r() * 4)), step: 3, past: true });
      d = addDays(d, Math.max(4, Math.round(c.every * (0.75 + r() * 0.5))));
    }
  });
  out.sort((a, b) => a.ordered - b.ordered);
  const byYear = {};
  out.forEach(o => { const y = o.ordered.getFullYear(); (byYear[y] = byYear[y] || []).push(o); });
  Object.keys(byYear).forEach(y => {
    const list = byYear[y], current = Number(y) === TODAY.getFullYear();
    const last = current ? 389 : 612, step = current ? Math.max(1, Math.floor(388 / (list.length + 1))) : 2;

  });
  return out;
})();

/* ================= invoices: three-way check and rank ================= */

    iban: !g ? 'unknown' : inv.iban === g.iban ? 'same' : 'changed', dup: !!inv.dupOf,
    po, slipDoc: slip, value: amount, expected: null,

      k.expected = delivered * po.price;

  else if (!k.order || k.slip !== 'yes' || k.amount !== 'equal') k.rank = 'hold';

  const po = k.po, slip = k.slipDoc;

      const real = GROWERS[inv.lookalike];
      return `Afzender <span class="mono">${esc(inv.sender)}</span> is geen bekende kweker. De naam wijkt één letter af van ${esc(real.name)}. Geen bestelling, geen pakbon, en de mail vraagt om vandaag te betalen. Het IBAN eindigt op ${inv.iban}; van ${esc(real.name)} staat er een op ${real.iban} in het systeem.`;
    }

    if (k.iban === 'changed') return `Het IBAN eindigt op ${inv.iban}. Eerdere facturen van ${esc(g.name)} gebruiken er een op ${g.iban}. Het bekende nummer van ${esc(g.name)} is betrouwbaarder dan een nummer op deze factuur.`;

    if (slip && slip.issue === 'fewer') return `Gefactureerd: ${qty(po.qty)} × ${p} ${po.size}. De pakbon zegt ${qty(slip.got)} binnen: ${qty(po.qty - slip.got)} minder, dus ${eur(k.value - k.expected)} meer gefactureerd dan geleverd.`;
    if (slip && slip.issue === 'partial') return `Deellevering: ${qty(slip.got)} van ${qty(slip.of)} ${p} binnen, de rest verwacht ${wkTxt(slip.rest)}. De factuur is voor alle ${qty(slip.of)}. Geen fout, maar de factuur klopt pas als de rest binnen is, of met een factuur voor ${qty(slip.got)} (${eur(k.expected)}).`;

const stepOf = o => (S.steps[o.id] ? S.steps[o.id].step : o.step);

  const value = year.reduce((s, o) => s + orderValue(o), 0);

  const gaps = asc.slice(1).map((d, i) => daysFrom(asc[i], d));

  const top = Object.keys(byPlant).sort((a, b) => byPlant[b] - byPlant[a]).slice(0, 3);

  const quiet = !!(last && rhythm && daysFrom(last.ordered, TODAY) > Math.max(21, rhythm * 2.5));

  : route() === '' || route() === 'suppliers' ? '' // the website itself carries no prototype note; the sign-in and customer pages do

function roofline() {
  // the sawtooth roof of a Venlo glasshouse, as one hairline along the bottom of the hero
  let d = 'M0 30';
  for (let x = 0; x < 1600; x += 28) d += `L${x + 14} 19L${x + 28} 30`;
  return `<svg class="roof" viewBox="0 0 1600 30" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
}
/* a section Jan can fold away: closed until he opens it, and remembered on this computer */
const isClosed = (id, open) => (id in P.fold ? !!P.fold[id] : !open);
function fold(id, title, meta, body, opts) {
  opts = opts || {};
  const closed = isClosed(id, opts.open), H = opts.h || 'h2';
  return `<section class="fold${closed ? ' closed' : ''}${opts.cls ? ' ' + opts.cls : ''}" id="${id}"${opts.attrs ? ' ' + opts.attrs : ''}>
  <div class="fold-head">
    <button class="fold-btn" type="button" id="${id}-btn" data-act="fold" data-id="${id}" aria-expanded="${!closed}" aria-controls="${id}-body"><span class="chev" aria-hidden="true"></span><${H}>${title}</${H}></button>
    ${meta ? `<span class="fold-meta">${meta}</span>` : ''}${opts.tools ? `<span class="fold-tools">${opts.tools}</span>` : ''}
  </div>
  <div class="fold-body" id="${id}-body"${closed ? ' hidden' : ''}>${body}</div>
</section>`;
}
function pageHead(eyebrow, title, lede, side) {
  return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${lede ? `<details class="ph-more"><summary>Uitleg</summary><div class="lede-d">${lede}</div></details>` : ''}</div>${side || ''}</div>`;
}

  docsNote: {
    en: 'A program on our own computer reads your documents and lays them next to our order. Whatever it cannot read for sure, we check ourselves. Ordering and paying are always done by us, never automatically.',
    nl: 'Een programma op onze eigen computer leest uw documenten en legt ze naast onze bestelling. Wat het niet zeker leest, kijken wij zelf na. Bestellen en betalen doen wij altijd zelf, nooit automatisch.',

/* The picture on the right of the hero changes with every visit (see the script in <head>): the globe with
   Nootdorp marked, or one of three photographs in an arched window that stands on the line under the hero:
   a seedling in the soil, a red tulip, dew drops on a leaf. The photographs are made by scripts/art/*.py. */
const HERO_ART = ['kiem', 'wereldbol', 'tulp', 'dauw'].includes(document.documentElement.dataset.beeld) ? document.documentElement.dataset.beeld : 'kiem';
function globeArt() {
  const cx = 270, cy = 262, r = 214, rad = Math.PI / 180, phi0 = 47 * rad, lam0 = 6 * rad;
  const proj = (lat, lon) => {
    const la = lat * rad, lo = lon * rad - lam0;
    const x = Math.cos(la) * Math.sin(lo);
    const y = Math.cos(phi0) * Math.sin(la) - Math.sin(phi0) * Math.cos(la) * Math.cos(lo);
    const z = Math.sin(phi0) * Math.sin(la) + Math.cos(phi0) * Math.cos(la) * Math.cos(lo);
    return [cx + r * x, cy - r * y, z];
  };
  const path = pts => {
    let d = '', run = [];
    const flush = () => { if (run.length > 1) d += 'M' + run.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L'); run = []; };
    pts.forEach(p => (p[2] > 0 ? run.push(p) : flush())); flush();
    return d;
  };
  const meridian = lon => path([...Array(91).keys()].map(i => proj(-90 + i * 2, lon)));
  const parallel = lat => path([...Array(181).keys()].map(i => proj(lat, -180 + i * 2)));
  let grid = '';
  for (let lon = -180; lon < 180; lon += 15) if (lon !== 0) grid += meridian(lon);
  for (let lat = -75; lat <= 75; lat += 15) if (lat !== 0) grid += parallel(lat);
  const [nx, ny] = proj(52.045, 4.396);
  return `<svg class="hero-art globe-art" viewBox="44 36 452 452" role="img" aria-label="${t('globeAria')}">
    <defs><radialGradient id="globe-fill" cx="36%" cy="30%" r="78%"><stop offset="0" style="stop-color:var(--sheet)"/><stop offset="1" style="stop-color:var(--sage)"/></radialGradient></defs>
    <circle class="g-sphere" cx="${cx}" cy="${cy}" r="${r}"/>
    <path class="g-grid" d="${grid}"/><path class="g-main" d="${meridian(0)}${parallel(0)}"/>
    <circle class="g-rim" cx="${cx}" cy="${cy}" r="${r}"/>
    <circle class="g-halo" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="14"/><circle class="g-dot" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="5.5"/>
    <text class="g-name" x="${(nx + 18).toFixed(1)}" y="${(ny - 3).toFixed(1)}">NOOTDORP</text>
    <text class="g-coord" x="${(nx + 18).toFixed(1)}" y="${(ny + 14).toFixed(1)}">52°03′N · 4°24′E</text>
  </svg>`;
}
function plantArt() {
  if (HERO_ART === 'wereldbol') return `<div class="plate drawn">${globeArt()}</div>`;
  const set = ext => [480, 760, 1100].map(w => `/img/${HERO_ART}-${w}.${ext} ${w}w`).join(', ');
  const sizes = '(max-width: 900px) 86vw, 440px';
  return `<div class="plate arch"><picture><source type="image/avif" srcset="${set('avif')}" sizes="${sizes}"><source type="image/webp" srcset="${set('webp')}" sizes="${sizes}"><img src="/img/${HERO_ART}-760.webp" width="1100" height="1400" alt="${t(HERO_ART + 'Alt')}" fetchpriority="high" decoding="async"></picture></div>`;
}

/* ================= customer door ================= */
function againHref(o, name) {
  const lines = o.lines.map(([p, size, n]) => `${qty(n)} × ${pn(p)} ${size}`).join('\n');
  return `mailto:${CO.mail}?subject=${encodeURIComponent(t('againSubj', { ref: o.id }))}&body=${encodeURIComponent(t('againBody', { lines, name: name || '' }))}`;
}
function orderCard(o, name) {
  const step = stepOf(o), steps = stepsPub();
  return `<article class="ocard${step === 3 ? ' done' : ''}">
  <header>
    <div><span class="eyebrow">${t('reference')}</span><b class="mono">${o.id}</b></div>
    <div><span class="eyebrow">${t('destination')}</span><span>${esc(o.dest)}</span></div>
    <div><span class="eyebrow">${step === 3 ? t('deliveredOn') : t('expected')}</span><span>${fWD(o.when)}</span></div>
  </header>
  <ul class="olines">${o.lines.map(([p, size, n]) => `<li><span class="ol-ic">${BOT.plant(p, 'ol-plant')}</span><span class="ol-name">${pn(p)}</span><span class="ol-size">${size}</span><span class="num">${qty(n)} ${unitOf(p)}</span></li>`).join('')}</ul>
  <ol class="steps" aria-label="${t('progress')}: ${steps[step]}">${steps.map((s, i) => `<li class="${i < step ? 'done' : i === step ? 'now' : ''}"${i === step ? ' aria-current="step"' : ''}>${s}</li>`).join('')}</ol>
  <div class="oc-foot"><p class="set-by">${t('updated', { when: fWhen(setAtOf(o)) })}</p><a class="btn btn-line btn-sm oc-again" href="${againHref(o, name)}" title="${t('orderAgainTip')}">${t('orderAgain')}</a></div>
</article>`;
}
function viewCustomer() {
  const c = CUSTOMERS[S.session.cust];
  const mine = ORDERS.filter(o => o.cust === S.session.cust);
  const open = mine.filter(o => stepOf(o) < 3), done = mine.filter(o => stepOf(o) === 3);
  return `${ribbon()}
<header class="site-top"><div class="wrap top-bar">${wordmark()}<div class="top-right"><span class="who">${esc(c.name)}</span>${langMenu()}<button class="btn btn-line btn-sm" data-act="logout">${t('signOut')}</button></div></div></header>
<main class="wrap cust-main">
  <div class="cust-head">
    <div><p class="kicker">${esc(c.name)} · ${esc(c.city)}</p><h1>${t('sideK')}</h1><p class="muted">${t('custMuted')}</p></div>
    <dl class="cust-sum"><div><dt>${t('open')}</dt><dd class="num">${open.length}</dd></div><div><dt>${t('delivered')}</dt><dd class="num">${done.length}</dd></div><div><dt>${t('factWeek')}</dt><dd class="num">${isoWeek(TODAY)}</dd></div></dl>
  </div>
  ${open.length ? open.map(o => orderCard(o, c.contact)).join('') : `<p class="cust-help">${t('noOpen')}</p>`}
  ${done.length ? `<h2>${t('delivered')}</h2>${done.map(o => orderCard(o, c.contact)).join('')}` : ''}
  <p class="faint small oc-tip">${t('orderAgainTip')}</p>
  <p class="cust-help">${t('custHelp', { mail: `<a href="mailto:${CO.mail}">${CO.mail}</a>`, phone: `<a href="tel:${CO.tel}">${CO.phone}</a>` })}</p>
</main>
${pubFoot()}`;
}

/* one tab title per page, so several open tabs can be told apart */
function pageTitle(r) {
  if (r === 'login/desk') return 'Inloggen · Campo desk';
  if (r === 'desk/live') return 'Live · Binnenkomen en verzenden · Campo desk';
  if (r === 'desk/score' || r === 'desk/rules') return 'Score instellen · Offertes · Campo desk';
  if (r === 'desk/log') return 'Logboek · Campo desk';
  if (r.indexOf('desk') === 0) { const item = DESK_NAV.find(x => x[0] === r.split('/')[1]); return `${item ? item[1] : 'Vandaag'} · Campo desk`; }
  const name = { suppliers: t('growersBtn') }[r];
  return name ? `${name} · Campo International` : 'Campo International';
}

/* links in the header and footer that lead to a part of the front page */
let GOTO = null;
// the fonts are embedded; load every face up front so nothing shifts once the italic or bold first appears
if (document.fonts && document.fonts.load) ['500 1em "Cormorant Garamond"', '600 1em "Cormorant Garamond"', 'italic 500 1em "Cormorant Garamond"', '400 1em "Source Sans 3"', '600 1em "Source Sans 3"', '700 1em "Source Sans 3"'].forEach(f => document.fonts.load(f).catch(() => {}));
const goTo = id => {
  const el = document.getElementById(id);
  if (!el) return;
  void el.offsetTop; // lay the page out first, so a font it still needs starts loading before we measure
  const go = () => el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  if (document.fonts && document.fonts.status === 'loading') document.fonts.ready.then(go); else go();
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-goto]');
  if (!a) return;
  e.preventDefault();
  if (route() === '') goTo(a.dataset.goto); else { GOTO = a.dataset.goto; location.hash = '#/'; }
});
window.addEventListener('hashchange', () => { if (GOTO) { const id = GOTO; GOTO = null; requestAnimationFrame(() => goTo(id)); } });


/* ================= one order, without an account ================= */
/* The order number from the confirmation plus the postcode of the delivery address show that one order. */
function viewTrack() {
  const o = S.track && ORDERS.find(x => x.id === S.track.id);
  if (!o) { history.replaceState(null, '', '#/login/customer'); return viewLogin('customer'); }
  const c = CUSTOMERS[o.cust];
  return `${ribbon()}${pubTop('customer')}
<main class="wrap cust-main">
  <div class="cust-head"><div><p class="kicker">${t('oneOrderK')} · ${esc(c.city)}</p><h1 class="mono-h">${o.id}</h1><p class="muted">${t('oneOrderNote')}</p></div></div>
  ${orderCard(o, '')}
  <p class="track-more"><a class="btn btn-line btn-sm" href="#/login/customer" data-track="other">${t('otherOrder')}</a><a class="btn btn-leaf btn-sm" href="#/login/customer" data-track="other">${t('signIn')}</a></p>
  <p class="cust-help">${t('custHelp', { mail: `<a href="mailto:${CO.mail}">${CO.mail}</a>`, phone: `<a href="tel:${CO.tel}">${CO.phone}</a>` })}</p>
</main>
${pubFoot()}`;
}
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset || f.dataset.form !== 'track') return;
  e.preventDefault();
  const norm = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const no = norm(f.no.value), pc = norm(f.pc.value);
  const o = no.length >= 6 ? ORDERS.find(x => norm(x.id) === no || norm(x.id).endsWith(no)) : null;
  const addr = o ? norm(CUSTOMERS[o.cust].addr.join(' ')) : '';
  if (!o || pc.length < 4 || !/\d/.test(pc) || !addr.includes(pc)) {
    const err = f.querySelector('.form-err'); err.textContent = t('trackErr'); err.hidden = false; return;
  }
  S.track = { id: o.id, at: Date.now() }; save();
  location.hash = '#/track';
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-track="other"]')) { S.track = null; save(); }
});


/* ================= router: the website and the customer door. The desk lives at /desk/ ================= */
const APP = document.getElementById('app');
const route = () => location.hash.replace(/^#\/?/, '');
function view(r) {
  if (r === 'login/desk' || r.indexOf('desk') === 0) { location.replace('/desk/'); return ''; }
  if (r === 'suppliers') return viewSuppliers();
  // following an order online is no longer offered: the old customer addresses lead to the front page
  if (r === 'login/customer' || r === 'customer' || r === 'track') history.replaceState(null, '', '#/');
  return viewHome();
}
let lastRoute = null;
function render(routeChanged) {
  const r = route();
  LANG = pubLang();
  document.documentElement.lang = LANG;
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  APP.innerHTML = view(r);
  const now = route();
  document.title = pageTitle(now);
  if (routeChanged || now !== lastRoute) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if (!routeChanged && focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  lastRoute = now;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(UI.toastTimer);
  UI.toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
}
function copyText(text) {
  const done = () => toast(t('copied'));
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done(); else toast(t('copySelf'));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act;
  if (act === 'copy') { copyText(el.dataset.from ? document.getElementById(el.dataset.from).textContent : el.dataset.text); return; }
  if (act === 'fill') {
    const f = el.closest('form');
    f.email.value = el.dataset.email; f.password.value = 'demo';
    f.querySelector('.form-err').hidden = true; f.querySelector('button[type="submit"]').focus();
    return;
  }
  if (act === 'logout') { S.session = null; save(); location.hash = '#/'; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.classList.contains('login')) return;
  e.preventDefault();
  const email = f.email.value.trim().toLowerCase(), pw = f.password.value;
  f.password.value = '';
  const acc = DEMO_LOGINS.customer.find(a => a.email === email);
  if (!acc || pw !== 'demo') { const err = f.querySelector('.form-err'); err.textContent = t('loginErr'); err.hidden = false; return; }
  S.session = { role: 'customer', cust: acc.cust };
  save(); location.hash = '#/customer';
});
window.addEventListener('hashchange', () => render(true));
render(true);

})();
</script>
