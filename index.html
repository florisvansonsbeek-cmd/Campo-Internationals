.vd .trk{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.vd .trk li{position:relative;display:grid;justify-items:start;align-content:start;gap:1px;padding:18px 6px 0 0;min-width:0}
.vd .trk li::before{content:"";position:absolute;top:5px;left:6px;right:0;height:2px;background:var(--line-2)}
.vd .trk li:last-child::before{display:none}
.vd .trk .dot{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--sheet);z-index:1}
.vd .trk li.done .dot,.vd .trk li.now .dot{border-color:var(--tk);background:var(--tk)}
.vd .trk li.done::before{background:var(--tk)}
.vd .trk li.now .dot{box-shadow:0 0 0 4px var(--tk-bg)}
.vd .trk li.part .dot{background:var(--sheet)}
.vd .trk b{font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink-3)}
.vd .trk li.done b{color:var(--ink-2)}
.vd .trk li.now b{color:var(--ink)}
.vd .trk small{font-size:11.5px;line-height:1.3;color:var(--ink-3)}
.vd .trk.t-ok{--tk:var(--st-ok);--tk-bg:var(--st-ok-bg)}
.vd .trk.t-info{--tk:var(--st-info);--tk-bg:var(--st-info-bg)}
.vd .trk.t-risk{--tk:var(--st-risk);--tk-bg:var(--st-risk-bg)}
.vd .trk.t-late{--tk:var(--st-late);--tk-bg:var(--st-late-bg)}
.vd .trk.t-bad{--tk:var(--st-bad);--tk-bg:var(--st-bad-bg)}
.vd .trk.t-done{--tk:var(--st-muted);--tk-bg:var(--st-muted-bg)}
/* earlier days of this week, folded into one line */
.vd .ib-past{border-bottom:1px solid var(--line);background:var(--paper)}
.vd .ib-past .ib-date{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;padding:9px 14px}
.vd .ib-past .ib-date b{font:600 13.5px/1.3 var(--font-ui)}
.vd .ib-past .ib-col p{margin:0;padding:4px 14px;font-size:13px;color:var(--ink-3)}
.vd .ib-past-btn{margin:0;border:0;background:none;padding:0;font:600 13px/1.3 var(--font-ui);color:var(--leaf);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.vd .ib-hint{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
/* the statuses, in the order goods move */
.vd .ib-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px}
.vd .ib-legend h3{margin:0 0 8px;font:600 14px/1.3 var(--font-ui);color:var(--ink)}
.vd .ib-legend p{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
.vd .ib-legend .ib-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:0}
.vd .ib-arr{color:var(--ink-3);font-size:13px;padding:0 2px}
.vd .ib-legend dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;margin:0;align-items:baseline}
.vd .ib-legend dd{margin:0;font-size:13.5px;color:var(--ink-2)}
.vd .ib-legend ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.vd .ib-legend .vrule{grid-column:1 / -1;font-size:14.5px}
@media (max-width:760px){.vd .ib-legend{grid-template-columns:minmax(0,1fr)}}
.vd .act.prop::before{background:var(--st-info)}
/* a medium board: two columns stay, the status word sits above the line it belongs to */
@container ib (min-width:721px) and (max-width:1000px){
  .vd .ib{--ib-date:96px}
  .vd .ib-row{grid-template-columns:minmax(0,1fr) 14px;gap:4px 10px}
  .vd .ib-row .pill{grid-column:1}
  .vd .ib-row .ib-txt{grid-column:1}
  .vd .ib-row .ib-chev{grid-column:2;grid-row:1}
}
/* a narrow board: each day stacks what comes in above what goes out */
@container ib (max-width:720px){
  .vd .ib-head{display:none}
  .vd .ib-day,.vd .ib-past{grid-template-columns:minmax(0,1fr)}
  .vd .ib-date{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:10px 12px 4px}
  .vd .ib-date em{margin:0 0 0 auto}
  .vd .ib-col{border-left:0;padding:0 0 6px}
  .vd .ib-day .ib-col.empty{display:none}
  .vd .ib-day.quiet::after{content:"Niets gepland";padding:0 12px 10px;font-size:13px;color:var(--ink-3)}
  .vd .ib-colh{display:block;padding:4px 12px 2px;font:600 12.5px/1.3 var(--font-ui);color:var(--ink-3)}
  .vd .ib-row{grid-template-columns:minmax(0,1fr) 14px;gap:5px 10px;padding:7px 12px}
  .vd .ib-row .pill{grid-column:1}
  .vd .ib-row .ib-txt{grid-column:1}
  .vd .ib-row .ib-chev{grid-column:2;grid-row:1}
  .vd .ib-detail{padding:4px 12px 14px}
  .vd .ib-past .ib-col p{padding:0 12px 6px}
  .vd .ib-past .ib-colh{padding-top:0}
}
@container ib (max-width:440px){.vd .trk b{font-size:11.5px}.vd .trk small{font-size:10.5px}}

/* the month: per day a count of what comes in and goes out */
.vd .mcal-wrap{border:1px solid var(--line);background:var(--sheet);container:mcal / inline-size}
.vd .mcal{display:grid;grid-template-columns:50px repeat(7,minmax(0,1fr))}
.vd .mhead,.vd .mrow{display:contents}
.vd .mhead span{padding:8px 10px;border-bottom:1px solid var(--line-2);font:600 12px/1.2 var(--font-ui);color:var(--ink-3)}
.vd .mhead span:first-child{border-right:1px solid var(--line)}
.vd .mwk{display:flex;align-items:flex-start;justify-content:center;margin:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);padding:10px 4px;font:600 11.5px/1.2 var(--font-ui);color:var(--ink-3);text-align:center}
.vd button.mwk{cursor:pointer}
.vd button.mwk:hover{color:var(--ink);background:var(--paper-2)}
.vd .mrow:last-child > *{border-bottom:0}
.vd .mday{min-width:0;min-height:86px;margin:0;padding:7px 8px 9px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;font:inherit;color:inherit;text-align:left}
.vd .mrow > .mday:last-child{border-right:0}
.vd button.mday{cursor:pointer}
.vd button.mday:hover{background:var(--paper)}
.vd .mday.sun{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(18,22,20,.035) 6px 7px)}
.vd .mday.m-out{background:var(--paper)}
.vd .mday.m-out .md-n{color:var(--ink-3);font-weight:400}
.vd .mday.m-out .mcs{opacity:.6}
.vd .mday.past:not(.m-out) .md-n{color:var(--ink-3)}
.vd .mday.is-today{box-shadow:inset 0 3px 0 var(--forest)}
.vd .md-h{display:flex;align-items:baseline;gap:6px;min-width:0}
.vd .md-n{font:600 15px/1.2 var(--font-ui)}
.vd .md-today{font:700 11px/1 var(--font-ui);color:var(--forest)}
.vd .mcs{display:flex;flex-wrap:wrap;gap:4px}
.vd .mc{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 6px;border-radius:999px;font:600 12.5px/1.3 var(--font-ui);background:var(--st-ok-bg);color:var(--st-ok-ink)}
.vd .mc i{font-style:normal;font-weight:700}
.vd .mc b{margin-left:2px;font-weight:800}
.vd .mc.t-info{background:var(--st-info-bg);color:var(--st-info-ink)}
.vd .mc.t-risk{background:var(--st-risk-bg);color:var(--st-risk-ink)}
.vd .mc.t-late{background:var(--st-late-bg);color:var(--st-late-ink)}
.vd .mc.t-bad{background:var(--st-bad-bg);color:var(--st-bad-ink)}
.vd .mc.t-done{background:var(--st-muted-bg);color:var(--st-muted-ink)}
@container mcal (max-width:560px){
  .vd .mcal{grid-template-columns:30px repeat(7,minmax(0,1fr))}
  .vd .mhead span{padding:6px 4px;font-size:11px}
  .vd .mwk{padding:8px 0;font-size:10px}
  .vd .mday{min-height:64px;padding:5px 3px 6px;gap:3px}
  .vd .md-n{font-size:13px}
  .vd .md-today{display:none}
  .vd .mcs{flex-direction:column;align-items:flex-start;gap:2px}
  .vd .mc{padding:1px 5px 1px 3px;font-size:11px;gap:1px}
  .vd .mc b{display:none}
}

/* ---------- live screen (#/desk/live): the same board, big and calm, readable from across the room ---------- */
.vd.live{--lv-pad:clamp(16px,2.25vw,96px);--lv-gap:clamp(10px,min(.94vw,1.7vh),40px);font-size:clamp(13px,min(.94vw,1.7vh),40px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--lv-gap);min-height:100vh;min-height:100dvh;padding:0 0 .9em;background:var(--paper);color:var(--ink)}
.vd.live :focus-visible{outline-offset:3px}
.lv-top{display:flex;align-items:center;gap:1.2em;padding:.75em var(--lv-pad);background:var(--forest);color:var(--on-ink)}
.lv-top :focus-visible{outline-color:var(--on-ink)}
.lv-top .wordmark{gap:.6em}
.lv-top .wordmark .mark{height:2.7em}
.lv-top .wm-txt{gap:.35em}
.lv-top .wm-txt b{color:#fff;font-size:1.6em}
.lv-top .wm-txt i{color:var(--on-ink-2);font-size:.5em}
.lv-h{display:flex;align-items:center;gap:.55em;margin:0;padding-left:1.1em;border-left:1px solid var(--on-ink-line);font:500 2em/1 var(--font-display);color:#fff}
.lv-on{display:inline-flex;align-items:center;gap:.5em;padding:.45em .8em;border:1px solid rgba(191,227,180,.45);border-radius:999px;font:700 .34em/1 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:#cdebc2}
.lv-on i{width:.8em;height:.8em;border-radius:50%;background:#7fd66b;animation:lvpulse 2.2s ease-out infinite}
@keyframes lvpulse{0%{box-shadow:0 0 0 0 rgba(127,214,107,.6)}70%{box-shadow:0 0 0 .7em rgba(127,214,107,0)}100%{box-shadow:0 0 0 0 rgba(127,214,107,0)}}
@media (prefers-reduced-motion:reduce){.lv-on i{animation:none}}
.lv-ctl{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.6em;font-size:max(13px,.74em);transition:opacity .6s}
.lv-ctl .seg{padding:.2em;background:transparent;border-color:var(--on-ink-line)}
.lv-ctl .seg button{padding:.45em 1.05em;font-size:1em;color:var(--on-ink-2)}
.lv-ctl .seg button:hover{color:#fff}
.lv-ctl .seg button[aria-pressed="true"]{background:var(--on-ink);color:var(--forest)}
.lv-btn{display:inline-flex;align-items:center;min-height:2.5em;padding:.45em 1.05em;border:1px solid var(--on-ink-line);border-radius:999px;background:transparent;color:var(--on-ink);font:600 1em/1.2 var(--font-ui);text-decoration:none;cursor:pointer}
.lv-btn:hover{border-color:var(--on-ink);color:#fff}
.lv-clock{display:grid;justify-items:end;gap:.3em;text-align:right;flex:none}
.lv-clock b{font:600 2.9em/1 var(--font-ui);letter-spacing:.02em;color:#fff}
.lv-clock span{font-size:.8em;color:var(--on-ink-2)}
.lv-idle .lv-ctl{opacity:0}
.lv-idle .lv-ctl:focus-within{opacity:1}
.lv-idle .vd.live,.lv-idle .vd.live *{cursor:none}

.lv-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--lv-gap);padding:0 var(--lv-pad)}
.vd .lv-kpi{display:flex;align-items:center;gap:.7em;min-width:0;padding:.75em 1.1em;background:var(--sheet);border:1px solid var(--line);border-left:.35em solid var(--line-2);color:var(--ink);font-weight:400}
.lv-kpi b{font:600 3.2em/1 var(--font-ui)}
.lv-kpi span{font-size:1em;line-height:1.25;color:var(--ink-2)}
.lv-kpi.k-over{border-left-color:var(--st-bad)}
.lv-kpi.k-over b{color:var(--st-bad-ink)}
.lv-kpi.k-risk{border-left-color:var(--st-risk)}
.lv-kpi.k-risk b{color:var(--st-risk-ink)}
.lv-kpi.k-ok{border-left-color:var(--st-ok)}
.lv-kpi.k-ok b{color:var(--st-ok-ink)}
.lv-kpi.k-plain{border-left-color:var(--forest)}
.lv-kpi.k-zero b{color:var(--ink-3)}

.lv-card{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;margin:0 var(--lv-pad);background:var(--sheet);border:1px solid var(--line)}
.lv-card-h{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4em 1.2em;padding:.7em 1.1em;border-bottom:1px solid var(--line)}
.lv-card-h h2{margin:0;font:500 1.55em/1.1 var(--font-display)}
.lv-sub{font-size:max(11px,.78em);color:var(--ink-3)}
.lv-plan .mcal-wrap{flex:1 1 auto;min-height:0;border:0;overflow:hidden}
/* two boards, like arrivals and departures: grouped by day, one line per order */
.lv-boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--lv-gap);padding:0 var(--lv-pad);min-height:0}
.lv-boards .lv-card{margin:0}
.lv-card-h h2 small{margin-left:.35em;font:400 .5em/1 var(--font-ui);color:var(--ink-3)}
.lvb{flex:1 1 auto;min-height:0;overflow:hidden;border:0}
.vd .lvb-day{border-bottom:1px solid var(--line)}
.vd .lvb-day[hidden],.vd .lvb li[hidden]{display:none}
.vd .lvb-day h3{margin:0;padding:.55em 1.1em .25em;font:600 max(11px,.74em)/1.3 var(--font-ui);color:var(--ink-3)}
.vd .lvb-day.is-today{background:#f5f8f1;box-shadow:inset .3em 0 0 var(--forest)}
.vd .lvb-day.is-today h3{color:var(--forest)}
.vd .lvb ul{list-style:none;margin:0;padding:0 0 .35em}
.vd .lvb-none{margin:0;padding:.2em 1.1em .7em;font-size:max(11px,.8em);color:var(--ink-3)}
.vd.live .lvb{--pw:8.1em}
.vd.live .lv-board:last-child .lvb{--pw:10.4em}
.vd.live .ib-row{grid-template-columns:var(--pw) minmax(0,1fr);gap:.1em .8em;padding:.32em 1.1em}
.vd.live .pill{font-size:max(10.5px,.72em)}
.vd.live .ib-txt b{font-size:1em}
.vd.live .ib-sub{font-size:max(11px,.76em)}
/* one line per order on the big screen, so more days fit */
.vd.live .ib-txt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd.live .ib-sub{display:inline;margin-left:.7em}
/* the month, scaled up */
.vd.live .mcal{grid-template-columns:3.1em repeat(7,minmax(0,1fr))}
.vd.live .mhead span{padding:.5em .7em;font-size:max(10px,.7em)}
.vd.live .mwk{padding:.6em .2em;font-size:max(10px,.68em)}
.vd.live .mday{min-height:5em;padding:.4em .55em .5em;gap:.3em}
.vd.live .md-n{font-size:1.05em}
.vd.live .md-today{font-size:max(9px,.6em)}
.vd.live .mcs{gap:.3em}
.vd.live .mc{font-size:max(12px,1em);padding:.2em .7em .2em .55em}
.lv-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.2em 1.4em;padding:0 var(--lv-pad);font-size:max(10.5px,.7em);color:var(--ink-3)}

/* a landscape screen: everything on one page, nothing to scroll */
@media (min-width:1100px) and (min-height:600px){
  .vd.live{height:100vh;height:100dvh;overflow:hidden}
  .vd.live .lv-plan .mcal{height:100%;grid-template-rows:auto repeat(var(--rows),minmax(min-content,1fr))}
  .vd.live .lv-plan .mday{min-height:0}
}
/* smaller or upright screens: the same parts, stacked */
@media (max-width:1099px){
  .vd.live{--lv-pad:16px;font-size:15px}
  .lv-top{flex-wrap:wrap}
  .lv-h{font-size:1.6em}
  .lv-clock b{font-size:2.2em}
  .lv-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lv-boards{grid-template-columns:minmax(0,1fr)}
  .vd.live .ib-txt{white-space:normal}
}
@media (max-width:560px){
  .lv-top .wm-txt{display:none}
  .lv-h{border-left:0;padding-left:0}
  .lv-ctl{order:5;margin-left:0;width:100%;justify-content:flex-start}
  .lv-clock{margin-left:auto}
  .lv-kpi b{font-size:2.4em}
  .lv-kpi{padding:.6em .8em}
  .vd.live .ib-row{grid-template-columns:minmax(0,1fr);gap:.3em}
}

/* ---------- desk: the forest header with Jan's logo, and small fixes ---------- */
.desk-top{background:var(--forest)}
.desk-top .wordmark .mark{height:40px}
.desk-top .wm-txt b{font-size:24px}
.desk-top .wm-txt i{font-size:7.7px}
.nav-item.on,.cust-item.on{background:var(--forest)}
.nav-item.on .n{color:var(--forest)}
.filters button.on{background:var(--forest);border-color:var(--forest)}
.toast{background:var(--forest)}
.score-pill.top{background:var(--leaf)}
/* Klanten: the overview fits without scrolling sideways */
.ov th{white-space:normal;letter-spacing:.12em;vertical-align:bottom}
.ov td .ci-sub{display:block;margin-top:2px}
@media (max-width:640px){.desk-top{gap:10px 12px}.desk-top .wm-txt{display:none}}
@media (max-width:560px){
  .vd .status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .vd .status > div{border-bottom:1px solid var(--line)}
  .vd .status > div:nth-child(2n){border-right:0}
  .vd .status > div:nth-child(n+3){border-bottom:0}
}

/* ---------- Boekhouding (Exact): summary, payment calendar, where the money goes, lists ---------- */
.acc-page{display:grid;gap:22px}
.acc-page .page-head{margin-bottom:0}
.acc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.acc-kpi{background:var(--sheet);padding:16px 18px 18px;display:grid;gap:6px;align-content:start;min-width:0}
.acc-kpi .lbl{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.acc-kpi .val{font:600 30px/1.05 var(--font-ui);letter-spacing:-.01em;color:var(--ink)}
.acc-kpi .sub{font-size:13px;line-height:1.45;color:var(--ink-3)}
.acc-kpi.warn{box-shadow:inset 0 3px 0 var(--warn)}
.acc-ico{display:inline-grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;background:var(--warn);color:#fff;font:700 11px/1 var(--font-ui)}
.acc-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px;align-items:start}
.acc-panel{background:var(--sheet);border:1px solid var(--line);padding:18px 20px 20px;display:grid;gap:16px;align-content:start;min-width:0}
.acc-ph{display:grid;gap:4px}
.acc-ph.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 18px}
.acc-ph.row > div{display:grid;gap:4px;flex:1 1 360px;min-width:0}
.acc-ph h2{font:500 28px/1.1 var(--font-display);color:var(--forest)}
.acc-ph p{font-size:14.5px;line-height:1.55;color:var(--ink-2);max-width:64ch}
.acc-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.acc-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.cal{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.cal-row{display:grid;grid-template-columns:104px minmax(0,1fr) 84px;align-items:center;gap:12px}
.cal-lbl{display:grid;gap:1px;line-height:1.25}
.cal-lbl b{font-weight:600;font-size:14.5px}
.cal-lbl span{font-size:12.5px;color:var(--ink-3)}
.cal-bar{display:flex;gap:2px;height:20px;min-width:0;border-left:1px solid var(--line-2);padding-left:1px}
.cal-bar .seg{display:block;height:100%;min-width:4px;cursor:default;transition:filter .12s}
.cal-bar .seg:last-child{border-radius:0 4px 4px 0}
.cal-bar .seg:hover,.cal-bar .seg:focus-visible{filter:brightness(1.18) saturate(1.1)}
.cal-bar .seg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cal-none{align-self:center;font-size:12.5px;color:var(--ink-3);padding-left:6px}
.cal-val{text-align:right;font-weight:600;font-size:14.5px;font-variant-numeric:lining-nums tabular-nums!important}
.acc-note{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.acc-note .acc-ico{margin-top:1px}
.acc-note a{color:var(--leaf);font-weight:600}
.acc-tbl summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--leaf);width:fit-content}
.acc-tbl .tbl-wrap{margin-top:10px}
.acc-tip{position:fixed;z-index:90;pointer-events:none;display:grid;gap:3px;min-width:150px;padding:8px 11px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;color:var(--ink-2)}

/* ---------- desk: one set of status colours, calmer pages, explanations folded away ---------- */
:root{
  --st-ok:#2e8540;--st-ok-bg:#e5f2e2;--st-ok-line:#6fb06f;--st-ok-ink:#1f6a33;
  --st-risk:#f0ad1c;--st-risk-bg:#fdf2d4;--st-risk-line:#e0a92e;--st-risk-ink:#6e4f00;
  --st-late:#e9844f;--st-late-bg:#fde7da;--st-late-line:#e48a5c;--st-late-ink:#93401a;
  --st-bad:#c8372f;--st-bad-bg:#fbe1de;--st-bad-line:#d5675f;--st-bad-ink:#9e2a23;
  --st-info:#3f6f8f;--st-info-bg:#e3edf3;--st-info-ink:#2d556f;
  --st-muted:#9aa29b;--st-muted-bg:#eceee8;--st-muted-ink:#555d57;
}

/* status pills: always an icon and a word, never colour alone */
.pill{display:inline-flex;align-items:center;gap:6px;flex:none;width:fit-content;padding:3px 9px 3px 4px;border-radius:999px;font:600 12.5px/1.3 var(--font-ui);white-space:nowrap}
.pill > i{display:inline-grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;font:700 10.5px/1 var(--font-ui);font-style:normal;color:#fff}
.pill.ok{background:var(--st-ok-bg);color:var(--st-ok-ink)} .pill.ok > i{background:var(--st-ok)}
.pill.risk{background:var(--st-risk-bg);color:var(--st-risk-ink)} .pill.risk > i{background:var(--st-risk);color:var(--ink)}
.pill.late,.pill.pattern{background:var(--st-late-bg);color:var(--st-late-ink)} .pill.late > i,.pill.pattern > i{background:var(--st-late);color:var(--ink)}
.pill.over,.pill.error{background:var(--st-bad-bg);color:var(--st-bad-ink)} .pill.over > i,.pill.error > i{background:var(--st-bad)}
.pill.fraud{background:var(--st-bad);color:#fff} .pill.fraud > i{background:#fff;color:var(--st-bad)}
.pill.wait,.pill.check{background:var(--st-info-bg);color:var(--st-info-ink)} .pill.wait > i,.pill.check > i{background:var(--st-info)}
.pill.credit,.pill.done,.pill.in{background:var(--st-muted-bg);color:var(--st-muted-ink)} .pill.credit > i,.pill.done > i,.pill.in > i{background:var(--st-muted)}

/* calmer pages: smaller titles, the explanation under a small "Uitleg" */
.ribbon{font-size:12px;padding:4px 16px}
.desk-main{padding:22px clamp(16px,2.6vw,36px) 64px}
.desk .page-head{align-items:center;margin-bottom:18px;gap:10px 20px}
.desk .page-head h1{font-size:clamp(28px,2.4vw,36px);margin-top:4px}
.ph-more{margin-top:4px}
.ph-more summary{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-size:13px;font-weight:600;color:var(--leaf);cursor:pointer;list-style:none;user-select:none}
.ph-more summary::-webkit-details-marker{display:none}
.ph-more summary::marker{content:""}
.ph-more summary::before{content:"i";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font:700 10px/1 var(--font-ui)}
.ph-more[open] summary{color:var(--ink-2)}
.desk .ph-more .lede-d{margin-top:6px;font-size:14px;line-height:1.55;max-width:72ch}
.desk .block{margin-top:20px}
.desk .fold-btn h2{font-size:24px}
.desk .block-head h2{font-size:24px}
.desk .block.fold > .fold-head{padding-bottom:8px;margin-bottom:10px}
.desk .block.fold.closed > .fold-head{margin-bottom:0}
.desk .block.panel-fold > .fold-head{padding:10px 18px;margin:0}
.desk .intro{font-size:14px;margin-bottom:10px}
.desk .fold-meta{font-size:13.5px}
.desk .slip{padding:12px 16px;gap:6px 16px}
.desk .notice{font-size:14px;padding:8px 12px;margin-top:8px}
.desk .cards{gap:10px}
.fold-meta .pill{vertical-align:middle}

/* ---------- Facturen: one list, one status per invoice ---------- */
.ivf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ivf button{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line-2);background:var(--sheet);font-size:13.5px;font-weight:600;color:var(--ink);border-radius:999px}
.ivf button:hover{border-color:var(--ink)}
.ivf button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.ivf button .dot{width:9px;height:9px;border-radius:50%;flex:none}
.ivf button .n{font-weight:500;color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums!important}
.ivf button[aria-pressed="true"] .n{color:rgba(255,255,255,.75)}
.ivf .sep{width:1px;background:var(--line-2);margin:4px 4px}
.ivl{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line)}
.ivl-head,.ivr-main{display:grid;grid-template-columns:148px minmax(0,1fr) 110px 132px 224px 22px;align-items:center;gap:6px 16px;padding:10px 14px}
.ivl-head{padding-block:8px;background:var(--paper);border-bottom:1px solid var(--line);font:600 11px/1.3 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ivl-head .r{text-align:right}
.ivr{border-bottom:1px solid var(--line);position:relative}
.ivr:last-child{border-bottom:0}

.ivr.fraud::before,.ivr.error::before{background:var(--st-bad)}
.ivr.pattern::before{background:var(--st-late)}
.ivr.wait::before,.ivr.check::before{background:var(--st-info)}
.ivr.ok::before{background:var(--st-ok)}
.ivr.handled{background:var(--paper)}
.ivr.handled .ivr-who b,.ivr.handled .ivr-amt{color:var(--ink-2)}
.ivr-main{cursor:pointer}
.ivr-main:hover{background:var(--paper)}
.ivr-who{display:grid;gap:2px;min-width:0}
.ivr-who .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}

.ivr-who .mono{font-size:12.5px;color:var(--ink-3)}

.ivr-amt{text-align:right;font-weight:600;font-size:15px;font-variant-numeric:lining-nums tabular-nums!important}

.ivr-due{font-size:13.5px;color:var(--ink-2);white-space:nowrap}

.ivr-act{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 10px}

.ivr-tog{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;padding:0}
.ivr-tog span{width:8px;height:8px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
.ivr[data-open="true"] .ivr-tog span{transform:rotate(-135deg);margin-top:3px}
.ivr-detail{padding:2px 14px 16px 180px;display:grid;gap:8px}
.ivr-detail .ind{margin:0}

.ivl-more{display:flex;justify-content:center;padding:10px}
.iv-legend{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;align-items:start;margin:0}

@media (max-width:1100px){

.mail-hd{display:grid;gap:0;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mail-hd > div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.mail-hd > div:last-child{border-bottom:0}
.mail-hd dt{font:600 10.5px/1.9 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mail-hd dd{margin:0;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.mail-hd dd .mono,.mail-hd dd.mono{font-size:13px;color:var(--ink-2)}
.mail-hd dd small{display:block;margin-top:2px;font-size:12.5px;color:var(--st-bad-ink);font-weight:600}
.mail-hd > div.bad dd .mono{color:var(--st-bad-ink);font-weight:600}
.mail-body{display:grid;gap:10px;font-size:15px;line-height:1.6;color:var(--ink)}
.mail-body p{margin:0;max-width:66ch}
.mail-att{display:grid;gap:10px;padding:14px;background:var(--paper);border:1px solid var(--line)}
.mail-file{display:flex;align-items:center;gap:10px;margin:0;font-size:14px}
.mail-file svg{width:22px;height:26px;flex:none;color:var(--ink-3)}
.paper{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(16,41,30,.08);padding:22px 24px 20px;display:grid;gap:12px;min-width:0}
.pp-scroll{overflow-x:auto;min-width:0}
.pp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.pp-head b{font-size:16px;font-weight:700}
.pp-head span{font-size:12.5px;color:var(--ink-3)}
.pp-title{margin:0;font:700 12px/1.3 var(--font-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.pp-meta{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0}
.pp-meta > div{display:grid;gap:1px}
.pp-meta dt{font:600 10px/1.3 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pp-meta dd{margin:0;font-size:13.5px;font-weight:600}
.pp-meta dd.mono{font-weight:400}
.pp-t{width:100%;border-collapse:collapse;font-size:13.5px}
.pp-t th{font:600 10px/1.3 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:none;border-bottom:1px solid var(--ink);padding:6px 8px;text-align:left}
.pp-t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pp-t .r{text-align:right}
.pp-t tfoot td{border-bottom:0;padding-top:6px}
.pp-t tfoot tr:first-child td{border-top:1px solid var(--ink)}
.pp-t tr.raw td{background:var(--st-info-bg)}
.pp-t tr.raw .mono{font-size:12.5px;margin-right:10px}
.pp-t tr.raw .pill{vertical-align:middle}
.pp-foot{margin:0;font-size:12.5px;color:var(--ink-3)}
.pp-foot.flag{color:var(--st-bad-ink);font-weight:600}
.blur{filter:blur(2.4px);user-select:none}
.mail-read{margin:0;font-size:13.5px;color:var(--ink-2)}
@media (max-width:560px){
  .mail-dlg h2{font-size:24px}
  .mail-hd > div{grid-template-columns:76px minmax(0,1fr);gap:8px}
  .paper{padding:16px 14px}
}
.mail-dlg #dlg-h:focus{outline:none}
@media (max-width:560px){.pp-t{font-size:12.5px}.pp-t th,.pp-t td{padding:6px 5px}}

/* A year of earlier orders, generated the same way on every visit */
function seeded(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function inSeason(p, d) {
  const s = PLANTS[p].season; if (!s) return true;
  const m = d.getMonth() + 1;
  return s[0] <= s[1] ? m >= s[0] && m <= s[1] : m >= s[0] || m <= s[1];
}
const HISTORY = (() => {
  const out = [];
  Object.keys(CUSTOMERS).forEach((key, ci) => {
    const c = CUSTOMERS[key], r = seeded(1009 + ci * 7919);
    const stopAt = c.stopped ? T(-58) : T(-10);
    let d = addDays(T(-364), Math.floor(r() * c.every));
    while (d < stopAt) {
      const pool = c.mix.filter(p => inSeason(p, d));
      const use = pool.length ? pool : c.mix;
      const picked = use.slice().sort(() => r() - 0.5).slice(0, 1 + Math.floor(r() * Math.min(3, use.length)));
      const lines = picked.map(p => {
        const pl = PLANTS[p], steps = Math.floor((pl.range[1] - pl.range[0]) / pl.step);
        return [p, pl.size, pl.range[0] + pl.step * Math.floor(r() * (steps + 1)), Math.round(pl.sell * (0.95 + r() * 0.1) * 100) / 100];
      });
      out.push({ cust: key, lines, ordered: d, when: addDays(d, 3 + Math.floor(r() * 4)), step: 3, past: true });
      d = addDays(d, Math.max(4, Math.round(c.every * (0.75 + r() * 0.5))));
    }
  });
  out.sort((a, b) => a.ordered - b.ordered);
  const byYear = {};
  out.forEach(o => { const y = o.ordered.getFullYear(); (byYear[y] = byYear[y] || []).push(o); });
  Object.keys(byYear).forEach(y => {
    const list = byYear[y], current = Number(y) === TODAY.getFullYear();
    const last = current ? 389 : 612, step = current ? Math.max(1, Math.floor(388 / (list.length + 1))) : 2;
    list.forEach((o, i) => { o.id = `CI-${String(y).slice(2)}-${String(Math.max(1, last - (list.length - 1 - i) * step)).padStart(4, '0')}`; });
  });
  return out;
})();

const PARTS = [
  { k: 'price',  name: 'Prijs op de stoep', short: 'Prijs' },
  { k: 'lead',   name: 'Levertijd',         short: 'Levertijd' },

const TRAVEL_FRAC = [1, 10 / 15, 6 / 15, 2 / 15];
const perPiece = o => (o.pack.per === 'piece' ? o.price : o.price / o.pack.n);
const reviewDone = id => !!S.review[id];
const sumW = cfg => PARTS.reduce((s, p) => s + (Number(cfg.w[p.k]) || 0), 0);
function weights(cfg) {
  const sum = sumW(cfg) || 1, W = {};
  PARTS.forEach(p => { W[p.k] = (Number(cfg.w[p.k]) || 0) * 100 / sum; });
  return W;
}
function travelFrac(h, cfg) { const b = cfg.bands; return h <= b[0] ? TRAVEL_FRAC[0] : h <= b[1] ? TRAVEL_FRAC[1] : h <= b[2] ? TRAVEL_FRAC[2] : TRAVEL_FRAC[3]; }
function allOffers() {
  const list = OFFERS.slice();
  if (S.review.r1 && S.review.r1.ok) list.push(REVIEW[0].offer);
  if (S.review.r2 && S.review.r2.n) list.push(Object.assign({}, REVIEW[1].offer, { pack: { per: 'tray', n: S.review.r2.n } }));
  return list;
}
const quoteFiles = () => [...new Set(OFFERS.map(o => o.file).concat(REVIEW.filter(r => r.file).map(r => r.file)))];
const linesRead = () => OFFERS.length + REVIEW.filter(r => r.file).length + OTHER_SIZES.length;
function scoreNeed(need, cfg = P.score) {
  const W = weights(cfg);
  const rows = allOffers().filter(o => o.need === need.id).map(o => {
    const unit = perPiece(o), q = Math.min(o.qty, need.qty), landed = unit + o.freight / q;
    return { o, unit, q, landed, cmp: cfg.freight ? landed : unit, daysLate: Math.max(0, daysFrom(need.needed, o.arrive)), expired: daysFrom(TODAY, o.valid) < 0 };
  });
  if (!rows.length) return rows;
  const best = Math.min(...rows.map(r => r.cmp));
  rows.forEach(r => {
    const f = {
      price: best / r.cmp,
      lead: Math.max(0, 1 - (cfg.latePct / 100) * r.daysLate),
      travel: travelFrac(r.o.travelH, cfg),
      qty: r.o.qty >= need.qty ? 1 : cfg.qtyMode === 'ratio' ? r.o.qty / need.qty : 0,
      valid: r.expired ? 0 : 1,
    };
    r.W = W; r.parts = {};
    PARTS.forEach(p => { r.parts[p.k] = Math.round(W[p.k] * f[p.k]); });
    r.total = PARTS.reduce((s, p) => s + r.parts[p.k], 0);
    r.best = best;
  });
  rows.sort((a, b) => b.total - a.total || a.landed - b.landed);
  return rows;
}

const findSlip = id => SLIPS.concat(ARCHIVE_SLIPS).find(s => s.id === id) || null;

const RANKS = {
  suspicious: { label: 'Niet betalen', sub: 'Verdacht', cls: 'dont' },
  hold:       { label: 'Niet betalen', sub: 'Wacht',    cls: 'dont' },
  today:      { label: 'Vandaag',      cls: 'today' },

  review:     { label: 'Checken',      cls: 'review' },

function invAmount(inv) {
  if (!inv.scan) return inv.amount;
  return S.review.r3 && S.review.r3.amount != null ? S.review.r3.amount : null;
}
function checkInv(inv) {
  const g = inv.grower ? GROWERS[inv.grower] : null;
  const po = inv.po ? POS[inv.po] : null;
  const slip = inv.slip ? findSlip(inv.slip) : null;
  const amount = invAmount(inv);
  const k = {
    order: !!po, slip: !slip ? 'no' : slip.issue ? 'differs' : 'yes', amount: 'unread', grower: !!g,
    iban: !g ? 'unknown' : inv.iban === g.iban ? 'same' : 'changed', dup: !!inv.dupOf,
    po, slipDoc: slip, value: amount, expected: null,
  };
  if (amount != null) {
    if (!po) k.amount = 'differs';
    else {
      const delivered = slip && (slip.issue === 'fewer' || slip.issue === 'partial') ? slip.got : po.qty;
      k.expected = delivered * po.price;
      k.amount = Math.abs(amount - k.expected) < 0.005 ? 'equal' : 'differs';
    }
  }
  if (inv.credit) k.rank = 'credit';
  else if (k.amount === 'unread') k.rank = 'review';
  else if (!k.grower || k.iban === 'changed' || k.dup || (!k.order && k.slip === 'no')) k.rank = 'suspicious';
  else if (!k.order || k.slip !== 'yes' || k.amount !== 'equal') k.rank = 'hold';
  else { const d = daysFrom(TODAY, inv.due); k.rank = d <= 2 ? 'today' : d <= 7 ? 'week' : 'later'; }
  k.notice = noticeFor(inv, k, g);
  return k;
}
function noticeFor(inv, k, g) {
  const po = k.po, slip = k.slipDoc;
  if (k.rank === 'suspicious') {
    if (inv.lookalike) {
      const real = GROWERS[inv.lookalike];
      return `Afzender <span class="mono">${esc(inv.sender)}</span> is geen bekende kweker. De naam wijkt één letter af van ${esc(real.name)}. Geen bestelling, geen pakbon, en de mail vraagt om vandaag te betalen. Het IBAN eindigt op ${inv.iban}; van ${esc(real.name)} staat er een op ${real.iban} in het systeem.`;
    }
    if (k.dup) return `Factuurnummer ${esc(inv.no)} kwam al binnen op ${fDay(inv.dupOf)} (wk ${isoWeek(inv.dupOf)}) en ging toen naar de boekhouding.`;
    if (k.iban === 'changed') return `Het IBAN eindigt op ${inv.iban}. Eerdere facturen van ${esc(g.name)} gebruiken er een op ${g.iban}. Het bekende nummer van ${esc(g.name)} is betrouwbaarder dan een nummer op deze factuur.`;
    return 'Geen bestelling en geen pakbon bij deze factuur.';
  }
  if (k.rank === 'hold') {
    const p = po ? pn(po.plant) : '';
    if (slip && slip.issue === 'fewer') return `Gefactureerd: ${qty(po.qty)} × ${p} ${po.size}. De pakbon zegt ${qty(slip.got)} binnen: ${qty(po.qty - slip.got)} minder, dus ${eur(k.value - k.expected)} meer gefactureerd dan geleverd.`;
    if (slip && slip.issue === 'partial') return `Deellevering: ${qty(slip.got)} van ${qty(slip.of)} ${p} binnen, de rest verwacht ${wkTxt(slip.rest)}. De factuur is voor alle ${qty(slip.of)}. Geen fout, maar de factuur klopt pas als de rest binnen is, of met een factuur voor ${qty(slip.got)} (${eur(k.expected)}).`;
    if (slip && slip.issue === 'size') return `Andere maat: besteld en gefactureerd ${po.size}, de pakbon zegt dat ${slip.gotSize} is geleverd.`;
    if (!k.order) return 'Er is geen bestelling van jou bij deze factuur.';
    if (k.slip === 'no') return 'Nog geen pakbon. Hij blijft liggen tot de pakbon zegt dat het binnen is.';
    if (k.amount === 'differs') return `Het bedrag wijkt af van je bestelling: ${eur(k.value)} gefactureerd, ${eur(k.expected)} verwacht.`;
  }

  const os = custOrders(key);

  const value = year.reduce((s, o) => s + orderValue(o), 0);

  const gaps = asc.slice(1).map((d, i) => daysFrom(asc[i], d));

      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];

    return out;
  }
  const dirAt = (path, i) => { const a = path[Math.max(0, i - 1)], b = path[Math.min(path.length - 1, i + 1)]; return Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; };

  function pot(cx, top, w, h) {
    const r = 3.2, tw = w / 2, bw = w * 0.38;
    return `<path d="M${n(cx - tw + 2)} ${n(top + r)}L${n(cx - bw)} ${n(top + h)}L${n(cx + bw)} ${n(top + h)}L${n(cx + tw - 2)} ${n(top + r)}Z" fill="${C.pot}"/>`
      + `<path d="M${n(cx + tw * 0.2)} ${n(top + r)}L${n(cx + bw * 0.55)} ${n(top + h)}L${n(cx + bw)} ${n(top + h)}L${n(cx + tw - 2)} ${n(top + r)}Z" fill="${C.potShade}"/>`
      + `<rect x="${n(cx - tw)}" y="${n(top)}" width="${n(w)}" height="${n(r * 2)}" rx="1.4" fill="${C.potRim}"/>`;
  }

  /* ---------- flowers ---------- */
  function orchid(x, y, s, rot = 0) {
    const e = (ang, rx, ry, d, fill) => { const c = at(x, y, ang + rot, d, 0); return `<ellipse cx="${n(c[0])}" cy="${n(c[1])}" rx="${n(rx)}" ry="${n(ry)}" transform="rotate(${n(ang + rot)} ${n(c[0])} ${n(c[1])})" fill="${fill}" stroke="${C.orchidEdge}" stroke-width="${n(s * 0.04)}"/>`; };
    return e(-90, s * 0.5, s * 0.2, s * 0.42, C.orchid) + e(140, s * 0.48, s * 0.19, s * 0.4, C.orchid) + e(40, s * 0.48, s * 0.19, s * 0.4, C.orchid)
      + e(-12, s * 0.52, s * 0.44, s * 0.44, C.orchid) + e(192, s * 0.52, s * 0.44, s * 0.44, C.orchid)
      + `<path d="M${n(x - s * 0.2)} ${n(y + s * 0.06)}Q${n(x)} ${n(y + s * 0.58)} ${n(x + s * 0.2)} ${n(y + s * 0.06)}Q${n(x)} ${n(y + s * 0.2)} ${n(x - s * 0.2)} ${n(y + s * 0.06)}Z" fill="${C.lip}"/>`
      + `<circle cx="${n(x)}" cy="${n(y)}" r="${n(s * 0.11)}" fill="#fff"/><circle cx="${n(x)}" cy="${n(y + s * 0.14)}" r="${n(s * 0.06)}" fill="${C.eye}"/>`;
  }
  function floret(x, y, s, fill, eye) {
    let o = '';
    for (let k = 0; k < 4; k++) { const c = at(x, y, k * 90 + 45, s * 0.55, 0); o += `<circle cx="${n(c[0])}" cy="${n(c[1])}" r="${n(s * 0.55)}" fill="${fill}"/>`; }
    return o + `<circle cx="${n(x)}" cy="${n(y)}" r="${n(s * 0.22)}" fill="${eye}"/>`;
  }
  function cluster(cx, cy, r, s, colors, seed, eye) {
    const R = rng(seed), pts = [];
    const step = s * 1.55;
    for (let yy = -r; yy <= r; yy += step * 0.86) for (let xx = -r; xx <= r; xx += step) {
      const ox = xx + (Math.round(yy / (step * 0.86)) % 2 ? step / 2 : 0) + (R() - 0.5) * s * 0.5, oy = yy + (R() - 0.5) * s * 0.5;
      if (ox * ox / (r * r) + oy * oy / (r * r * 0.72) <= 1) pts.push([cx + ox, cy + oy * 0.85]);
    }
    pts.sort((a, b) => a[1] - b[1]);
    return pts.map(p => floret(p[0], p[1], s * (0.85 + R() * 0.3), colors[Math.floor(R() * colors.length)], eye)).join('');
  }
  /* Catmull-Rom segments only (no M), for building closed outlines out of several runs */
  const segs = pts => smooth(pts).replace(/^M[^C]*/, '');
  let uid = 0;

  /* a rounded heart-shaped leaf (cyclamen), with a lighter marbled band inside */
  function heartLeaf(x, y, a, s, fill, marble) {
    const P = (u, v) => at(x, y, a, u * s, v * s);
    const right = [[0, 0], [-0.1, 0.2], [0.02, 0.46], [0.28, 0.56], [0.58, 0.44], [0.86, 0.2], [1, 0]].map(([u, v]) => P(u, v));
    const left = [[1, 0], [0.86, -0.2], [0.58, -0.44], [0.28, -0.56], [0.02, -0.46], [-0.1, -0.2], [0, 0]].map(([u, v]) => P(u, v));
    const d = `M${pt(right[0])}${segs(right)}${segs(left)}Z`;
    let o = `<path d="${d}" fill="${fill}"/>`;
    if (marble) {
      const band = [[0.12, 0], [0.1, 0.22], [0.3, 0.36], [0.56, 0.28], [0.74, 0.1], [0.78, 0], [0.74, -0.1], [0.56, -0.28], [0.3, -0.36], [0.1, -0.22], [0.12, 0]].map(([u, v]) => P(u, v));
      const inner = [[0.2, 0], [0.22, 0.13], [0.36, 0.22], [0.54, 0.16], [0.64, 0], [0.54, -0.16], [0.36, -0.22], [0.22, -0.13], [0.2, 0]].map(([u, v]) => P(u, v));
      o += `<path d="M${pt(band[0])}${segs(band)}ZM${pt(inner[0])}${segs(inner)}Z" fill="${marble}" fill-rule="evenodd" opacity=".7"/>`;
    }
    return o;
  }

  /* ---------- the Monstera leaf: a heart-shaped blade, cut by splits from the edge and a row of holes near the midrib ---------- */
  function monstera(x, y, a, size, o = {}) {
    const id = `mo${++uid}`, bend = o.bend || 0, N = o.splits || 6;
    const P = (u, v) => at(x, y, a, u * size, (v + bend * 0.12 * Math.sin(Math.PI * Math.max(0, Math.min(1, u)))) * size);
    const R = [[0, 0], [-0.07, 0.12], [-0.1, 0.3], [-0.02, 0.45], [0.12, 0.55], [0.32, 0.6], [0.52, 0.55], [0.7, 0.43], [0.84, 0.27], [0.95, 0.1], [1, 0]];
    const half = s => R.map(([u, v]) => P(u, v * s));
    const right = half(1), left = half(-1).reverse();
    const blade = `M${pt(right[0])}${segs(right)}${segs(left)}Z`;
    const rightHalf = `M${pt(right[0])}${segs(right)}L${pt(P(0.5, 0))}Z`;
    // the splits: tapered, slightly curved cuts from beyond the edge towards the midrib; they fan out like the veins,
    // the lower ones almost square to the midrib, the upper ones swept towards the tip
    const cut = (inner, outer, wi, wo, bow) => {
      const A = P(...inner), B = P(...outer), dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
      const M = [(A[0] + B[0]) / 2 + nx * bow * L, (A[1] + B[1]) / 2 + ny * bow * L], wm = (wi + wo) / 2;
      return `M${pt([A[0] + nx * wi, A[1] + ny * wi])}Q${pt([M[0] + nx * wm, M[1] + ny * wm])} ${pt([B[0] + nx * wo, B[1] + ny * wo])}`
        + `L${pt([B[0] - nx * wo, B[1] - ny * wo])}Q${pt([M[0] - nx * wm, M[1] - ny * wm])} ${pt([A[0] - nx * wi, A[1] - ny * wi])}Z`
        + `M${pt([A[0] + wi, A[1]])}a${n(wi)} ${n(wi)} 0 1 0 ${n(-2 * wi)} 0a${n(wi)} ${n(wi)} 0 1 0 ${n(2 * wi)} 0Z`;
    };
    let cuts = '';
    const wi = size * 0.007, wo = size * (o.cut || 0.026);
    for (const s of [-1, 1]) {
      for (let i = 0; i < N; i++) {
        const f = i / (N - 1), u0 = 0.1 + f * 0.62 + Math.sin(i * 2.3 + s) * 0.02;
        cuts += cut([u0, s * (0.11 + 0.025 * Math.sin(i * 1.7 + s))], [u0 + 0.05 + f * 0.24, s * 0.8], wi, wo, s * (0.05 + f * 0.04));
      }
      // the lowest split runs back into the basal lobe
      cuts += cut([0.04, s * 0.13], [-0.14, s * 0.66], wi, wo * 0.9, -s * 0.04);
    }
    // holes between the splits, close to the midrib
    let holes = '';
    if (o.holes !== false) for (const s of [-1, 1]) for (let i = 0; i < N - 1; i++) {
      const u = 0.17 + i * (0.64 / (N - 1)) + 0.01, c = P(u, s * 0.2), r1 = size * (0.042 - i * 0.003), r2 = size * 0.016;
      const ang = a + s * 58;
      holes += `<ellipse cx="${n(c[0])}" cy="${n(c[1])}" rx="${n(r1)}" ry="${n(r2)}" transform="rotate(${n(ang)} ${n(c[0])} ${n(c[1])})" fill="#000"/>`;
    }
    const fill = o.fill || C.deep, light = o.light || C.leaf;
    const mid = [P(0, 0), P(0.3, 0), P(0.6, 0), P(0.9, 0)];
    return `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><path d="${blade}" fill="#fff"/><path d="${cuts}" fill="#000"/>${holes}</mask></defs>`
      + `<g mask="url(#${id})"><path d="${blade}" fill="${fill}"/><path d="${rightHalf}" fill="${light}" opacity=".55"/>`
      + `<path d="${smooth(mid)}" fill="none" stroke="${C.light}" stroke-width="${n(size * 0.014)}" stroke-linecap="round" opacity=".75"/></g>`;
  }
  /* a fern frond: pinnae along a curved rachis, shorter towards the tip */
  function frond(pts, size, o = {}) {
    const path = along(pts, 40), N = o.pinnae || 26, out = [];
    out.push(stem(pts, o.w || 1.4, o.stem || C.stem));
    for (let i = 2; i < N; i++) {
      const t = i / N, idx = Math.round(t * (path.length - 1)), p = path[idx], d = dirAt(path, idx);
      const L = size * (0.28 + 0.72 * Math.sin(Math.PI * Math.min(1, 0.15 + t))) * (1 - t * 0.55) * 0.42;
      for (const side of [-1, 1]) out.push(leaf(p[0], p[1], d + side * (62 - 22 * t), L, L * 0.2, { fill: o.fill || C.mid, vein: false, bend: side * 0.08 }));
    }
    return out.join('');
  }

  /* ---------- one study per plant, in a 120 x 120 box ---------- */
  const PLANT = {
    phal: () => {
      const s = stem([[59, 86], [55, 64], [55, 46], [64, 32], [80, 26], [94, 30]], 1.5);
      return s + leaf(57, 86, -168, 30, 9.5, { bend: -0.12, fill: C.leaf }) + leaf(63, 86, -12, 30, 9.5, { bend: 0.12, fill: C.leaf }) + leaf(60, 85, -118, 22, 8, { fill: C.deep })
        + orchid(58, 42, 13, -8) + orchid(70, 30, 14, 4) + orchid(84, 27, 13, 12)
        + `<ellipse cx="95" cy="32" rx="3" ry="2.4" fill="${C.orchid}" stroke="${C.orchidEdge}" stroke-width=".5"/><ellipse cx="99" cy="37" rx="2" ry="1.7" fill="${C.light}"/>`
        + pot(60, 86, 40, 26);
    },
    hydr: () => leaf(60, 84, -158, 26, 11, { fill: C.leaf, bend: -0.05 }) + leaf(60, 84, -22, 26, 11, { fill: C.leaf, bend: 0.05 }) + leaf(58, 82, -128, 20, 9, { fill: C.deep }) + leaf(62, 82, -52, 20, 9, { fill: C.deep })
      + cluster(44, 60, 15, 4.4, C.hydr, 7, '#f4f1fb') + cluster(76, 58, 16, 4.4, C.hydr, 11, '#f4f1fb') + cluster(60, 44, 15, 4.4, C.hydr, 3, '#f4f1fb') + pot(60, 86, 40, 26),
    mons: () => stem([[57, 86], [50, 72], [44, 62]], 1.6) + stem([[63, 86], [70, 70], [76, 60]], 1.6) + stem([[60, 86], [61, 74], [62, 66]], 1.6)
      + monstera(44, 62, -138, 34, { bend: -0.3, fill: C.deep, light: C.leaf, splits: 4, holes: false, cut: 0.036 })
      + monstera(76, 60, -42, 36, { bend: 0.3, fill: C.leaf, light: C.mid, splits: 4, holes: false, cut: 0.036 })
      + monstera(62, 66, -92, 30, { bend: 0.15, fill: C.deep, light: C.leaf, splits: 4, holes: false, cut: 0.036 }) + pot(60, 86, 40, 26),
    chry: () => {
      const R = rng(5), pts = [];
      for (let i = 0; i < 230; i++) { const t = R() * Math.PI, r = 30 * Math.sqrt(R()); const x = 60 + r * Math.cos(t + Math.PI), y = 80 - r * Math.sin(t) * 0.95; pts.push([x, y]); }
      pts.sort((a, b) => a[1] - b[1]);
      const f = pts.map(p => { const shade = (80 - p[1]) / 30; const c = shade > 0.55 ? C.chry[2] : shade > 0.25 ? C.chry[0] : C.chry[3]; return `<circle cx="${n(p[0])}" cy="${n(p[1])}" r="3.3" fill="${c}"/><circle cx="${n(p[0])}" cy="${n(p[1])}" r="1" fill="${C.chryEye}"/>`; }).join('');
      return leaf(34, 84, -170, 12, 5, { fill: C.leaf }) + leaf(86, 84, -10, 12, 5, { fill: C.leaf }) + f + pot(60, 86, 44, 24);
    },
    cycl: () => {
      let o = '';
      // flowers on slender stalks that crook over at the top, petals swept back upwards
      const fl = [[42, 38, -14], [54, 28, -4], [67, 30, 6], [79, 40, 14]];
      fl.forEach(([x, y]) => { o += stem([[60, 80], [x + (60 - x) * 0.35, y + 26], [x - 1, y + 12], [x, y + 9]], 1.1); });
      fl.forEach(([x, y, r]) => {
        o += leaf(x - 2, y + 9, -90 + r - 22, 15, 3.6, { fill: C.cyclLight, vein: false, bend: -0.12 });
        o += leaf(x + 2, y + 9, -90 + r + 22, 15, 3.6, { fill: C.cyclLight, vein: false, bend: 0.12 });
        o += leaf(x, y + 9, -90 + r, 17, 4.2, { fill: C.cycl, vein: false });
        o += `<ellipse cx="${n(x)}" cy="${n(y + 10)}" rx="2.2" ry="1.7" fill="${C.roseDark}"/>`;
      });
      o += heartLeaf(47, 80, -150, 17, C.deep, C.light) + heartLeaf(73, 80, -30, 17, C.deep, C.light) + heartLeaf(60, 80, -96, 15, C.leaf, C.pale) + heartLeaf(39, 85, -176, 13, C.leaf, C.pale) + heartLeaf(81, 85, -4, 13, C.leaf, C.pale);
      return o + pot(60, 86, 40, 26);
    },
    kala: () => {
      let o = '';
      [[-160, 18], [-20, 18], [-125, 16], [-55, 16], [-92, 14]].forEach(([a, L], i) => { o += leaf(60, 84, a, L, L * 0.5, { fill: i % 2 ? C.leaf : C.deep, blunt: true }); });
      o += stem([[56, 76], [48, 56]], 1.2) + stem([[60, 76], [61, 48]], 1.2) + stem([[64, 76], [74, 56]], 1.2);
      o += cluster(46, 53, 9, 3.2, C.kala, 4, '#fbe3b8') + cluster(74, 53, 9, 3.2, C.kala, 9, '#fbe3b8') + cluster(61, 44, 9.5, 3.2, C.kala, 2, '#fbe3b8');
      return o + pot(60, 86, 40, 26);
    },
    cala: () => {
      // broad oval leaves on long stalks, with pale feathered bands either side of the midrib (as in Calathea orbifolia)
      let o = '';
      [[-142, 36, 0], [-117, 44, 1], [-90, 47, 0], [-63, 44, 1], [-38, 36, 0]].forEach(([a, L, alt]) => {
        const base = at(60, 84, a, L * 0.36, 0), Lb = L * 0.66, Wb = Lb * 0.36, dir = a + (a + 90) * 0.18;
        o += `<path d="M60 84Q${pt(at(60, 84, a, L * 0.2, (a + 90) * 0.02))} ${pt(base)}" fill="none" stroke="${C.stem}" stroke-width="1.3"/>`;
        o += leaf(base[0], base[1], dir, Lb, Wb, { fill: alt ? C.leaf : C.deep, blunt: true, vein: false });
        for (let k = 1; k <= 5; k++) for (const sd of [-1, 1]) {
          const p = at(base[0], base[1], dir, Lb * (0.1 + k * 0.15), 0), w = Wb * (1 - Math.abs(k - 2.6) * 0.2);
          o += leaf(p[0], p[1], dir + sd * 64, w * 0.95, Lb * 0.028, { fill: C.pale, vein: false });
        }
        o += `<path d="M${pt(base)}L${pt(at(base[0], base[1], dir, Lb * 0.94, 0))}" stroke="${C.pale}" stroke-width=".9" stroke-linecap="round"/>`;
      });
      return o + pot(60, 86, 40, 26);
    },
    rose: () => {
      let o = stem([[52, 112], [48, 70], [44, 40]], 1.6) + stem([[58, 112], [60, 70], [64, 30]], 1.6) + stem([[64, 112], [72, 72], [80, 44]], 1.6);
      o += leaf(48, 76, -160, 13, 5, { fill: C.leaf }) + leaf(61, 66, -20, 13, 5, { fill: C.deep }) + leaf(71, 80, -15, 12, 4.6, { fill: C.leaf }) + leaf(47, 58, -150, 11, 4.4, { fill: C.deep });
      const head = (x, y, r) => `<path d="M${n(x - r * 0.7)} ${n(y + r * 0.4)}L${n(x - r * 0.95)} ${n(y + r * 0.95)}M${n(x + r * 0.7)} ${n(y + r * 0.4)}L${n(x + r * 0.95)} ${n(y + r * 0.95)}" stroke="${C.leaf}" stroke-width="1.6" stroke-linecap="round"/>`
        + `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(r)}" ry="${n(r * 0.92)}" fill="${C.rose}"/>`
        + `<path d="M${n(x - r * 0.62)} ${n(y + r * 0.1)}Q${n(x)} ${n(y + r * 0.9)} ${n(x + r * 0.62)} ${n(y + r * 0.1)}M${n(x - r * 0.4)} ${n(y - r * 0.2)}Q${n(x + r * 0.1)} ${n(y + r * 0.45)} ${n(x + r * 0.42)} ${n(y - r * 0.25)}M${n(x - r * 0.18)} ${n(y - r * 0.38)}Q${n(x + r * 0.25)} ${n(y - r * 0.1)} ${n(x + r * 0.08)} ${n(y - r * 0.55)}" fill="none" stroke="${C.roseDark}" stroke-width="${n(r * 0.11)}" stroke-linecap="round"/>`
        + `<path d="M${n(x - r * 0.8)} ${n(y - r * 0.15)}Q${n(x - r * 0.55)} ${n(y - r * 0.85)} ${n(x + r * 0.1)} ${n(y - r * 0.82)}" fill="none" stroke="${C.roseLight}" stroke-width="${n(r * 0.12)}" stroke-linecap="round"/>`;
      o += head(44, 36, 10) + head(64, 26, 11) + head(80, 40, 10);
      return o + `<rect x="50" y="94" width="18" height="6" rx="1.5" fill="${C.tie}"/>`;
    },
  };
  const plant = (k, cls = 'plant') => `<svg class="${cls}" viewBox="8 9 104 104" aria-hidden="true" focusable="false">${(PLANT[k] || PLANT.phal)()}</svg>`;

  /* a small leafy sprig used as a divider */
  function sprig(cls = 'sprig') {
    let o = stem([[6, 22], [60, 14], [114, 22]], 1.4, C.mid);
    along([[6, 22], [60, 14], [114, 22]], 20).forEach((p, i, arr) => { if (i % 6 === 3) { const d = dirAt(arr, i); o += leaf(p[0], p[1], d - (i % 12 ? 40 : -40) , 10, 3.4, { fill: i % 12 ? C.light : C.mid, vein: false }); } });
    return `<svg class="${cls}" viewBox="0 0 120 34" aria-hidden="true" focusable="false">${o}</svg>`;
  }
  return { plant, sprig, C };

/* a section Jan can fold away: closed until he opens it, and remembered on this computer */
const isClosed = (id, open) => (id in P.fold ? !!P.fold[id] : !open);
function fold(id, title, meta, body, opts) {
  opts = opts || {};
  const closed = isClosed(id, opts.open), H = opts.h || 'h2';
  return `<section class="fold${closed ? ' closed' : ''}${opts.cls ? ' ' + opts.cls : ''}" id="${id}"${opts.attrs ? ' ' + opts.attrs : ''}>
  <div class="fold-head">
    <button class="fold-btn" type="button" id="${id}-btn" data-act="fold" data-id="${id}" aria-expanded="${!closed}" aria-controls="${id}-body"><span class="chev" aria-hidden="true"></span><${H}>${title}</${H}></button>
    ${meta ? `<span class="fold-meta">${meta}</span>` : ''}${opts.tools ? `<span class="fold-tools">${opts.tools}</span>` : ''}
  </div>
  <div class="fold-body" id="${id}-body"${closed ? ' hidden' : ''}>${body}</div>
</section>`;
}
function pageHead(eyebrow, title, lede, side) {

/* the front page shows a globe with Nootdorp on it, drawn like the globe in the logo but as a fine atlas grid */
function globeArt() {
  const cx = 270, cy = 262, r = 214, rad = Math.PI / 180, phi0 = 47 * rad, lam0 = 6 * rad;
  const proj = (lat, lon) => {
    const la = lat * rad, lo = lon * rad - lam0;
    const x = Math.cos(la) * Math.sin(lo);
    const y = Math.cos(phi0) * Math.sin(la) - Math.sin(phi0) * Math.cos(la) * Math.cos(lo);
    const z = Math.sin(phi0) * Math.sin(la) + Math.cos(phi0) * Math.cos(la) * Math.cos(lo);
    return [cx + r * x, cy - r * y, z];
  };
  const path = pts => {
    let d = '', run = [];
    const flush = () => { if (run.length > 1) d += 'M' + run.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('L'); run = []; };
    pts.forEach(p => (p[2] > 0 ? run.push(p) : flush())); flush();
    return d;
  };
  const meridian = lon => path([...Array(91).keys()].map(i => proj(-90 + i * 2, lon)));
  const parallel = lat => path([...Array(181).keys()].map(i => proj(lat, -180 + i * 2)));
  let grid = '';
  for (let lon = -180; lon < 180; lon += 15) if (lon !== 0) grid += meridian(lon);
  for (let lat = -75; lat <= 75; lat += 15) if (lat !== 0) grid += parallel(lat);
  const [nx, ny] = proj(52.045, 4.396);
  return `<svg class="hero-art globe-art" viewBox="40 36 460 424" role="img" aria-label="${t('globeAria')}">
    <defs><radialGradient id="globe-fill" cx="36%" cy="30%" r="78%"><stop offset="0" style="stop-color:var(--sheet)"/><stop offset="1" style="stop-color:var(--sage)"/></radialGradient></defs>
    <circle class="g-sphere" cx="${cx}" cy="${cy}" r="${r}"/>
    <path class="g-grid" d="${grid}"/><path class="g-main" d="${meridian(0)}${parallel(0)}"/>
    <circle class="g-rim" cx="${cx}" cy="${cy}" r="${r}"/>
    <circle class="g-halo" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="14"/><circle class="g-dot" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="5.5"/>
    <text class="g-name" x="${(nx + 18).toFixed(1)}" y="${(ny - 3).toFixed(1)}">NOOTDORP</text>
    <text class="g-coord" x="${(nx + 18).toFixed(1)}" y="${(ny + 14).toFixed(1)}">52°03′N · 4°24′E</text>
  </svg>`;
}

/* 1 · Bestellen: per customer the quote that fits best; a tick puts it on the order list */
function colOrder() {
  const needs = NEEDS.slice().sort((a, b) => a.needed - b.needed);
  const nDone = needs.filter(n => needTicked(n) >= n.qty).length;
  const rows = needs.map(n => {
    const x = matchOf(n), c = CUSTOMERS[n.cust], got = needTicked(n), on = got > 0;
    let sub;
    if (on) {
      const at = uniq(scoreNeed(n).filter(r => S.ticks[r.o.id]).map(r => GROWERS[r.o.grower].name));
      sub = `<span class="chip ${got >= n.qty ? 'ok' : 'wait'}">${got >= n.qty ? 'Op de bestellijst' : `${qty(got)} van ${qty(n.qty)} op de lijst`}</span><span>${esc(nlList(at))}</span>`;
    } else if (x.m) sub = `<span>${esc(GROWERS[x.m.o.grower].name)}</span><span class="score-pill${x.fit.ok ? ' top' : ''}">${x.m.total}</span>${x.fit.ok ? '' : fitChip(x.fit)}`;
    else sub = '<span class="faint">Nog geen offerte</span>';
    const tick = x.m ? `<label class="box-tick${on ? ' on' : ''}" title="${on ? 'Van de bestellijst halen' : 'Op de bestellijst zetten'}"><input type="checkbox" id="nt-${n.id}" data-act="need-tick" data-id="${n.id}" aria-label="${pn(n.plant)} voor ${esc(c.name)} op de bestellijst, bij ${esc(GROWERS[x.m.o.grower].name)}"${on ? ' checked' : ''}><span class="tick-box" aria-hidden="true"></span></label>` : '';
    return `<li><div class="td-item${on ? ' on' : ''}">
    ${dayBlock(n.needed, !on && daysFrom(TODAY, n.needed) <= 2)}
    <div class="td-main"><b>${pn(n.plant)} <span class="td-q">${qty(n.qty)} ${unitOf(n.plant)}</span></b><span>${esc(c.name)}</span><span class="td-sub">${sub}</span></div>
    ${tick}
  </div></li>`;
  }).join('');
  const lines = tickedLines(), tot = lines.reduce((s, x) => s + x.r.q * x.r.landed, 0);
  const foot = (lines.length
    ? `<span><b>Bestellijst</b> · ${pl(lines.length, 'regel', 'regels')} · ${eur0(tot)}${S.placed ? ` · geplaatst gelogd ${fWhen(new Date(S.placed.at))}` : ''}</span><button type="button" class="btn btn-sm btn-leaf" data-act="orderlist">Tonen</button>`
    : '<span>Een vink zet de beste offerte op je bestellijst.</span>') + '<a class="td-more" href="#/desk/quotes">Alle offertes</a>';
  const done = nDone === needs.length;
  return { done, html: tcol(1, 'Bestellen', 'Per klant de offerte die het best past, op leverdag.', `${nDone} van ${needs.length} op de lijst`, done, `<ul class="td-list">${rows}</ul>`, foot) };
}
