/* ================= Mail: the original mail behind a quote, an invoice or a packing list ================= */
/* The desk reads a copy of the incoming mail. This shows that copy as it came in: sender, subject, text and the attachment
   as the desk read it, with the desk's own warning on top. Read only: nothing is sent from here. */
const MAIL_ICO = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.2 5.6 10 11l6.8-5.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const PDF_ICO = '<svg viewBox="0 0 20 24" aria-hidden="true"><path d="M3 1.5h9.5L17 6v16.5H3z" fill="#fff" stroke="currentColor" stroke-width="1.3"/><path d="M12.5 1.5V6H17" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="12.5" width="13" height="6" rx="1" fill="#c8372f"/><text x="7.5" y="17.1" text-anchor="middle" font-size="4.6" font-weight="700" fill="#fff" font-family="Arial,sans-serif">PDF</text></svg>';
const CAMPO_BOX = 'info@campointernational.nl';
/* who writes the mails at each grower, and in which language (all made up, like the rest of the example data) */
const GROWER_MAIL = {
  leeuwen:   { box: 'vanleeuwen-orchideeen.example', who: 'Marieke van Leeuwen', lang: 'nl' },
  verhoeven: { box: 'kwekerijverhoeven.example',     who: 'Kees Verhoeven',      lang: 'nl' },
  lindner:   { box: 'gaertnerei-lindner.example',    who: 'Sabine Lindner',      lang: 'de' },
  hortensia: { box: 'hortensiahuis.example',         who: 'Ruud Bakker',         lang: 'nl' },
  westland:  { box: 'westlandgroen.example',         who: 'Sandra de Groot',     lang: 'nl' },
  zonnehoek: { box: 'kwekerijdezonnehoek.example',   who: 'Peter van der Zon',   lang: 'nl' },
  danica:    { box: 'floradanica.example',           who: 'Lars Mikkelsen',      lang: 'en' },
  naivasha:  { box: 'naivashastemfarm.example',      who: 'Grace Wanjiru',       lang: 'en' },
  pater:     { box: 'kwekerijpater.example',         who: 'Henk Pater',          lang: 'nl' },
};
const MAIL_BOX = { quote: { nl: 'verkoop', de: 'verkauf', en: 'sales' }, invoice: { nl: 'facturen', de: 'rechnung', en: 'invoices' }, slip: { nl: 'logistiek', de: 'versand', en: 'logistics' } };
const mailFrom = (gid, kind) => `${MAIL_BOX[kind][GROWER_MAIL[gid].lang]}@${GROWER_MAIL[gid].box}`;
const ibanMask = (cc, last) => `${cc}·· ···· ···· ${last}`;
const inL = (lang, fn) => inLang(lang === 'de' ? 'de' : lang === 'en' ? 'en' : 'nl', fn);
const SIGN = { nl: 'Met vriendelijke groet,', de: 'Mit freundlichen Grüßen', en: 'Kind regards,' };
function mailDay(d) { return inL('nl', () => fDay(d)); }

/* a quote: every line of that pdf, the same product once even when it serves two customers */
function mailQuote(file) {
  const offers = allOffers().filter(o => o.file === file), pend = REVIEW.filter(rv => rv.file === file && rv.offer && !reviewDone(rv.id));
  const gid = offers.length ? offers[0].grower : pend[0].grower, g = GROWERS[gid], gm = GROWER_MAIL[gid], lang = gm.lang;
  const uniq = new Map();
  offers.forEach(o => {
    const n = NEEDS.find(x => x.id === o.need), k = [n.plant, n.size, o.price, o.qty, o.pack.per, o.pack.n].join('|');
    if (!uniq.has(k)) uniq.set(k, { n, o, cust: [] });
    uniq.get(k).cust.push(CUSTOMERS[n.cust].name);
  });
  const lines = [...uniq.values()];
  const all = offers.concat(pend.map(rv => rv.offer));
  const valid = new Date(Math.min(...all.map(o => +o.valid))), ship = new Date(Math.min(...all.map(o => +o.ship))), wk = isoWeek(ship);
  const idx = quoteFiles().indexOf(file), date = at(T(0), 6, 40 + 7 * Math.max(0, idx));
  const until = inL(lang, () => fDay(valid));
  const T_ = {
    nl: { subj: `Offerte week ${wk}`, body: ['Goedemorgen Jan,', `Hierbij ons aanbod voor week ${wk}. De prijzen zijn exclusief btw; de vracht rekenen we per levering.`, `Het aanbod is geldig tot en met ${until}.`] },
    de: { subj: `Angebot KW ${wk}`, body: ['Hallo Jan,', `anbei unser Angebot für KW ${wk}. Alle Preise netto, Fracht je Lieferung.`, `Das Angebot gilt bis ${until}.`] },
    en: { subj: `Offer week ${wk}`, body: ['Dear Jan,', `Please find attached our offer for week ${wk}. Prices exclude VAT; freight is charged per delivery.`, `This offer is valid until ${until}.`] },
  }[lang];
  const rows = lines.map(({ n, o }) => `<tr><td>${pn(n.plant)}</td><td>${esc(n.size)}</td><td class="r num">${qty(o.qty)}</td><td class="num">${quotedPrice(o)}</td><td>${wkTxt(o.ship)}</td></tr>`).join('')
    + pend.map(rv => `<tr class="raw"><td colspan="5"><span class="mono">${esc(rv.raw)}</span>${qPill('check')}</td></tr>`).join('');
  const paper = `<div class="pp-head"><b>${esc(g.name)}</b><span>${esc(g.place)} · ${esc(COUNTRY_NL[g.cc] || g.cc)}</span></div>
    <p class="pp-title">Offerte week ${wk}</p>
    <div class="pp-scroll"><table class="pp-t"><thead><tr><th>Artikel</th><th>Maat</th><th class="r">Aantal</th><th>Prijs</th><th>Levering</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="pp-foot">Prijzen excl. btw · vracht per levering · geldig t/m ${mailDay(valid)}</p>`;
  const read = `De desk las ${pl(lines.length + pend.length, 'regel', 'regels')} uit deze offerte${pend.length ? `; ${pend.length === 1 ? 'één ligt' : `${pend.length} liggen`} nog bij Checken` : ''}.${lines.some(l => l.cust.length > 1) ? ' Een regel die bij twee klanten past, staat bij Offertes voor allebei.' : ''}`;
  return { subject: T_.subj, fromName: g.name, from: mailFrom(gid, 'quote'), date, body: T_.body.concat([`${SIGN[lang]}\n${gm.who}\n${g.name}`]), file, paper, read, flags: '' };
}

/* an invoice, with the desk's verdict from Facturen on top */
function mailInvoice(id) {
  const x = invList().find(y => y.inv.id === id), inv = x.inv, k = x.k, s = ivState(x), d = IV_STATES[s];
  const gid = inv.grower || inv.lookalike, g = inv.grower ? GROWERS[inv.grower] : null, gm = GROWER_MAIL[gid];
  const lang = inv.grower ? gm.lang : 'nl', cc = g ? g.cc : inv.cc || 'NL';
  const fromName = g ? g.name : inv.shownAs, from = inv.sender || mailFrom(gid, 'invoice');
  const date = at(inv.date, 9, 5 + (parseInt(id.replace(/\D/g, ''), 10) || 1) * 4);
  const due = inv.due ? inL(lang, () => fDay(inv.due)) : '';
  const iban = ibanMask(cc, inv.iban), po = k.po;
  let subject, body;
  if (inv.credit) {
    subject = { nl: `Creditnota ${inv.no}`, de: `Gutschrift ${inv.no}`, en: `Credit note ${inv.no}` }[lang];
    body = { nl: ['Beste Jan,', `Bijgaand een creditnota bij factuur ${inv.credit.for}: ${inv.credit.why}. Het bedrag verrekenen we met de volgende betaling.`] }.nl;
  } else if (!inv.grower) {
    subject = `DRINGEND: openstaande factuur ${inv.no}`;
    body = ['Geachte heer, mevrouw,', `Wij hebben nog geen betaling ontvangen voor factuur ${inv.no}. Wij verzoeken u het bedrag vandaag nog over te maken, om vertraging van uw volgende leveringen te voorkomen.`, 'Let op: ons rekeningnummer is gewijzigd. Gebruik het nummer op de factuur.'];
  } else {
    subject = { nl: `Factuur ${inv.no}`, de: `Rechnung ${inv.no}`, en: `Invoice ${inv.no}` }[lang];
    body = {
      nl: ['Beste Jan,', `Bijgaand onze factuur ${inv.no}${inv.po ? ` voor bestelling ${inv.po}` : ''}.${inv.scan ? ' De factuur is gescand.' : ''} Graag betalen voor ${due} op rekening ${iban}.`],
      de: ['Hallo Jan,', `anbei unsere Rechnung ${inv.no}${inv.po ? ` zu Ihrer Bestellung ${inv.po}` : ''}. Bitte überweisen Sie den Betrag bis ${due} auf das Konto ${iban}.`],
      en: ['Dear Jan,', `Please find attached invoice ${inv.no}${inv.po ? ` for order ${inv.po}` : ''}. Payment is due on ${due} to account ${iban}.`],
    }[lang];
    if (k.iban === 'changed') body.push({ nl: 'Let op: wij hebben een nieuw rekeningnummer.', de: 'Bitte beachten Sie unsere neue Bankverbindung.', en: 'Please note our new bank account.' }[lang]);
  }
  body = body.concat([g ? `${SIGN[lang]}\n${gm.who}\n${g.name}` : `Met vriendelijke groet,\nAdministratie ${inv.shownAs}`]);
  const title = inv.credit ? 'Creditnota' : 'Factuur';
  const qtyInv = po && inv.amount != null && Math.abs(inv.amount / po.price - Math.round(inv.amount / po.price)) < 0.001 ? Math.round(inv.amount / po.price) : po ? po.qty : null;
  const line = inv.credit ? `<tr><td colspan="3">Credit op factuur ${esc(inv.credit.for)}: ${esc(inv.credit.why)}</td><td class="r num">${eur(inv.amount)}</td></tr>`
    : po ? `<tr><td>${pn(po.plant)} ${esc(po.size)}</td><td class="r num">${qty(qtyInv)}</td><td class="r num">${eur(po.price)}</td><td class="r num">${inv.amount != null ? eur(inv.amount) : '<span class="blur">€ 2.2?0,00</span>'}</td></tr>`
    : `<tr><td>Levering kamerplanten</td><td class="r">—</td><td class="r">—</td><td class="r num">${eur(inv.amount)}</td></tr>`;
  const vat = vatOf(inv).label;
  const paper = `<div class="pp-head"><b>${esc(fromName)}</b><span>${g ? `${esc(g.place)} · ${esc(COUNTRY_NL[g.cc] || g.cc)}` : 'Geen adres op de factuur'}</span></div>
    <p class="pp-title">${title}</p>
    <dl class="pp-meta"><div><dt>Nummer</dt><dd class="mono">${esc(inv.no)}</dd></div><div><dt>Datum</dt><dd>${mailDay(inv.date)}</dd></div><div><dt>Vervalt</dt><dd>${inv.due ? mailDay(inv.due) : '—'}</dd></div><div><dt>Uw bestelling</dt><dd class="mono">${inv.po || '—'}</dd></div></dl>
    <div class="pp-scroll"><table class="pp-t"><thead><tr><th>Omschrijving</th><th class="r">Aantal</th><th class="r">Prijs</th><th class="r">Bedrag</th></tr></thead><tbody>${line}</tbody>
      <tfoot><tr><td colspan="3">Totaal excl. btw</td><td class="r num"><b>${inv.amount != null ? eur(inv.amount) : '<span class="blur">€ 2.2?0,00</span>'}</b></td></tr><tr><td colspan="3">Btw</td><td class="r">${vat}</td></tr></tfoot></table></div>
    ${inv.credit ? '' : `<p class="pp-foot${k.iban === 'changed' || !inv.grower ? ' flag' : ''}">Betalen op ${iban}${inv.due ? ` vóór ${mailDay(inv.due)}` : ''}</p>`}`;
  const why = s === 'ok' ? 'Klopt met de bestelling, de pakbon en het bedrag.' : s === 'credit' ? `Creditfactuur bij ${esc(inv.credit.for)}; er hoeft niets betaald te worden.` : ivWhy(x, s);
  const flags = `<p class="mail-flag ${s}">${`<span class="pill ${s}"><i aria-hidden="true">${d.icon}</i>${d.label}</span>`}<span>${why}</span></p>`;
  const fromNote = !inv.grower ? `Onbekend adres. ${esc(GROWERS[inv.lookalike].name)} mailt altijd vanaf ${mailFrom(inv.lookalike, 'invoice')}.` : '';
  return { subject, fromName, from, fromBad: !inv.grower, fromNote, date, body, file: `${inv.no}.pdf`, scan: !!inv.scan, paper, read: '', flags };
}

/* a packing list or an order confirmation, with its status from Pakbonnen */
function mailSlip(id) {
  const s = SLIPS.concat(ARCHIVE_SLIPS).find(y => y.id === id), x = slipInfo(s), g = GROWERS[s.grower], gm = GROWER_MAIL[s.grower], lang = gm.lang;
  const conf = s.kind === 'Bevestiging', st = slState(s), d = SL_STATES[st];
  const date = at(s.at, 7, 12 + (parseInt(id.replace(/\D/g, ''), 10) || 1) % 40);
  const kindName = conf ? { nl: 'Orderbevestiging', de: 'Auftragsbestätigung', en: 'Order confirmation' }[lang] : { nl: 'Pakbon', de: 'Lieferschein', en: 'Delivery note' }[lang];
  const day = inL(lang, () => fDay(s.at));
  const when = conf ? (st === 'later' ? s.confirmed : x.says ? x.says.date : null) : null;
  const whenTxt = when ? inL(lang, () => wkTxt(when)) : '';
  const body = conf ? {
    nl: ['Goedemorgen Jan,', `Hierbij bevestigen wij bestelling ${s.po}${whenTxt ? `, levering ${whenTxt}` : ''}. Zie de bijlage.`],
    de: ['Hallo Jan,', `hiermit bestätigen wir Ihre Bestellung ${s.po}${whenTxt ? `, Lieferung ${whenTxt}` : ''}. Details im Anhang.`],
    en: ['Dear Jan,', `We hereby confirm order ${s.po}${whenTxt ? `, delivery ${whenTxt}` : ''}. Details attached.`],
  }[lang] : {
    nl: ['Goedemorgen,', `In de bijlage de pakbon van de levering van ${day}.${st === 'partial' ? ` De rest volgt ${inL('nl', () => wkTxt(s.rest))}.` : ''}`],
    de: ['Guten Tag,', `anbei der Lieferschein zur Lieferung vom ${day}.${st === 'partial' ? ` Der Rest folgt ${inL('de', () => wkTxt(s.rest))}.` : ''}`],
    en: ['Hello,', `Attached is the delivery note for the delivery of ${day}.${st === 'partial' ? ` The rest follows ${inL('en', () => wkTxt(s.rest))}.` : ''}`],
  }[lang];
  const got = st === 'fewer' || st === 'partial' ? s.got : x.ordered, size = st === 'size' ? s.gotSize : x.size;
  const paper = `<div class="pp-head"><b>${esc(g.name)}</b><span>${esc(g.place)} · ${esc(COUNTRY_NL[g.cc] || g.cc)}</span></div>
    <p class="pp-title">${conf ? 'Orderbevestiging' : 'Pakbon'}</p>
    <dl class="pp-meta"><div><dt>Uw bestelling</dt><dd class="mono">${s.po}</dd></div><div><dt>Datum</dt><dd>${mailDay(s.at)}</dd></div>${when ? `<div><dt>Levering</dt><dd>${inL('nl', () => wkTxt(when))}</dd></div>` : ''}</dl>
    <div class="pp-scroll"><table class="pp-t"><thead><tr><th>Artikel</th><th>Maat</th><th class="r">${conf ? 'Bevestigd' : 'Geleverd'}</th></tr></thead>
      <tbody><tr><td>${esc(x.name)}</td><td>${esc(size)}</td><td class="r num">${qty(got)}</td></tr></tbody></table></div>
    ${st === 'partial' ? `<p class="pp-foot">Rest volgt ${inL('nl', () => wkTxt(s.rest))}</p>` : ''}`;
  const flags = `<p class="mail-flag sl-${st}">${slPill(st)}<span>${slWhy(s, x)}</span></p>`;
  return { subject: `${kindName} ${s.po}`, fromName: g.name, from: mailFrom(s.grower, 'slip'), date, body: body.concat([`${SIGN[lang]}\n${gm.who}\n${g.name}`]), file: `${conf ? 'Bevestiging' : 'Pakbon'}_${s.po}.pdf`, paper, read: '', flags };
}

function mailHtml() {

function parseAmount(s) {

  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if (lc > -1 && ld > -1) t = lc > ld ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (lc > -1) t = /,\d{1,2}$/.test(t) ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (ld > -1 && !/\.\d{1,2}$/.test(t)) t = t.replace(/\./g, '');

}

    S.review.r3 = { amount: v, at: Date.now() };
    const k = checkInv(inv);
    log(docName(inv), 'Totaal niet zeker leesbaar.', `Totaal ingevuld: ${eur(v)}.`, '');
    commit(`Gecontroleerd: status ${IV_STATES[ivState({ inv, k })].label}.`);
  }
});
/* ================= drag a quote to Favorieten or onto the order list ================= */
/* Every quote row carries data-drag with its offer id; Favorieten and the dock carry data-drop. Clicking a score and
   the checkbox do the same for touch screens and the keyboard. */
const DRAG = { id: null };
const elOf = t => (t && t.nodeType === 1 ? t : t && t.parentElement);
function dropClear() {
  DRAG.id = null;
  document.body.classList.remove('dragging');
  document.querySelectorAll('.drop-on,.drag-src').forEach(x => x.classList.remove('drop-on', 'drag-src'));
}
function dropOffer(id, where) {
  const x = offerInfo(id);
  if (!x) return;
  const g = GROWERS[x.r.o.grower].name, what = `${pn(x.n.plant)} voor ${CUSTOMERS[x.n.cust].name}`;
  if (where === 'saved') {
    if (P.saved.includes(id)) { toast('Die staat al bij je favorieten.'); return; }
    P.saved.push(id); P.fold['qt-saved'] = false; savePrefs(); render(false);
    toast(`Bij je favorieten: ${g}, ${what}.`);
  } else if (where === 'order') {
    if (S.ticks[id]) { toast('Die staat al op de bestellijst.'); return; }
    S.ticks[id] = Date.now();
    commit(`Op de bestellijst: ${qty(x.r.q)} ${what}, bij ${g}. Bestellen doe je zelf.`);
  }
}
document.addEventListener('dragstart', e => {
  const t = elOf(e.target), src = t && t.closest('[data-drag]');
  if (!src) return;
  DRAG.id = src.dataset.drag;
  try { e.dataTransfer.setData('text/plain', DRAG.id); e.dataTransfer.effectAllowed = 'copy'; } catch (err) { /* very old browsers */ }
  src.classList.add('drag-src');
  setTimeout(() => { if (DRAG.id) document.body.classList.add('dragging'); }, 0);   // not during dragstart itself, or some browsers cancel the drag
});
document.addEventListener('dragover', e => {
  if (!DRAG.id) return;
  const t = elOf(e.target), z = t && t.closest('[data-drop]');
  document.querySelectorAll('.drop-on').forEach(x => { if (x !== z) x.classList.remove('drop-on'); });
  if (!z) return;
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'copy'; } catch (err) { /* ignore */ }
  z.classList.add('drop-on');
});
document.addEventListener('drop', e => {
  if (!DRAG.id) return;
  e.preventDefault();
  const t = elOf(e.target), z = t && t.closest('[data-drop]'), id = DRAG.id;
  dropClear();
  if (z) dropOffer(id, z.dataset.drop);
});
document.addEventListener('dragend', dropClear);

document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(false); } });
window.addEventListener('hashchange', () => { UI.modal = null; UI.editWish = null; dropClear(); render(true); });
render(true);

})();
</script>
