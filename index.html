/* Layout: a quiet paper page with an ink header, one serif headline and hairline grids. The desk inside keeps the same paper, ink, leaf and brass, with hairline-ruled panels. One deliberate light theme. */
:root{
  --ink:#15201a;
  --ink-2:#525c55;
  --ink-3:#5f6963;
  --paper:#f4f5f0;
  --paper-2:#e8ebe3;
  --sheet:#fcfcf9;
  --line:#d8ddd2;
  --line-2:#c2c9bb;
  --leaf:#1f5138;
  --leaf-deep:#143826;
  --leaf-bg:#e2ece2;
  --forest:#10291e;
  --sage:#e5ebdf;
  --sage-2:#d2ddca;
  --sprout:#33923c;
  --brass:#7d6740;
  --warn:#8a3d2a;
  --warn-bg:#f3e3dc;
  --wait:#7a5c22;
  --wait-bg:#f2ead8;
  --info:#3c5560;
  --info-bg:#e3e8e9;
  --track:#e2e5dc;
  --on-ink:#f4f5f0;
  --on-ink-2:rgba(244,245,240,.74);
  --on-ink-line:rgba(244,245,240,.32);
  --scrim:rgba(16,41,30,.45);
  --shadow:0 1px 2px rgba(16,41,30,.06),0 12px 32px rgba(16,41,30,.10);
  --font-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --font-ui:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-data:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-ui);font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
[hidden]{display:none!important}
*,*::before,*::after{font-variant-numeric:lining-nums!important}
img,svg{max-width:100%}
a{color:inherit;text-underline-offset:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.site-top :focus-visible,.desk-top :focus-visible,.orderbar :focus-visible{outline-color:var(--on-ink)}
.mono{font-family:var(--font-data);font-size:.92em}
.num{font-variant-numeric:lining-nums tabular-nums!important}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13.5px}
.eyebrow{font:600 11.5px/1.35 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow-b{font:600 12px/1.35 var(--font-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.wrap{max-width:1152px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 20px;border:1px solid transparent;border-radius:0;font-weight:600;font-size:15.5px;line-height:1.2;text-decoration:none;white-space:nowrap;background:var(--paper-2);color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.btn-sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn-leaf{background:var(--leaf);color:var(--on-ink)}
.btn-leaf:hover{background:var(--leaf-deep)}
.btn-outline{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--paper-2)}
.btn-line{background:var(--sheet);border-color:var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-bad{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn-bad:hover{background:var(--warn-bg)}
.btn-on-ink{background:transparent;border-color:var(--on-ink-line);color:var(--on-ink)}
.btn-on-ink:hover{border-color:var(--on-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.25;padding:2px 7px;border-radius:2px;background:var(--paper-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip.ok{background:var(--leaf-bg);color:var(--leaf)}
.chip.wait{background:var(--wait-bg);color:var(--wait)}
.chip.bad{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.wk{display:inline-block;font:700 10.5px/1 var(--font-ui);letter-spacing:.12em;padding:3px 5px;border:1px solid var(--brass);border-radius:2px;color:var(--brass);vertical-align:1px;white-space:nowrap}
.site-top .wk,.desk-top .wk{border-color:var(--on-ink-line);color:var(--on-ink)}
.size{display:inline-block;font:600 12.5px/1.35 var(--font-ui);letter-spacing:.02em;padding:0 6px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2);white-space:nowrap}
.ribbon{background:var(--paper-2);color:var(--ink-2);font-size:13px;line-height:1.4;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line)}
.ribbon b{color:var(--ink)}

/* ---------- brand: Jan's globe with the leafy branch, CAMPO over INTERNATIONAL ---------- */
.wordmark{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:none}
.wordmark .mark{height:46px;width:auto;max-width:none;flex:none;overflow:visible}
.wm-txt{display:grid;justify-items:start;gap:6px;line-height:1}
.wm-txt b{font:600 28px/.78 var(--font-display);letter-spacing:.1em;color:var(--forest)}
.wm-txt i{font:600 8.9px/1 var(--font-ui);font-style:normal;letter-spacing:.45em;margin-right:-.45em;text-transform:uppercase;color:var(--leaf)}
.desk-top .wm-txt b,.foot .wm-txt b{color:#fff}
.desk-top .wm-txt i,.foot .wm-txt i{color:var(--on-ink-2)}

/* ---------- outside ---------- */
.ribbon{background:var(--sage);border-bottom-color:var(--sage-2)}
.site-top{background:var(--sheet);color:var(--ink);border-bottom:1px solid var(--line)}
.site-top :focus-visible{outline-color:var(--leaf)}
.top-bar{display:flex;align-items:center;gap:12px 28px;padding-block:13px}
.top-nav{display:flex;align-items:center;gap:26px;margin-left:auto;font-size:15px}
.top-nav a{color:var(--ink-2);text-decoration:none;padding-block:6px;border-bottom:2px solid transparent}
.top-nav a:hover{color:var(--ink)}
.top-nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sprout)}
.top-cta{flex:none}
.lang{position:relative;flex:none}
.lang summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 10px;border:1px solid var(--line-2);background:var(--sheet);font-weight:600;font-size:13.5px;letter-spacing:.06em;color:var(--ink);cursor:pointer;user-select:none}
.lang summary::-webkit-details-marker{display:none}
.lang summary::marker{content:""}
.lang summary svg{width:16px;height:16px;color:var(--leaf)}
.lang summary:hover,.lang[open] summary{border-color:var(--ink)}
.lang-chev{width:7px;height:7px;margin:0 1px 3px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.lang[open] .lang-chev{transform:rotate(-135deg);margin-bottom:-2px}
.lang-list{position:absolute;right:0;top:calc(100% + 6px);z-index:60;list-style:none;margin:0;padding:6px;min-width:190px;display:grid;gap:1px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow)}
.lang-list button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:9px 10px;border:0;background:none;text-align:left;font-size:15px;color:var(--ink)}
.lang-list button:hover{background:var(--paper-2)}
.lang-list button span{font-size:11.5px;letter-spacing:.12em;color:var(--ink-3)}
.lang-list button[aria-current="true"]{font-weight:700;color:var(--leaf);background:var(--leaf-bg)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:15px;color:var(--ink-2)}
.kicker{display:flex;align-items:center;gap:10px;font:600 12px/1.35 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--leaf)}
.kicker::before{content:"";flex:none;width:18px;height:2px;background:var(--sprout)}
.lede{font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:var(--ink-2);max-width:34rem;margin-top:22px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.go{margin-top:auto;padding-top:10px;font-weight:600;color:var(--leaf);text-decoration:none;width:fit-content}
.go:hover{text-decoration:underline}

/* front page: the hero, with the plants growing up from its bottom edge */
.hero{background:linear-gradient(180deg,var(--sheet) 0%,var(--paper) 100%);border-bottom:1px solid var(--sage-2)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:end;padding-top:clamp(40px,6vw,72px)}
.hero-copy{align-self:center;padding-bottom:clamp(40px,6vw,72px)}
.hero h1{font:500 clamp(44px,4.9vw,68px)/1 var(--font-display);letter-spacing:-.012em;margin-top:20px;color:var(--forest);text-wrap:wrap}
.hero h1 em{display:block;font-style:italic;color:var(--leaf);text-wrap:balance}
.hero h1.long{font-size:clamp(40px,4.4vw,60px)}
.hero-facts{display:grid;grid-template-columns:auto minmax(0,1.6fr) auto;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px;max-width:40rem}
.hero-facts > div{background:var(--sheet);padding:12px 16px}
.hero-facts dt,.visit-facts dt,.cust-sum dt{font:600 11px/1.3 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.hero-facts dd{margin-top:5px;font-weight:600;line-height:1.35}
.plate{align-self:end;justify-self:end;width:min(100%,500px);max-width:100%;aspect-ratio:460/424}
.globe-art .g-sphere{fill:url(#globe-fill)}
.globe-art .g-grid{fill:none;stroke:var(--leaf);stroke-opacity:.15;stroke-width:1}
.globe-art .g-main{fill:none;stroke:var(--leaf);stroke-opacity:.3;stroke-width:1.2}
.globe-art .g-rim{fill:none;stroke:var(--leaf);stroke-opacity:.4;stroke-width:1.4}
.globe-art .g-halo{fill:var(--sprout);fill-opacity:.16}
.globe-art .g-dot{fill:var(--sprout);stroke:var(--sheet);stroke-width:2}
.globe-art .g-name{font:600 12.5px var(--font-ui);letter-spacing:.24em;fill:var(--forest)}
.globe-art .g-coord{font:400 12px var(--font-ui);letter-spacing:.04em;fill:var(--ink-3)}
.hero-art{display:block;width:100%;height:100%;max-width:none}

/* sections */
.sec{padding-block:clamp(56px,8vw,100px)}
.sec-sage{background:var(--sage);border-block:1px solid var(--sage-2)}
.s-head{display:grid;gap:12px;max-width:46rem;margin-bottom:clamp(28px,4vw,40px)}
.s-head h2{font:500 clamp(34px,4.2vw,52px)/1.04 var(--font-display);color:var(--forest)}
.s-head > p:not(.kicker){color:var(--ink-2);line-height:1.6;max-width:40rem}

/* the range */
.range-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pcard{background:var(--sheet);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-width:0}
.pcard-art{position:relative;background:var(--sage);aspect-ratio:5/4;display:grid;place-items:end center;overflow:hidden}
.pcard-art .plant{width:76%;height:auto;display:block}
.badge{position:absolute;top:10px;left:10px;font:700 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--forest);color:#fff}
.badge.quiet{background:var(--sheet);color:var(--leaf);border:1px solid var(--sage-2)}
.pcard-body{padding:16px 16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:3px;align-content:start}
.pcard h3{font:600 24px/1.1 var(--font-display);color:var(--forest);overflow-wrap:anywhere;hyphens:auto}
.p-latin{font:italic 500 17px/1.3 var(--font-display);color:var(--ink-2);min-height:1.3em}
.p-latin.p-common{font:400 14.5px/1.55 var(--font-ui);font-style:normal}
.p-size{font-size:13.5px;color:var(--ink-3)}
.season{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;margin-top:12px}
.season i{height:7px;background:var(--track)}
.season i.on{background:var(--sprout)}
.season i.now{box-shadow:0 0 0 1.5px var(--sheet),0 0 0 3px var(--forest)}
.season-txt{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.season-txt span:first-child{font-weight:600;color:var(--ink-2)}

/* how an order travels */
.flow,.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px}
.flow li,.docs li{position:relative;padding-top:38px}
.flow li::before{content:"";position:absolute;top:13px;left:0;right:-24px;height:2px;background:var(--sage-2)}
.flow li:last-child::before{right:0}
.flow-n{position:absolute;top:0;left:0;width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;font:700 13px/28px var(--font-ui);text-align:center;font-variant-numeric:lining-nums!important}
.flow h3,.docs h2{font:600 26px/1.1 var(--font-display);color:var(--forest)}
.flow p,.docs p{color:var(--ink-2);margin-top:6px;line-height:1.55;font-size:15.5px;max-width:20rem}

/* growers and customers */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.door{position:relative;overflow:hidden;background:var(--sheet);border:1px solid var(--line);padding:clamp(24px,3vw,36px) clamp(136px,15vw,190px) clamp(24px,3vw,32px) clamp(24px,3vw,36px);display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:310px}
.door-art{position:absolute;right:clamp(12px,2vw,28px);bottom:0;width:clamp(110px,12vw,150px);max-width:40%}
.door-art .door-plant{width:100%;height:auto;display:block}
.door h2{font:500 clamp(28px,3vw,36px)/1.08 var(--font-display);color:var(--forest)}
.door p{color:var(--ink-2);line-height:1.6;max-width:30rem}
.door .go{margin-top:auto}
.door-btn{margin-top:6px}
.door .door-note{margin-top:auto;font-size:15px}
.door-note a{color:var(--leaf);font-weight:600;overflow-wrap:anywhere}
.mailchip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);max-width:100%}
.mailchip span{font-weight:600;overflow-wrap:anywhere}

/* contact */
.visit{position:relative;border-top:1px solid var(--line);padding-bottom:clamp(72px,9vw,112px)}
.visit-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:24px 48px;align-items:start}
.visit h2{font:500 clamp(32px,3.6vw,44px)/1.05 var(--font-display);color:var(--forest);margin-top:12px}
.visit-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.visit-facts dd{margin-top:8px;line-height:1.65}
.visit-facts a{color:var(--ink);text-decoration:none}
.visit-facts a:hover{text-decoration:underline}
.roof{position:absolute;left:0;bottom:-1px;width:100%;height:30px;color:var(--sage-2);max-width:none;pointer-events:none}

/* footer */
.foot{background:var(--forest);color:var(--on-ink-2)}
.foot :focus-visible{outline-color:var(--on-ink)}
.foot-in{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:28px 32px;padding-block:48px 32px;font-size:14.5px;line-height:1.7}
.foot-brand p{margin-top:16px;max-width:18rem}
.foot h2{font:600 11px/1.3 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--on-ink);margin-bottom:10px}
.foot a{color:var(--on-ink-2);text-decoration:none}
.foot a:hover{color:#fff;text-decoration:underline}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding-block:16px 26px;border-top:1px solid rgba(244,245,240,.16);font-size:13px}

/* inner pages */
.page-hero{background:linear-gradient(180deg,var(--sheet),var(--paper));border-bottom:1px solid var(--sage-2)}
.page-hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:end;padding-top:clamp(40px,6vw,72px)}
.page-hero-in > div:first-child{padding-bottom:clamp(36px,5vw,56px)}
.page-hero h1{font:500 clamp(44px,6vw,66px)/1 var(--font-display);margin-top:18px;color:var(--forest)}
.page-art{width:clamp(180px,22vw,260px);max-width:100%}
.page-art .page-plant{width:100%;height:auto;display:block}
.mailbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:32px;padding:18px 22px;border:1px solid var(--line);background:var(--sheet);max-width:640px}
.mailbox-addr{font:500 clamp(24px,3.4vw,34px)/1.1 var(--font-display);overflow-wrap:anywhere;color:var(--forest)}
.page-body{display:grid;gap:clamp(40px,6vw,64px);padding-block:clamp(44px,6vw,72px) clamp(64px,8vw,96px)}
.docs{grid-template-columns:repeat(3,minmax(0,1fr))}
.docs-sec{display:grid;gap:24px}
.facts{max-width:860px;border-top:1px solid var(--line)}
.facts > div{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:4px 24px;padding-block:14px;border-bottom:1px solid var(--line)}
.facts dt{font:600 11.5px/1.9 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{line-height:1.55}

@media (max-width:1060px){
  .range-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .visit-in{grid-template-columns:minmax(0,1fr)}
  .foot-in{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero-in{grid-template-columns:minmax(0,1fr);gap:8px}
  .hero-copy{padding-bottom:16px}
  .plate{width:min(100%,380px);justify-self:center}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
  .flow li::before{right:0}
  .doors{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .top-bar{flex-wrap:wrap;gap:10px 12px;padding-block:10px}
  .top-cta{order:2;margin-left:auto}
  .top-nav{order:3;flex:1 0 60%;margin-left:0;flex-wrap:wrap;gap:2px 16px;font-size:14.5px}
  .top-bar > .lang{order:4}
  .top-nav a{padding-block:6px;white-space:nowrap}
  .hero-facts{grid-template-columns:minmax(0,1fr)}
  .visit-facts{grid-template-columns:minmax(0,1fr)}
  .docs{grid-template-columns:minmax(0,1fr);gap:24px}
  .facts > div{grid-template-columns:minmax(0,1fr)}
  .page-hero-in{grid-template-columns:minmax(0,1fr)}
  .page-hero-in > div:first-child{padding-bottom:0}
  .page-art{justify-self:center;width:200px}
  .foot-in{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wordmark .mark{height:40px}
  .wm-txt b{font-size:24px}
  .wm-txt i{font-size:7.7px}
  .top-right .who{display:none}
  .top-right{gap:8px}
  .top-bar:has(.top-right){flex-wrap:wrap}
  .range-grid{gap:10px}
  .pcard-body{padding:12px 12px 14px}
  .pcard h3{font-size:clamp(17px,5vw,20px)}
  .p-latin{font-size:15px}
  .p-latin.p-common{font-size:13.5px}
  .flow{grid-template-columns:minmax(0,1fr)}
  .door{padding:24px 24px 150px}
  .door-art{width:118px}
}
@media (max-width:360px){
  .wordmark{gap:8px}
  .wordmark .mark{height:34px}
  .wm-txt b{font-size:21px}
  .wm-txt i{font-size:6.7px}
  .top-cta{font-size:13px;padding-inline:10px}
  .top-nav{gap:2px 12px;font-size:14px}
}

/* ---------- sign-in ---------- */
.login-page{display:grid;justify-items:center;gap:20px;padding:clamp(32px,6vw,72px) 16px 72px}
.login-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,380px);width:min(100%,800px);border:1px solid var(--line);background:var(--sheet)}
.login{display:grid;gap:8px;padding:30px 28px;align-content:start}
.login h1{font:500 42px/1.05 var(--font-display);margin-top:10px;color:var(--forest)}
.login .muted{margin-bottom:8px}
.login label{font-weight:600;font-size:14.5px;margin-top:8px}
.login input{height:46px;padding:0 12px;border:1px solid var(--line-2);border-radius:0;background:var(--paper)}
.login input:focus{outline:2px solid var(--leaf);outline-offset:0;border-color:var(--leaf)}
.login .btn{margin-top:14px}
.form-err{color:var(--warn);font-size:14.5px}
.demo-acc{display:grid;gap:8px;margin-top:16px;padding-top:18px;border-top:1px solid var(--line)}
.acc{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--paper);font-weight:600}
.acc:hover{border-color:var(--ink)}
.acc span{color:var(--ink-3);font-weight:400;font-size:13.5px;overflow-wrap:anywhere}
.login-side{background:var(--sage);border-left:1px solid var(--sage-2);padding:30px 28px 0;display:flex;flex-direction:column;gap:10px}
.login-side h2{font:500 32px/1.08 var(--font-display);color:var(--forest)}
.ticks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;color:var(--ink-2);line-height:1.5;font-size:15px}
.ticks li{position:relative;padding-left:22px}
.ticks li::before{content:"";position:absolute;left:2px;top:.5em;width:9px;height:5px;border-left:2px solid var(--leaf);border-bottom:2px solid var(--leaf);transform:rotate(-45deg)}
.ls-art{order:9;margin-top:auto;align-self:center;width:min(100%,230px)}
.ls-art .ls-plant{display:block;width:100%;height:auto}
.back-site{color:var(--ink-2)}
@media (max-width:760px){
  .login-wrap{grid-template-columns:minmax(0,1fr);width:min(100%,440px)}
  .login-side{border-left:0;border-top:1px solid var(--sage-2);padding:24px 24px 0}
  .ls-art{width:160px}
}

/* ---------- customer door ---------- */
.cust-main{display:grid;gap:16px;padding-block:clamp(36px,6vw,64px) 72px;max-width:900px}
.cust-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 24px;margin-bottom:8px}
.cust-head > div{flex:1 1 420px;min-width:0}
.cust-sum{flex:none}
.cust-head h1{font:500 clamp(40px,5vw,58px)/1 var(--font-display);margin-top:14px;color:var(--forest)}
.cust-head .muted{margin-top:10px;max-width:36rem}
.cust-sum{display:grid;grid-template-columns:repeat(3,auto);gap:1px;background:var(--line);border:1px solid var(--line)}
.cust-sum > div{background:var(--sheet);padding:10px 16px;min-width:88px}
.cust-sum dd{font:500 30px/1.1 var(--font-display);color:var(--forest);margin-top:4px}
.cust-main > h2{font:500 30px/1.1 var(--font-display);margin-top:20px;color:var(--forest)}
.ocard{background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--sprout);padding:22px;display:grid;gap:18px}
.ocard.done{border-left-color:var(--line-2)}
.ocard header{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ocard header > div{display:grid;gap:4px;align-content:start}
.ocard header b{font-size:16px;letter-spacing:.02em}
.olines{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.olines li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.olines li:last-child{border-bottom:0;padding-bottom:0}
.ol-ic{flex:none;width:42px;height:42px;background:var(--sage);border-radius:50%;display:grid;place-items:end center;overflow:hidden}
.ol-plant{width:46px;height:46px;display:block;margin-bottom:-9px}
.ol-name{font-weight:600}
.olines .ol-size{color:var(--ink-3);font-size:14px}
.olines .num{margin-left:auto;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{position:relative;padding-top:22px;font-size:14px;color:var(--ink-3)}
.steps li::before{content:"";position:absolute;top:7px;left:0;right:-6px;height:3px;background:var(--track)}
.steps li:last-child::before{right:0}
.steps li::after{content:"";position:absolute;top:3px;left:0;width:11px;height:11px;border-radius:50%;background:var(--sheet);border:2px solid var(--track)}
.steps li.done,.steps li.now{color:var(--ink)}
.steps li.done::before{background:var(--leaf)}
.steps li.done::after{background:var(--leaf);border-color:var(--leaf)}
.steps li.now::after{background:var(--sprout);border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-bg)}
.steps li.now{font-weight:700}
.set-by{font-size:13.5px;color:var(--ink-3)}
.cust-help{padding:18px 20px;border:1px solid var(--sage-2);background:var(--sage);color:var(--ink-2)}
.cust-help a{color:var(--ink)}
@media (max-width:560px){
  .ocard{padding:18px 16px}
  .ocard header{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ocard header > div:first-child{grid-column:1 / -1}
  .steps li{font-size:12.5px}
  .cust-sum{width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
  .cust-sum > div{min-width:0}
}


/* ---------- desk shell ---------- */
.desk{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main";min-height:100vh}
.desk-top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px clamp(16px,3vw,28px);background:var(--ink);color:var(--on-ink)}
.dt-name{font:600 11.5px/1 var(--font-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--on-ink-2);padding-left:16px;border-left:1px solid var(--on-ink-line)}
.dt-week{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.dt-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14.5px}
.dt-note{color:var(--on-ink-2);font-size:13.5px}
.desk-nav{grid-area:nav;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;text-decoration:none;color:var(--ink-2);font-size:15px}
.nav-item small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-top:1px}
.nav-item.on small{color:var(--on-ink-2)}
.nav-item:hover{background:var(--paper-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:var(--on-ink);font-weight:600}
.nav-item .n{font:700 12px/1 var(--font-ui);padding:3px 7px;border-radius:2px;background:var(--wait-bg);color:var(--wait)}
.nav-item.on .n{background:var(--on-ink);color:var(--ink)}
.nav-foot{margin-top:20px;padding:16px 10px 0;border-top:1px solid var(--line);display:grid;gap:12px;font-size:13.5px;color:var(--ink-3)}
.nav-foot .btn{justify-self:start}
.desk-main{grid-area:main;min-width:0;padding:30px clamp(16px,3vw,40px) 80px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px 24px;margin-bottom:24px}
.page-head h1{font:500 clamp(36px,4vw,50px)/1 var(--font-display);margin-top:10px}
.page-head .lede-d{color:var(--ink-2);max-width:64ch;margin-top:12px;line-height:1.6}
.block{margin-top:36px}
.block-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.block-head h2{font:500 34px/1.05 var(--font-display)}
.block-head p{color:var(--ink-2);font-size:15px;max-width:72ch;margin-top:6px;line-height:1.55}
@media (max-width:900px){
  .desk,.desk.nav-closed{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"top" "nav" "main"}
  .desk-nav{z-index:25;max-height:none;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);background:var(--paper)}
  .nav-item{white-space:nowrap;padding:7px 11px;flex:none}
  .nav-foot,.dt-name{display:none}
}
@media (max-width:640px){.dt-note,.dt-right .who{display:none}.desk-top{flex-wrap:nowrap}}

/* ---------- shared bits from the order list ---------- */
.latin{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--ink-2);font-size:18px}
.late{color:var(--warn);font-style:normal;font-weight:600}
.tick-box{width:22px;height:22px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none;background:var(--sheet)}
.pts{color:var(--warn);font-weight:700;font-variant-numeric:lining-nums tabular-nums!important}
.gain{color:var(--leaf);font-weight:700;font-variant-numeric:lining-nums tabular-nums!important}
.orderbar{position:sticky;bottom:0;z-index:20;margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);box-shadow:var(--shadow)}
.orderbar p{font-size:15px}
.orderbar .btn{background:var(--on-ink);color:var(--ink)}
.orderbar .btn:hover{background:var(--paper-2)}
.orderbar.idle{position:static;background:var(--paper-2);color:var(--ink-2);box-shadow:none}

/* ---------- invoices ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1180px){.two{grid-template-columns:minmax(0,1fr)}}
.ranklist{display:grid;gap:16px}
.rgroup{background:var(--sheet);border:1px solid var(--line)}
.rgroup > header{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.rgroup > header h3{font:600 15px/1.3 var(--font-ui);display:flex;align-items:center;gap:8px}
.rgroup > header p{font-size:14px;color:var(--ink-2)}
.rgroup .empty{padding:14px 18px;color:var(--ink-3);font-size:15px}
.inv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;padding:16px 18px;border-top:1px solid var(--line)}
.rgroup > header + .inv{border-top:0}
.inv-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.inv-top b{font-weight:600;font-size:16.5px}
.inv-sub{font-size:15px;color:var(--ink-2);margin-top:5px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.inv-sub b{color:var(--ink)}
.ind{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ind li{font-size:13px;line-height:1.3;padding:3px 8px;border-radius:2px;background:var(--leaf-bg);color:var(--leaf);white-space:nowrap}
.ind li.n{background:var(--warn-bg);color:var(--warn)}
.ind li b{font-weight:700}
.notice{margin-top:10px;padding:11px 14px;font-size:15px;line-height:1.5;background:var(--wait-bg);color:var(--ink);max-width:78ch}
.notice.bad{background:var(--warn-bg)}
.notice.info{background:var(--info-bg)}
.match{margin-top:8px;font-size:14px;color:var(--ink-2)}
.inv-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:168px}
.inv-act .state{font-size:13.5px;color:var(--ink-2);text-align:right;max-width:26ch}
.rk{font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:2px;white-space:nowrap}
.rk.dont{background:var(--warn);color:var(--on-ink)}
.rk.today{background:var(--leaf);color:var(--on-ink)}
.rk.week{background:var(--info-bg);color:var(--info)}
.rk.later{background:var(--paper-2);color:var(--ink-2)}
.rk.credit{background:var(--leaf-bg);color:var(--leaf)}
.rk.review{background:var(--wait-bg);color:var(--wait)}
@media (max-width:640px){.inv{grid-template-columns:minmax(0,1fr)}.inv-act{align-items:stretch;min-width:0}.inv-act .state{text-align:left;max-width:none}}

/* ---------- exceptions, sheets, review ---------- */
.panel{background:var(--sheet);border:1px solid var(--line)}
.panel > header{padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel > header h3{font:600 15px/1.3 var(--font-ui)}
.panel + .panel{margin-top:16px}
.exc-none{padding:13px 18px;color:var(--ink-3);font-size:15px}
.cards{display:grid;gap:16px}
.slip{background:var(--sheet);border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px}
.slip.seen{opacity:.7}
.slip-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}
.sheet-body{padding:14px 18px;display:grid;gap:14px}
.sheet-body dd{margin-top:3px;font-size:15px}
.so{display:grid;gap:7px;padding-top:12px;border-top:1px solid var(--line)}
.so:first-of-type{border-top:0;padding-top:4px}
.so-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px}
.seg-ctl{display:flex;flex-wrap:wrap;gap:4px}
.seg-ctl button{font-size:13.5px;padding:6px 10px;border:1px solid var(--line-2);background:var(--paper);font-weight:500}
.seg-ctl button:hover{border-color:var(--ink)}
.seg-ctl button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}
.hint{font-size:14px;color:var(--info);background:var(--info-bg);padding:7px 10px}
.next{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line);background:var(--paper);display:grid;gap:9px}
.next p{font-size:15px}
.next-opts{display:flex;flex-wrap:wrap;gap:6px}
.next-opts button{padding:7px 11px;border:1px solid var(--line-2);background:var(--sheet);font-size:14px;font-weight:600}
.next-opts button:hover{border-color:var(--ink)}
.next-opts button.sug{border-color:var(--leaf);color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.next-opts button.chosen{background:var(--leaf);border-color:var(--leaf);color:var(--on-ink)}
.draft{white-space:pre-wrap;font:13.5px/1.55 var(--font-data);background:var(--sheet);border:1px solid var(--line);padding:11px 13px;margin:0;overflow-x:auto}
.rev{background:var(--sheet);border:1px solid var(--line);padding:18px;display:grid;gap:11px}
.rev.done{opacity:.78}
.raw{font:13.5px/1.55 var(--font-data);background:var(--paper);border:1px dashed var(--line-2);padding:11px 13px;overflow-x:auto;white-space:pre;margin:0}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.conf .bar{width:120px;height:5px;background:var(--track);overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--wait)}
.rev-form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.rev-form label{display:grid;gap:4px;font-size:14px;font-weight:600}
.rev-form input{height:40px;padding:0 10px;border:1px solid var(--line-2);background:var(--paper);width:160px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px/1.3 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);background:var(--paper);white-space:nowrap}
td.r,th.r{text-align:right}
td.nw{white-space:nowrap}
tr.grp td{background:var(--paper);font-weight:600;color:var(--ink)}
tr:last-child td{border-bottom:0}
.score-pill{display:inline-block;font:700 14px/1 var(--font-ui);font-variant-numeric:lining-nums tabular-nums!important;padding:5px 6px;border:1px solid var(--line-2)}
.score-pill.top{background:var(--leaf);border-color:var(--leaf);color:var(--on-ink)}

/* ---------- rules ---------- */
.rules{display:grid;gap:40px;max-width:960px}
.rules h2{font:500 34px/1.05 var(--font-display)}
.rules h3{font:600 16px/1.3 var(--font-ui);margin-top:6px}
.rules section{display:grid;gap:14px}
.rules p{color:var(--ink-2);max-width:70ch;line-height:1.6}
.law{font:500 clamp(26px,3vw,36px)/1.25 var(--font-display);padding:22px 24px;border:1px solid var(--ink);background:var(--sheet)}
.law b{font-weight:600;color:var(--leaf)}
.read10{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.read10 li{padding:12px 14px;background:var(--sheet);font-size:15px;display:grid;gap:2px;align-content:start}
.read10 li small{color:var(--ink-3);font-size:13px}
@media (max-width:900px){.read10{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plain{margin:0;padding-left:20px;display:grid;gap:7px;color:var(--ink-2);line-height:1.55}
.plain b{color:var(--ink)}
.road{list-style:none;padding:0;margin:0;border:1px solid var(--line);background:var(--sheet)}
.road li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:13px 18px;border-top:1px solid var(--line);align-items:baseline}
.road li:first-child{border-top:0}
.road .k{font:500 22px/1 var(--font-display);color:var(--ink-3)}
.calc{font:13.5px/1.65 var(--font-data);background:var(--sheet);border:1px solid var(--line);padding:14px 16px;overflow-x:auto;white-space:pre;margin:0;color:var(--ink)}
@media (max-width:560px){.road li{grid-template-columns:24px minmax(0,1fr)}.road li .chip{grid-column:2}}

/* ---------- overlay ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.dialog{width:min(100%,680px);max-height:min(88vh,820px);overflow:auto;background:var(--sheet);padding:24px 24px 0;box-shadow:var(--shadow);display:grid;gap:14px}
.dialog h2{font:500 34px/1.05 var(--font-display)}
.dialog-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 0 calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sheet)}
.og{display:grid;gap:8px;padding:14px 16px;border:1px solid var(--line)}
.og-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.og-head b{font-size:16.5px}
.og ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
@media (max-width:560px){.modal{place-items:end stretch;padding:0}.dialog{max-height:90vh}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--on-ink);padding:11px 18px;font-size:15px;width:max-content;max-width:min(92vw,560px);box-shadow:var(--shadow)}

/* ---------- desk: shared additions ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.back-site{margin-top:18px;color:var(--ink-2)}
.intro{color:var(--ink-2);font-size:15px;line-height:1.55;max-width:72ch;margin-bottom:14px}
.select{appearance:auto;justify-content:flex-start;max-width:300px;height:42px;padding:0 10px;border:1px solid var(--line-2);background:var(--paper);font-weight:600}
.panel-head{padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.panel-head h3{font:600 15px/1.3 var(--font-ui)}
.sub-h{font:600 16px/1.3 var(--font-ui);margin-top:18px;margin-bottom:10px}
.tbl-wrap.flat{border:0;border-bottom:1px solid var(--line)}

/* folds: any section can be folded away */
.fold-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.fold-btn{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;cursor:pointer;min-height:36px}
.fold-btn h2{font:500 34px/1.05 var(--font-display)}
.fold-btn h3{font:600 15px/1.3 var(--font-ui)}
.chev{width:9px;height:9px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-2px) rotate(45deg);transition:transform .15s;flex:none}
.fold.closed > .fold-head .chev{transform:rotate(-45deg)}
.fold-btn:hover .chev{border-color:var(--ink)}
.fold-meta{color:var(--ink-2);font-size:14.5px}
.fold-tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:14.5px}
.block.fold > .fold-head{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.block.fold.closed > .fold-head{margin-bottom:0}
.panel.fold > .fold-head,.rgroup.fold > .fold-head,.panel-fold > .fold-head{padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);margin:0}
.panel.fold.closed > .fold-head,.rgroup.fold.closed > .fold-head{border-bottom:0}
.rgroup.fold > .fold-head .fold-btn h3{display:flex;align-items:center;gap:8px}
.rgroup.fold > .fold-head .fold-meta{font-size:14px;flex:1 1 280px}
.rgroup > .fold-body > .inv:first-child{border-top:0}
.panels{display:grid;gap:16px}
.panel-fold{background:var(--sheet);border:1px solid var(--line)}
.block.panel-fold > .fold-head{padding:10px 18px;margin:0;border-bottom:1px solid var(--line)}
.block.panel-fold.closed > .fold-head{border-bottom:0}
ul.matched{list-style:none;margin:0;padding:0 18px 8px}
ul.matched li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ul.matched li:first-child{border-top:0}

/* menu column can be folded away */
.nav-open-btn{display:none}
.desk.nav-closed{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
.desk.nav-closed .desk-nav{display:none}
.desk.nav-closed .nav-open-btn{display:inline-flex}
@media (max-width:900px){
  .desk.nav-closed{grid-template-areas:"top" "nav" "main"}
  .desk.nav-closed .desk-nav{display:flex}
  .desk.nav-closed .nav-open-btn{display:none}
  .nav-item small{display:none}
}

/* ---------- Offertes: column picker ---------- */
.colpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.colpick .eyebrow{margin-right:6px}
.colbtn{font-size:13.5px;padding:5px 10px;border:1px solid var(--line-2);background:var(--sheet);font-weight:600}
.colbtn:hover{border-color:var(--ink)}
.colbtn.off{background:transparent;color:var(--ink-3);border-style:dashed;text-decoration:line-through;font-weight:500}
.qt.h-grower .c-grower,.qt.h-plant .c-plant,.qt.h-size .c-size,.qt.h-qty .c-qty,.qt.h-price .c-price,.qt.h-freight .c-freight,.qt.h-ship .c-ship,.qt.h-valid .c-valid,.qt.h-travel .c-travel,.qt.h-cust .c-cust,.qt.h-min .c-min,.qt.h-file .c-file{display:none}

/* ---------- Score instellen ---------- */
.set-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.set-main{display:grid;gap:16px}
.set-side{position:sticky;top:16px}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.preset{display:grid;gap:4px;align-content:start;text-align:left;padding:12px 14px;background:var(--sheet);border:0}
.preset:hover{background:var(--paper)}
.preset b{font-weight:600}
.preset span{font-size:12.5px;color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums!important}
.preset.on{background:var(--leaf);color:var(--on-ink)}
.preset.on span{color:var(--on-ink-2)}
.sliders{display:grid;padding:8px 18px}
.slider-row{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slider-row:first-child{border-top:0}
.slider-row label{font-weight:600}
.slider-row output{font:600 21px/1 var(--font-ui);text-align:right;font-variant-numeric:lining-nums tabular-nums!important}
input[type=range]{width:100%;accent-color:var(--leaf);height:28px}
.set-note{padding:0 18px 14px;font-size:14px;color:var(--ink-3)}
.rules-set{display:grid;gap:16px;padding:16px 18px}
.inline-field{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.inline-field input{width:74px;height:38px;padding:0 8px;border:1px solid var(--line-2);background:var(--paper)}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer}
.switch input,fieldset.radio input{accent-color:var(--leaf);width:18px;height:18px;margin:0}
fieldset.radio{border:0;padding:0;margin:0;display:grid;gap:8px}
fieldset.radio legend{font-weight:600;margin-bottom:6px;padding:0}
fieldset.radio label{display:flex;gap:10px;align-items:center;cursor:pointer}
.set-foot{display:flex;flex-wrap:wrap;gap:10px}
.impact-body{padding:14px 18px;display:grid;gap:12px}
.impact-list{list-style:none;margin:0;padding:0}
.impact-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
@media (max-width:1100px){.set-layout{grid-template-columns:minmax(0,1fr)}.set-side{position:static}}
@media (max-width:700px){.presets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.slider-row{grid-template-columns:minmax(0,1fr) 44px}.slider-row input{grid-column:1 / -1;grid-row:2}}

/* ---------- Klanten ---------- */
.cust-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
.cust-list{border:1px solid var(--line);background:var(--sheet);position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.cust-tools{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.cust-tools input{height:40px;padding:0 10px;border:1px solid var(--line-2);background:var(--paper);width:100%}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.filters button{font-size:13px;padding:4px 8px;border:1px solid var(--line-2);background:var(--paper);font-weight:600}
.filters button .num{color:var(--ink-3);font-weight:500}
.filters button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.filters button.on .num{color:var(--on-ink-2)}
.cust-list ul{list-style:none;margin:0;padding:0;overflow:auto}
.cust-item{display:grid;gap:4px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.cust-list li:first-child .cust-item{border-top:0}
.cust-item:hover{background:var(--paper)}
.cust-item.on{background:var(--ink);color:var(--on-ink)}
.cust-item.on .ci-sub{color:var(--on-ink-2)}
.ci-top{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ci-top b{font-weight:600;font-size:15.5px;margin-right:auto}
.ci-sub{font-size:13.5px;color:var(--ink-3)}
.cust-none{padding:14px;color:var(--ink-3)}
.cust-detail{min-width:0;display:grid;gap:16px;align-content:start}
.cd-head{display:grid;gap:6px}
.cd-head h2{font:500 46px/1 var(--font-display)}
.cd-contact{color:var(--ink-2)}
.cd-pattern{color:var(--ink-2)}
.cd-mail{padding:14px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpis > div{background:var(--sheet);padding:14px 16px}
.kpis dt{font:600 11px/1.3 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.kpis dd{margin-top:6px;font:500 30px/1.1 var(--font-display);font-variant-numeric:lining-nums tabular-nums!important}
.panel .next{border-top:0}
.panel .so{padding:12px 18px}
.panel .so + .so{border-top:1px solid var(--line)}
.hist td{font-size:14px}
.hist-more{padding:10px 18px}
.back-link{display:none;width:fit-content;color:var(--ink-2)}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){
  .cust-layout{grid-template-columns:minmax(0,1fr)}
  .cust-list{position:static;max-height:none}
  .cust-layout.has-sel .cust-list,.cust-layout:not(.has-sel) .cust-detail{display:none}
  .back-link{display:inline-block}
}

/* grid children that hold tables must be allowed to shrink */
.cust-detail > *,.set-main > *,.set-side,.panels > *,.ranklist > *,.cards > *,.fold-body,.board > *{min-width:0}
.hist .ln{display:block;white-space:nowrap}

/* ---------- wishes, customer details, fixed costs ---------- */
.wish{border:1px solid var(--line);background:var(--sheet);padding:16px 18px;display:grid;gap:8px}
.wish-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wish-head h3{margin:0}
.wish-text{font:500 23px/1.35 var(--font-display);max-width:46ch}
.wish-form{display:grid;gap:8px}
.wish-form textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line-2);background:var(--paper);font:inherit;line-height:1.5;resize:vertical}
.wish-actions{display:flex;gap:8px}
.cd-data{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0}
.cd-data > div{background:var(--sheet);padding:12px 14px;min-width:0}
.cd-data dt{font:600 11px/1.3 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.cd-data dd{margin-top:5px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.cd-data dd a{color:var(--ink)}
@media (max-width:1250px){.cd-data{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cd-data{grid-template-columns:minmax(0,1fr)}}
.cost-group{border:1px solid var(--line);background:var(--sheet);margin-top:12px}
.cost-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.cost-head h4{margin:0;font:600 15px/1.3 var(--font-ui)}
.cost-list{list-style:none;margin:0;padding:0}
.cost-list li{display:grid;grid-template-columns:minmax(0,1fr) 128px 34px;gap:10px;align-items:center;padding:6px 16px;border-top:1px solid var(--line)}
.cost-list li:first-child{border-top:0}
.cost-name{width:100%;min-width:0;height:36px;padding:0 8px;border:1px solid transparent;background:transparent}
.cost-name:hover,.cost-name:focus{border-color:var(--line-2);background:var(--paper)}
.cost-amt{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.cost-amt input{width:100%;min-width:0;height:36px;padding:0 8px;border:1px solid var(--line-2);background:var(--paper);text-align:right;font-variant-numeric:lining-nums tabular-nums!important}
.cost-del{width:32px;height:32px;border:1px solid transparent;background:none;color:var(--ink-3);font-size:19px;line-height:1}
.cost-del:hover{border-color:var(--warn);color:var(--warn)}
.cost-group > .lnk{display:inline-block;margin:6px 16px 12px}
.cost-total{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:14px;padding:14px 16px;border:1px solid var(--ink);background:var(--sheet)}
.cost-total b{font:500 32px/1 var(--font-display)}
@media (max-width:520px){.cost-list li{grid-template-columns:minmax(0,1fr) 104px 30px;gap:6px;padding:6px 10px}}

/* the font shorthand resets figure style, so serif numbers ask for lining figures again */
.road .k,.cost-total b,.kpis dd,.dblock b,.tcol-n{font-variant-numeric:lining-nums tabular-nums!important}
.rgroup .plain{padding:12px 18px 14px 38px}
.rgroup .sheet-body{padding:14px 18px}

/* ---------- menu icon, as in Outlook ---------- */
.nav-top{display:flex;margin:-8px 0 6px -2px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid transparent;background:none;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
@media (max-width:900px){.nav-top{display:none}}

/* ---------- Offertes: best quote per customer, Bewaard, dragging ---------- */
.grip{display:block;width:8px;height:14px;background-image:radial-gradient(circle,var(--ink-3) 1px,transparent 1.3px);background-size:4px 4.67px;opacity:.8}
[draggable="true"]{cursor:grab}
[draggable="true"]:active{cursor:grabbing}
.qm-list{display:grid;gap:10px;container-type:inline-size}
.qm{background:var(--sheet);border:1px solid var(--line)}
.qm > .fold-head{display:grid;grid-template-columns:8px minmax(0,1fr);grid-template-areas:"grip cust" "grip best";align-items:center;gap:6px 14px;padding:10px 14px 10px 12px}
.qm:not(.closed) > .fold-head{border-bottom:1px solid var(--line)}
.qm > .fold-head > .grip{grid-area:grip}
.qm > .fold-head > .fold-btn{grid-area:cust;min-width:0}
.qm-cust{display:grid;gap:1px;min-width:0}
.qm-cust b{font-weight:600;font-size:17px}
.qm-need{font-size:14px;color:var(--ink-2)}
.qm-best{grid-area:best;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:15px;padding-left:21px}
.qm-grower{font-weight:600}
@container (min-width:720px){
  .qm > .fold-head{grid-template-columns:8px minmax(0,1fr) auto;grid-template-areas:"grip cust best"}
  .qm-best{justify-content:flex-end;padding-left:0}
}
.qm-wish{padding:10px 16px;border-bottom:1px solid var(--line);font-size:15px}
.qm-wish .eyebrow{margin-right:10px}
.qm-note{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--wait-bg);font-size:14.5px}
.qm-why{padding:10px 16px;border-top:1px solid var(--line);background:var(--paper);font-size:14.5px;color:var(--ink-2)}
.qm-why b{color:var(--ink)}
.ql-list{list-style:none;margin:0;padding:0;container-type:inline-size}
.ql{display:grid;grid-template-columns:8px 18px minmax(0,1fr);grid-template-areas:"grip rank who" "grip rank meta" "grip rank act";align-items:center;gap:6px 12px;padding:9px 10px 9px 12px;border-top:1px solid var(--line);font-size:15px;background:var(--sheet)}
.ql.sv{grid-template-columns:8px minmax(0,1fr);grid-template-areas:"grip who" "grip meta" "grip act"}
.ql:first-child{border-top:0}
.ql.on{background:var(--leaf-bg)}
.ql > .grip{grid-area:grip}
.ql-rank{grid-area:rank;font:500 19px/1 var(--font-display);color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums!important}
.ql-who{grid-area:who;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0}
.ql-who b{font-weight:600}
.ql-meta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.ql-price{font-size:14px;color:var(--ink-2)}
.ql-price b{font-size:15px;color:var(--ink)}
.ql-act{grid-area:act;display:flex;align-items:center;gap:6px}
@container (min-width:560px){
  .ql{grid-template-columns:8px 18px minmax(0,1fr) auto;grid-template-areas:"grip rank who act" "grip rank meta act"}
  .ql.sv{grid-template-columns:8px minmax(0,1fr) auto;grid-template-areas:"grip who act" "grip meta act"}
  .ql-act{justify-content:flex-end}
}
@container (min-width:860px){
  .ql{grid-template-columns:8px 18px minmax(0,1fr) 400px auto;grid-template-areas:"grip rank who meta act"}
  .ql.sv{grid-template-columns:8px minmax(0,1fr) 400px auto;grid-template-areas:"grip who meta act"}
  .ql-meta{display:grid;grid-template-columns:minmax(0,1fr) 58px 150px;gap:12px}
  .ql-meta .chip{justify-self:start}
}
.ql-list.saved{border:1px solid var(--line)}
.mini-tick{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 10px 4px 8px;border:1px solid var(--line-2);background:var(--sheet);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;-webkit-user-select:none;user-select:none}
.mini-tick:hover{border-color:var(--ink)}
.mini-tick input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.mini-tick .tick-box{width:18px;height:18px}
.mini-tick:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.mini-tick.on{border-color:var(--leaf);color:var(--leaf)}
.mini-tick.on .tick-box{background:var(--leaf);border-color:var(--leaf)}
.mini-tick.on .tick-box::after{content:"";width:5px;height:9px;border:solid var(--on-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.x-btn{width:34px;height:34px;padding:0;border:1px solid transparent;background:none;color:var(--ink-3);font-size:20px;line-height:1}
.x-btn:hover{border-color:var(--warn);color:var(--warn)}
.drop-empty{display:flex;align-items:center;gap:14px;padding:18px 20px;border:1.5px dashed var(--line-2);color:var(--ink-2);font-size:15px;line-height:1.5}
.drop-empty svg{width:26px;height:26px;flex:none;color:var(--brass)}
.dragging .drop-zone{outline:2px dashed var(--leaf);outline-offset:6px}
.drop-zone.drop-on{outline-style:solid;background:var(--leaf-bg)}
.drag-src{opacity:.45}
.qt tr[draggable="true"]:hover td{background:var(--paper)}
.dock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:110;display:none;flex-direction:column;gap:8px;padding:8px;background:var(--ink);box-shadow:var(--shadow)}
.dragging .dock{display:flex}
.dock-t{display:grid;justify-items:center;gap:3px;width:210px;padding:12px 16px;border:1.5px dashed var(--on-ink-line);color:var(--on-ink);text-align:center}
.dock-t svg{width:22px;height:22px}
.dock-t b{font-weight:600;font-size:16px}
.dock-t small{font-size:12.5px;color:var(--on-ink-2)}
.dock-t.drop-on{border-style:solid;border-color:var(--on-ink);background:var(--leaf)}
/* keep the toast clear of the order bar at the bottom */
body:has(.orderbar:not(.idle)) .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* the score doubles as the favourite button */
.score-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 7px 4px 5px;background:var(--sheet);color:var(--ink);line-height:1;white-space:nowrap}
.score-btn svg{width:13px;height:13px;flex:none;visibility:hidden;color:var(--brass)}
button.score-btn{cursor:pointer}
button.score-btn:hover{border-color:var(--brass)}
button.score-btn:hover svg,button.score-btn:focus-visible svg,.score-btn.fav svg{visibility:visible}
.score-btn.fav{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.score-btn.top{background:var(--leaf);border-color:var(--leaf);color:var(--on-ink)}
.score-btn.top svg{color:#e6d3a0}
.score-btn.top.fav{border-color:var(--brass);box-shadow:inset 0 0 0 1px #e6d3a0}
.score-btn span{font-variant-numeric:lining-nums tabular-nums!important}

/* ---------- Vandaag: one overview in three columns ---------- */
.dp{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--ink-2);font-size:15px}
.dp-bars{display:flex;gap:4px}
.dp-bars i{display:block;width:26px;height:6px;background:var(--track)}
.dp-bars i.on{background:var(--leaf)}
.board-wrap{container-type:inline-size}
.board{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:stretch}
@container (min-width:660px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.board > .tcol:first-child{grid-column:1 / -1}}
@container (min-width:980px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.board > .tcol:first-child{grid-column:auto}}
.tcol{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line)}
.tcol-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.tcol-n{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--ink);font:600 14px/1 var(--font-ui);font-variant-numeric:lining-nums}
.tcol.done .tcol-n{background:var(--leaf);border-color:var(--leaf);color:var(--on-ink)}
.tcol-head h2{font:500 30px/1.05 var(--font-display)}
.tcol-stat{font-size:14px;font-weight:600;color:var(--ink-2);text-align:right;white-space:nowrap}
.tcol-why{grid-column:2 / -1;font-size:14px;line-height:1.45;color:var(--ink-3)}
.td-list{list-style:none;margin:0;padding:0}
.td-list > li + li{border-top:1px solid var(--line)}
.td-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:0 14px;padding:12px 16px;color:inherit;text-decoration:none}
.td-item.two{grid-template-columns:44px minmax(0,1fr)}
.td-item.on{background:var(--leaf-bg)}
a.td-item:hover{background:var(--paper)}
.td-main{display:grid;gap:1px;min-width:0}
.td-main > b{font-weight:600;font-size:15.5px;line-height:1.3}
.td-main > span{font-size:14px;line-height:1.4;color:var(--ink-2)}
.td-q{font-weight:500;font-size:14px;color:var(--ink-3);margin-left:2px;white-space:nowrap}
.td-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px}
.td-sub .score-pill{padding:3px 5px;font-size:13px}
.td-line{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;min-width:0}
.td-line + .td-line{margin-top:4px}
.td-line > :first-child{min-width:0;overflow-wrap:anywhere}
.td-line > b{font-weight:600;font-size:15.5px;line-height:1.3}
.td-line > span:first-child{font-size:14px;color:var(--ink-2)}
.td-r{flex:none;text-align:right}
.td-line .td-r.num{font-weight:600}
.td-empty{padding:16px;color:var(--ink-3)}
.dblock{display:grid;justify-items:center;align-content:center;gap:2px;width:44px;height:46px;border:1px solid var(--line-2);background:var(--paper)}
.dblock small{font:600 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.dblock b{font:500 23px/1 var(--font-display);font-variant-numeric:lining-nums tabular-nums!important}
.dblock.hot{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.dblock.hot small{color:var(--on-ink-2)}
.dblock.cnt b{font-size:26px}
.dblock.bad{background:var(--warn);border-color:var(--warn);color:var(--on-ink)}
.dblock.credit{background:var(--leaf-bg);border-color:var(--leaf-bg)}
.dblock.credit small{font-size:9.5px;letter-spacing:.06em;color:var(--leaf)}
.td-item.on .dblock{border-color:var(--leaf);background:var(--sheet)}
.go-chev{width:9px;height:9px;margin-right:4px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg)}
a.td-item:hover .go-chev{border-color:var(--ink)}
.box-tick{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-2);background:var(--sheet);cursor:pointer}
.box-tick:hover{border-color:var(--ink)}
.box-tick input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box-tick:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.box-tick.on{border-color:var(--leaf)}
.box-tick.on .tick-box{background:var(--leaf);border-color:var(--leaf)}
.box-tick.on .tick-box::after{content:"";width:6px;height:11px;border:solid var(--on-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.tcol-foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink-2)}
.tcol-foot b{color:var(--ink)}
.td-more{margin-left:auto;font-weight:600;color:var(--leaf);text-decoration:none;white-space:nowrap}
.td-more:hover{text-decoration:underline}
.rule-line{margin-top:22px;font-size:14.5px;color:var(--ink-3)}
.rule-line b{color:var(--ink);font-weight:600}


/* ---------- Vandaag: verwachte ontvangsten (scoped under .vd) ---------- */
.vd{--leaf-soft:#cfdcd3;--brass-bg:#efe8da;--done:#b9b5ac;display:grid;gap:42px}
.vd .lede{color:var(--ink-2);max-width:62ch;margin-top:12px;line-height:1.6}
.vd .lede b{color:var(--ink)}
.vd .est-note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;max-width:62ch;padding:10px 14px;background:var(--brass-bg);font-size:14px;color:var(--ink);line-height:1.5}
.vd .est-note .tag{flex:none}
.vd .status{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--sheet)}
.vd .status > div{padding:12px 18px;display:grid;gap:2px;border-right:1px solid var(--line)}
.vd .status > div:last-child{border-right:0}
.vd .status b{font:500 34px/1 var(--font-display)}
.vd .status span{font-size:13px;color:var(--ink-2)}
.vd .status .s-over b{color:var(--warn)}
.vd .status .s-risk b{color:var(--wait)}
.vd .status .s-ok b{color:var(--leaf)}
.vd .sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.vd .sec-head h2{font:500 32px/1.05 var(--font-display)}
.vd .sec-head p{color:var(--ink-2);font-size:14.5px;max-width:70ch;margin-top:4px}
.vd .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.25;padding:2px 7px;border-radius:2px;font-weight:600;white-space:nowrap}
.vd .chip.over{background:var(--warn-bg);color:var(--warn)}
.vd .chip.late,.vd .chip.risk{background:var(--wait-bg);color:var(--wait)}
.vd .chip.ok{background:var(--leaf-bg);color:var(--leaf)}
.vd .chip.in{background:var(--paper-2);color:var(--ink-2)}
.vd .tag{display:inline-block;font:700 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;padding:3px 5px;border:1px dashed var(--brass);color:var(--brass);border-radius:2px;white-space:nowrap}
.vd .size{display:inline-block;font:600 12px/1.4 var(--font-ui);padding:0 6px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2)}
.vd .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vd .btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 14px;border:1px solid transparent;border-radius:0;font-weight:600;font-size:14px;background:var(--paper-2);text-decoration:none}
.vd .btn-leaf{background:var(--leaf);color:var(--on-ink)}
.vd .btn-leaf:hover{background:var(--leaf-deep)}
.vd .btn-line{background:var(--sheet);border-color:var(--line-2)}
.vd .btn-line:hover{border-color:var(--ink)}
.vd .btn-on-ink{background:transparent;border-color:var(--on-ink-line);color:var(--on-ink)}
.vd .lnk{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;text-decoration:underline;text-underline-offset:4px;font-size:14px}
.vd .acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.vd .act-card{border:1px solid var(--line);background:var(--sheet);padding:16px 18px;display:grid;gap:8px;align-content:start;border-left:4px solid var(--wait)}
.vd .act-card.over{border-left-color:var(--warn)}
.vd .act-card .vtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
