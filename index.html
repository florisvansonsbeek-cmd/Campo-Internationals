/* ================= Vandaag: binnenkomen en verzenden ================= */
/* One day board: per day what comes in from growers and what goes out to customers, each with one status word.
   Receiving days are Campo's own estimates: order day plus how long each step usually takes for this grower and route,
   taken from our own past receipts. What a grower mails is shown next to it, for comparison.
   Shipping days follow from the day the customer gets the order, minus the usual days on the road to that country.
   The desk estimates and warns; Jan orders, calls and decides. */
const VD = (() => {
  const T0 = midnight(new Date());
  const D = n => addDays(T0, n);
  const off = d => daysFrom(T0, d);
  const noSunday = n => (D(n).getDay() === 0 ? n + 1 : n);
  const dow = n => DOWS.nl[D(n).getDay()];
  const mon3 = n => D(n).toLocaleDateString('nl-NL', { month: 'short' }).replace('.', '');
  const fD = n => `${dow(n)} ${D(n).getDate()} ${mon3(n)}`;
  const fRange = (a, b) => (a === b ? fD(a) : `${fD(a)} – ${fD(b)}`);
  const fDr = n => (n === 0 ? 'vandaag' : n === 1 ? 'morgen' : fD(n));
  const dg = n => `${n} ${n === 1 ? 'dag' : 'dagen'}`;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const h = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const nf = n => n.toLocaleString('nl-NL');
  const deDate = n => `${D(n).getDate()}.${D(n).getMonth() + 1}.`;
  /* the working week shown first: this week, or next week when today is Sunday */
  const BASE_MON = (() => { const t = T0.getDay() === 0 ? 1 : 0; return t - ((D(t).getDay() + 6) % 7); })();
  const wkNl = d => `wk ${isoWeek(d)} ${DOWS.nl[d.getDay()]}`;

  /* usual days on the road from Nootdorp to the customer's country: the order leaves that many days before the customer has it */
  const ROAD = { NL: 0, BE: 1, DE: 1, FR: 1, DK: 1, PL: 1, IT: 1, SE: 2, GB: 2 };
  const shipDay = co => { let n = off(co.when) - (ROAD[CUSTOMERS[co.cust].cc] ?? 1); if (D(n).getDay() === 0) n--; return n; };
  const whenOf = ci => { const co = ORDERS.find(x => x.id === ci); return co ? shipDay(co) : null; };

  /* Usual steps per route, in days: [step, fastest, usual, slowest]. From our own receipts, not from mails. */
  const R = {
    nl:     [['Bevestigen', 0, 1, 1], ['Klaarzetten', 1, 1, 2], ['Rit naar Nootdorp', 0, 1, 1]],
    nlSlow: [['Bevestigen', 0, 1, 2], ['Klaarzetten', 1, 2, 3], ['Rit naar Nootdorp', 0, 1, 1]],
    hub:    [['Bevestigen', 0, 1, 1], ['Klaarzetten', 1, 2, 3], ['Rit via verzamelpunt Westland', 0, 1, 1]],
    de:     [['Bevestigen', 0, 1, 2], ['Klaarzetten', 1, 2, 3], ['Vervoer via Venlo', 1, 2, 3]],
    dk:     [['Bevestigen', 0, 1, 2], ['Klaarzetten', 1, 2, 3], ['Vervoer via Hamburg en Venlo', 2, 3, 4]],
    ke:     [['Bevestigen', 0, 1, 1], ['Oogsten en verpakken', 1, 2, 3], ['Luchtvracht Nairobi – Schiphol', 1, 1, 2], ['Keuring op Schiphol', 0, 1, 2], ['Expediteur naar Nootdorp', 0, 1, 1]],
  };

  /* Open purchase orders. ordered = day Jan ordered (offset from today). cust/ci link to the customer order; none = own stock.
     says = what the grower mailed, for comparison only. hist = total days of the last deliveries over this route. */
  const OPEN = [
    { id: 'PO-2616', grower: 'lindner', plant: 'cycl', size: 'P12', qty: 300, ordered: -9, steps: R.de, says: null, hist: [5, 5, 6, 5, 7, 5, 6],
      todo: 'Lindner bellen. De bestelling is nooit bevestigd en ook de traagste dag is voorbij.',
      draft: `Guten Tag Frau Lindner,\n\nam ${deDate(-9)} haben wir PO-2616 bestellt: 300 Cyclamen P12. Wir haben noch keine Bestätigung erhalten, und die Ware ist noch nicht bei uns.\n\nKönnen Sie uns bitte sagen, ob die Bestellung bei Ihnen angekommen ist und wann wir sie erwarten können?\n\nMit freundlichen Grüßen\nJan\nCampo International` },
    { id: 'PO-2627', grower: 'naivasha', plant: 'rose', size: '60 cm', qty: 4000, ordered: -7, steps: R.ke, says: { day: off(N(0)), txt: 'Bevestigd: week en dag zoals besteld' }, hist: [6, 6, 7, 6, 8, 6],
      todo: 'Volgens onze schatting is hij al later dan gewoonlijk. Is hij morgen niet binnen, dan de expediteur op Schiphol bellen.' },
    { id: 'PO-2619', grower: 'westland', plant: 'cala', size: 'P14', qty: 150, cust: 'martin', ci: 'CI-26-0418', ordered: -4,
      steps: [['Bevestigen', 0, 1, 2], ['Kweken en klaarzetten', 2, 4, 7], ['Rit naar Nootdorp', 0, 1, 1]], says: { day: off(N(7)), txt: `Bevestigd voor ${wkNl(N(7))}` }, hist: [5, 6, 6, 8, 5, 6],
      todo: 'Westland Groen bevestigde een latere week dan besteld, en later dan wij verwachten. Bellen welke van de twee klopt, of een andere kweker zoeken in Offertes.',
      draft: `Goedemorgen,\n\nJullie bevestiging van PO-2619 (150 Calathea P14) noemt ${wkNl(N(7))}. Wij hadden besteld voor ${wkNl(N(3))}.\n\nKlopt die latere week? Is een deel eerder mogelijk? Anders zoeken we het ergens anders.\n\nMet vriendelijke groet,\nJan\nCampo International` },
    { id: 'PO-2609', grower: 'danica', plant: 'kala', size: 'P10', qty: 600, of: 800, cust: 'lila', ci: 'CI-26-0412', ordered: -12, note: 'Rest van de deellevering: 200 van de 800 zijn binnen.',
      steps: [['Bevestigen', 0, 1, 2], ['Rest kweken en klaarzetten', 5, 9, 11], ['Vervoer via Hamburg en Venlo', 2, 3, 4]], says: { day: off(N(2)), txt: `Rest komt ${wkNl(N(2))}` }, hist: [12, 13, 14, 12, 16],
      todo: `Komt de rest later dan de kweker zegt, dan haalt Lila het niet. Lila alvast laten weten dat de rest ${wkNl(N(2))} komt.` },
    { id: 'PO-2628', grower: 'hortensia', plant: 'hydr', size: 'P17 · H40', qty: 24, cust: 'weber', ci: 'CI-26-0409', ordered: -1, note: 'Nalevering van de 24 die bij PO-2617 ontbraken.',
      steps: R.nlSlow, says: null, hist: [4, 4, 3, 5, 4],
      todo: 'Weber krijgt nu 216 in plaats van 240. Even met Jonas Weber overleggen: nu 216 en de rest later, of alles samen.' },
    { id: 'PO-2623', grower: 'leeuwen', plant: 'phal', name: 'Phalaenopsis 3-tak', size: 'P12', qty: 240, ordered: -2, steps: R.nl, says: { day: off(N(0)), txt: 'Week en dag zoals besteld' }, hist: [3, 3, 3, 3, 4, 3] },
    { id: 'PO-2622', grower: 'zonnehoek', plant: 'kala', size: 'P12', qty: 600, ordered: -2, steps: R.hub, says: { day: off(N(1)), txt: 'Week en dag zoals besteld' }, hist: [4, 4, 5, 4, 3, 4] },
    { id: 'PO-2625', grower: 'hortensia', plant: 'hydr', size: 'P17 · H40', qty: 120, ordered: -2, steps: R.nlSlow, says: { day: off(N(2)), txt: 'Week en dag zoals besteld' }, hist: [4, 4, 3, 5, 4] },
    { id: 'PO-2626', grower: 'lindner', plant: 'chry', size: 'P19 · Ø40', qty: 200, ordered: -2, steps: R.de, says: { day: off(N(2)), txt: 'Week en dag zoals besteld' }, hist: [5, 5, 6, 5, 7, 5] },
    { id: 'PO-2624', grower: 'danica', plant: 'kala', size: 'P10', qty: 300, ordered: -3, steps: R.dk, says: { day: off(N(3)), txt: 'Week en dag zoals besteld' }, hist: [6, 7, 8, 6, 9] },
  ];
  OPEN.forEach(o => { o.needBy = o.ci ? whenOf(o.ci) : null; });

  function estimate(o) {
    let a = o.ordered, b = o.ordered, c = o.ordered; const at = [];
    o.steps.forEach(([, f, u, s]) => { a += f; b += u; c += s; at.push([noSunday(a), noSunday(b), noSunday(c)]); });
    const early = noSunday(a), likely = noSunday(b), late = noSunday(c), spread = late - early;
    const passed = o.steps.map((s, i) => at[i][1] <= 0).filter(Boolean).length;
    return { early, likely, late, at, passed, sure: spread <= 2 ? 3 : spread <= 5 ? 2 : 1 };
  }
  OPEN.forEach(o => { o._e = estimate(o); });

  /* ib: the open line on the board; how: the line that shows how we estimate; past: earlier days of this week shown */
  const V = { ib: null, how: null, draft: null, week: 0, month: 0, past: false };
  const recv = () => { if (!S.recv) S.recv = {}; return S.recv; };
  /* the planning shows a week or a month; Jan's choice stays on this computer */
  const mode = () => (P.vdView === 'month' ? 'month' : 'week');

  const gName = o => GROWERS[o.grower].name;
  const pName = o => o.name || PLANTS[o.plant].nl;
  const pWord = p => PLANTS[p].nl.split(/[ ,]/)[0];
  const custName = o => (o.cust ? CUSTOMERS[o.cust].name : 'Eigen voorraad');
  const shortName = g => g.replace(/^(Kwekerij|Gärtnerei|Kwiaciarnia|Kantoorgroen|Blumenhaus|Fleuriste) /, '').replace(/ (BV|ApS|Blomster|AB|Ltd)$/, '').replace(/^Van /, '');
  /* a purchase order: received, too late, delayed, at risk for the customer it is for, or on schedule */
  function statusOf(o) {
    if (recv()[o.id] != null) return 'in';
    const e = o._e;
    if (0 > e.late) return 'over';
    if (0 > e.likely) return 'late';
    if (o.needBy != null && (e.late > o.needBy || (o.says && o.says.day > o.needBy))) return 'risk';
    return 'ok';
  }
  const attn = s => s === 'over' || s === 'late' || s === 'risk';
  const growerOff = o => (o.says ? o.says.day - o._e.likely : 0);
  const growerFar = o => o.says && (o.says.day < o._e.early - 1 || o.says.day > o._e.late + 1);
  const openOrders = () => OPEN.filter(o => statusOf(o) !== 'in');
  /* where an order on schedule probably is now, from the step it is most likely at */
  function stageOf(o) {
    const name = o.steps[Math.min(o._e.passed, o.steps.length - 1)][0];
    const st = /^Bevestig/.test(name) ? 'ordered' : /klaarzet|kweken|oogst/i.test(name) ? 'grower' : 'moving';
    return st === 'ordered' && o.says ? 'grower' : st;
  }

  /* one word per line on the board. tone gives the colour; the word always says it too */
  const ST = {
    over:    { label: 'Te laat',            tone: 'bad',  ic: '!' },
    late:    { label: 'Vertraagd',          tone: 'late', ic: '!' },
    risk:    { label: 'Risico klant',       tone: 'risk', ic: '!' },
    ordered: { label: 'Besteld',            tone: 'ok',   ic: '•' },
    grower:  { label: 'Bij kweker',         tone: 'ok',   ic: '•' },
    moving:  { label: 'Onderweg',           tone: 'ok',   ic: '→' },
    in:      { label: 'Binnen',             tone: 'done', ic: '✓' },
    missed:  { label: 'Te laat',            tone: 'bad',  ic: '!' },
    buy:     { label: 'Nog inkopen',        tone: 'info', ic: '+' },
    wait:    { label: 'Wacht op inkoop',    tone: 'ok',   ic: '•' },
    ready:   { label: 'Klaar om te pakken', tone: 'ok',   ic: '•' },
    packed:  { label: 'Gepakt',             tone: 'ok',   ic: '•' },
    shipped: { label: 'Onderweg',           tone: 'ok',   ic: '→' },
    done:    { label: 'Geleverd',           tone: 'done', ic: '✓' },
  };
  const PILL = { ok: 'ok', info: 'check', risk: 'risk', late: 'late', bad: 'over', done: 'done' };
  const TONE_RANK = { bad: 0, late: 1, risk: 2, info: 3, ok: 4, done: 5 };
  const pill = st => `<span class="pill ${PILL[ST[st].tone]}"><i aria-hidden="true">${ST[st].ic}</i>${ST[st].label}</span>`;

  /* ---------- what comes in ---------- */
  /* received, straight from the packing lists on the Pakbonnen page, plus orders Jan marked as received here */
  const SLIP_NOTE = { fewer: s => `${nf(s.of - s.got)} te weinig`, partial: () => 'deellevering, de rest volgt', size: s => `andere maat: ${s.gotSize}` };
  function gotItems() {
    return SLIPS.concat(ARCHIVE_SLIPS).filter(s => s.kind === 'Pakbon').map(s => {
      const po = POS[s.po];
      return { key: 'slip:' + s.id, id: s.po, grower: GROWERS[s.grower].name, plant: po ? PLANTS[po.plant].nl : '', size: po ? po.size : '', qty: s.got != null ? s.got : po ? po.qty : 0, of: s.of,
        day: off(s.at), cust: po ? po.cust : null, order: po ? po.order : null, issue: s.issue ? SLIP_NOTE[s.issue](s) : '' };
    }).concat(OPEN.filter(o => recv()[o.id] != null).map(o => ({ key: 'got:' + o.id, id: o.id, grower: gName(o), plant: pName(o), size: o.size, qty: o.qty,
      day: recv()[o.id], cust: o.cust || null, order: o.ci || null, issue: '' })));
  }
  /* what Jan placed from the order list in Offertes; in this prototype those have no purchase order number yet */
  const placedAt = () => (S.placed ? S.placed.at : 0);
  const isPlaced = id => !!placedAt() && (S.ticks[id] === true || S.ticks[id] <= placedAt());
  function needState(n) {
    const rows = scoreNeed(n).filter(r => S.ticks[r.o.id]);
    const placed = rows.filter(r => isPlaced(r.o.id));
    if (placed.length && placed.reduce((s, r) => s + r.q, 0) >= n.qty) return { st: 'ordered', rows: placed, day: Math.max(...placed.map(r => off(r.o.arrive))) };
    return { st: rows.length ? 'listed' : 'buy', rows };
  }
  function inItems() {
    const out = [];
    OPEN.forEach(o => {
      const s = statusOf(o);
      if (s === 'in') return;
      const e = o._e;
      const note = s === 'over' ? `uiterlijk ${fD(e.late)} verwacht` : s === 'late' ? `verwacht ${fD(e.likely)}, kan tot ${fD(e.late)} duren`
        : s === 'risk' ? (o.says && o.says.day > o.needBy ? `kweker zegt ${fD(o.says.day)}` : `kan tot ${fD(e.late)} duren`) : '';
      out.push({ dir: 'in', key: 'po:' + o.id, day: Math.max(e.likely, 0), st: s === 'ok' ? stageOf(o) : s, o,
        what: `${nf(o.qty)} ${pName(o)}`, who: `${shortName(gName(o))}${o.cust ? ` · voor ${shortName(custName(o))}` : ' · voorraad'}`, note });
    });
    NEEDS.forEach(n => {
      const x = needState(n);
      if (x.st !== 'ordered') return;
      x.rows.forEach(r => out.push({ dir: 'in', key: 'buy:' + r.o.id, day: Math.max(off(r.o.arrive), 0), st: 'ordered', b: { n, r },
        what: `${nf(r.q)} ${PLANTS[n.plant].nl}`, who: `${shortName(GROWERS[r.o.grower].name)} · voor ${shortName(CUSTOMERS[n.cust].name)}`, note: 'via je bestellijst' }));
    });
    gotItems().forEach(g => out.push({ dir: 'in', key: g.key, day: g.day, st: 'in', g,
      what: `${nf(g.qty)}${g.of ? ` van ${nf(g.of)}` : ''} ${g.plant}`, who: shortName(g.grower), note: g.issue }));
    return out;
  }

  /* ---------- what goes out ---------- */
  /* per order line: where its goods are. Received earlier, on its way from a grower, still to buy, or from stock */
  function supplyOf(co, sd) {
    return co.lines.map(([plant, size, qty]) => {
      const parts = [];
      SLIPS.concat(ARCHIVE_SLIPS).filter(s => s.kind === 'Pakbon' && POS[s.po] && POS[s.po].order === co.id && POS[s.po].plant === plant).forEach(s => {
        const q = s.got != null ? s.got : POS[s.po].qty;
        parts.push(s.issue === 'size' ? { st: 'risk', q, txt: `binnen, maar in een andere maat (${s.gotSize})`, why: 'andere maat binnengekomen', todo: 'Bekijk de pakbon bij Pakbonnen: houden, ruilen of de klant iets anders voorstellen.' } : { st: 'in', q, txt: `binnen sinds ${fD(off(s.at))}` });
      });
      OPEN.filter(p => p.ci === co.id && p.plant === plant).forEach(p => {
        const s = statusOf(p);
        if (s === 'in') { parts.push({ st: 'in', q: p.qty, txt: `binnen sinds ${fD(recv()[p.id])}` }); return; }
        const saysLate = p.says && p.says.day > sd, bad = s === 'over' || p._e.late > sd || saysLate;
        const why = saysLate ? `kweker zegt ${fD(p.says.day)}` : s === 'over' ? 'inkoop is te laat' : `kan tot ${fD(p._e.late)} duren`;
        parts.push({ st: bad ? 'risk' : 'wait', q: p.qty, po: p.id, day: p._e.likely, why, todo: p.todo,
          txt: `${p.id} bij ${shortName(gName(p))}, verwacht ${fD(Math.max(p._e.likely, 0))}${p.says && p.says.day > sd ? `; de kweker zegt ${fD(p.says.day)}` : !bad ? '' : p._e.late > sd ? `, kan tot ${fD(p._e.late)} duren` : ''}` });
      });
      NEEDS.filter(n => n.order === co.id && n.plant === plant).forEach(n => {
        const x = needState(n);
        if (x.st === 'buy') parts.push({ st: 'buy', q: n.qty, txt: 'nog inkopen, kies een offerte' });
        else if (x.st === 'listed') parts.push({ st: 'buy', q: n.qty, listed: true, txt: 'op je bestellijst, nog niet besteld' });
        else parts.push({ st: x.day > sd ? 'risk' : 'wait', q: n.qty, day: x.day, why: `offerte zegt ${fD(x.day)}`, todo: 'Een snellere offerte kiezen in Offertes, of de klant laten weten dat het later wordt.', txt: `besteld bij ${shortName(GROWERS[x.rows[0].o.grower].name)}, volgens de offerte binnen ${fD(x.day)}` });
      });
      if (!parts.length) parts.push({ st: 'in', q: qty, txt: 'uit voorraad' });
      return { plant, size, qty, parts };
    });
  }
  function outItem(co) {
    const step = stepOf(co), sd = shipDay(co), sup = supplyOf(co, sd), parts = sup.reduce((t, l) => t.concat(l.parts.map(p => Object.assign({ plant: l.plant }, p))), []);
    const has = k => parts.some(p => p.st === k);
    const st = step >= 3 ? 'done' : step === 2 ? 'shipped' : sd < 0 ? 'missed' : has('risk') ? 'risk' : has('buy') ? 'buy' : has('wait') ? 'wait' : step === 1 ? 'packed' : 'ready';
    const firstOf = k => parts.find(p => p.st === k);
    const buyWords = [...new Set(parts.filter(p => p.st === 'buy').map(p => pWord(p.plant)))];
    const waitLast = Math.max(...parts.filter(p => p.st === 'wait').map(p => p.day));
    const hint = co.hint && step < co.hint.to ? co.hint : null;
    const r = firstOf('risk'), multi = co.lines.length > 1;
    const rLine = r ? sup.find(l => l.plant === r.plant) : null, rWho = r && (multi || r.q < rLine.qty) ? `${nf(r.q)} ${pWord(r.plant)}: ` : '';
    const note = st === 'missed' ? `had ${fD(sd)} weg gemoeten`
      : st === 'risk' ? `${rWho}${r.why}`
      : st === 'buy' ? (parts.filter(p => p.st === 'buy').every(p => p.listed) ? 'op je bestellijst, nog niet besteld' : multi ? `${buyWords.join(' en ')} nog inkopen` : '')
      : st === 'wait' ? `inkoop verwacht ${fD(Math.max(waitLast, 0))}`
      : st === 'ready' ? 'alles is binnen'
      : st === 'packed' ? `klaar voor ${fD(sd)}`
      : st === 'shipped' ? (hint ? `voorstel: zet op ${STEPS_NL[hint.to]}` : `bij de klant ${fD(off(co.when))}`)
      : `geleverd ${fD(off(co.when))}`;
    return { dir: 'out', key: 'co:' + co.id, day: st === 'missed' ? 0 : sd, st, co, sd, sup, step, hint,
      what: CUSTOMERS[co.cust].name, who: `${co.lines.map(([p, , q]) => `${nf(q)} ${pWord(p)}`).join(' + ')} · ${CUSTOMERS[co.cust].city}`, note };
  }
  const outItems = () => ORDERS.map(outItem);
  const allItems = () => inItems().concat(outItems());
  const byTone = (a, b) => TONE_RANK[ST[a.st].tone] - TONE_RANK[ST[b.st].tone];

  /* the four numbers on top of the page and of the live screen */
  function tally(items) {
    const today = items.filter(it => it.day === 0);
    return {
      inToday: today.filter(it => it.dir === 'in' && it.st !== 'in').length,
      outToday: today.filter(it => it.dir === 'out' && !['shipped', 'done'].includes(it.st)).length,
      late: items.filter(it => it.st === 'over' || it.st === 'late' || it.st === 'missed').length,
      risk: items.filter(it => it.dir === 'out' && it.st === 'risk').length,
    };
  }

  /* ---------- needs Jan: late or risky purchases, and proposals for what a customer sees ---------- */
  const ACT_ORDER = ['over', 'late', 'risk'];
  const actPOs = () => OPEN.filter(o => attn(statusOf(o))).sort((a, b) => ACT_ORDER.indexOf(statusOf(a)) - ACT_ORDER.indexOf(statusOf(b)));
  const actProps = () => ORDERS.filter(co => co.hint && stepOf(co) < co.hint.to);
  const needCount = () => actPOs().length + actProps().length;
  function reason(o) {
    const e = o._e, s = statusOf(o);
    if (s === 'over') return `We verwachtten hem uiterlijk ${fD(e.late)}. Dat is ${dg(-e.late)} geleden en hij is niet binnen.`;
    if (s === 'late') return `Waarschijnlijkste dag was ${fD(e.likely)}. Volgens onze schatting kan het nog tot ${fD(e.late)} duren.`;
    if (o.says && o.says.day > o.needBy) return `${h(gName(o))} bevestigde ${fD(o.says.day)}. De order voor ${h(custName(o))} gaat ${fDr(o.needBy)} weg.`;
    return `We verwachten hem tussen ${fRange(e.early, e.late)}. De order voor ${h(custName(o))} gaat ${fDr(o.needBy)} weg.`;
  }
  function actsHtml() {
    const pos = actPOs(), props = actProps();
    if (!pos.length && !props.length) return '<p class="all-good">Niets is te laat, niets dreigt te laat te komen voor een klant en er liggen geen voorstellen.</p>';
    return `<ul class="acts">${pos.map(o => {
      const s = statusOf(o);
      return `<li class="act ${s}">
        ${pill(s)}
        <div class="act-main"><b>${h(custName(o))} · ${nf(o.qty)} ${h(pName(o))}</b>
          <span class="act-why">${reason(o)}</span>
          <span class="act-src">${h(gName(o))} · <span class="mono">${o.id}</span>${o.ci ? ` · ${o.ci}` : ''}</span></div>
        <div class="act-btns">${o.draft ? `<button class="btn btn-leaf btn-sm" type="button" data-vd="open-draft" data-key="po:${o.id}">Concept-mail</button>` : ''}<button class="btn btn-line btn-sm" type="button" data-vd="got" data-id="${o.id}">Is binnen</button><button class="lnk" type="button" data-vd="goto" data-key="po:${o.id}">Details</button></div>
      </li>`;
    }).join('')}${props.map(co => {
      const step = stepOf(co), c = CUSTOMERS[co.cust];
      return `<li class="act prop">
        <span class="pill check"><i aria-hidden="true">✓</i>Voorstel</span>
        <div class="act-main"><b>${h(c.name)} · ${co.id}</b>
          <span class="act-why">${h(co.hint.why)} De klant ziet nog “${STEPS_EN[step]}”.</span>
          <span class="act-src">${co.lines.map(([p, , q]) => `${nf(q)} ${pWord(p)}`).join(' + ')} · ${h(c.city)}</span></div>
        <div class="act-btns"><button class="btn btn-line btn-sm" type="button" data-act="step" data-id="${co.id}" data-step="${co.hint.to}">Zet op ${STEPS_NL[co.hint.to]}</button><button class="lnk" type="button" data-vd="goto" data-key="co:${co.id}">Details</button></div>
      </li>`;
    }).join('')}</ul>`;
  }

  /* ---------- the day board ---------- */
  const safeId = key => 'ib-' + key.replace(/[^\w-]/g, '-');
  /* a short track: where the goods are now. reached = the last step they got to (-1: none yet) */
  function track(names, subs, reached, tone, part) {
    return `<ol class="trk t-${tone}" aria-label="Waar het nu is">${names.map((n, i) => `<li class="${i < reached ? 'done' : i === reached ? 'now' : ''}${part && part.includes(i) ? ' part' : ''}"><span class="dot" aria-hidden="true"></span><b>${n}</b><small>${subs[i] || ''}</small></li>`).join('')}</ol>`;
  }
  const sureTxt = n => ['', 'onzeker', 'redelijk zeker', 'zeker'][n];
  function stepTable(o) {
    const e = o._e, cur = Math.min(e.passed, o.steps.length - 1), over = statusOf(o) === 'over';
    const rows = o.steps.map((s, i) => `<tr class="${i === cur && !over ? 'vnow' : ''}"><td><b>${h(s[0])}</b>${i === cur && !over ? '<small>waarschijnlijk nu</small>' : ''}</td><td class="num">${s[1] === s[3] ? dg(s[2]) : `${s[1]}–${s[3]} dagen`}<small>gewoonlijk ${dg(s[2])}</small></td><td class="num">${fD(e.at[i][1])}<small>${fRange(e.at[i][0], e.at[i][2])}</small></td></tr>`).join('');
    return `<div class="tbl-wrap"><table class="stbl"><thead><tr><th>Stap</th><th>Duurt</th><th>Klaar rond</th></tr></thead><tbody><tr><td><b>Besteld door Jan</b></td><td></td><td class="num">${fD(o.ordered)}</td></tr>${rows}</tbody><tfoot><tr><td>Bij Campo</td><td class="num">${e.early - o.ordered}–${e.late - o.ordered} dagen</td><td class="num">${fD(e.likely)}<small style="font-weight:400">${fRange(e.early, e.late)}</small></td></tr></tfoot></table></div>`;
  }
  function howHtml(o) {
    const e = o._e, hs = o.hist, avg = hs.reduce((s, x) => s + x, 0) / hs.length, mx = Math.max(...hs);
    return `<p>Besteld op ${fD(o.ordered)}. Bij elkaar duren de stappen bij ${h(gName(o))} gewoonlijk ${dg(e.likely - o.ordered)}, op zijn snelst ${dg(e.early - o.ordered)} en op zijn traagst ${dg(e.late - o.ordered)}.</p>
      <p>Dat komt uit de laatste ${hs.length} leveringen van deze kweker over dezelfde route: gemiddeld ${avg.toFixed(1).replace('.', ',')} dagen, snelst ${Math.min(...hs)}, traagst ${mx}.</p>
      <div class="vhist" aria-label="Doorlooptijd laatste leveringen in dagen">${hs.map(x => `<span class="${x === e.likely - o.ordered ? 'hl' : ''}" style="height:${Math.max(4, x / mx * 34)}px" title="${dg(x)}"></span>`).join('')}</div>`;
  }
  const fact = (dt, dd, small, cls) => `<div${cls ? ` class="${cls}"` : ''}><dt>${dt}</dt><dd>${dd}${small ? `<small>${small}</small>` : ''}</dd></div>`;
  /* what opens under a line: a short track, the key facts in boxes, and what Jan can do */
  function poDetail(it) {
    const o = it.o, e = o._e, s = statusOf(o), key = it.key, stage = stageOf(o);
    const ti = o.steps.findIndex(x => !/^Bevestig/.test(x[0]) && !/klaarzet|kweken|oogst/i.test(x[0]));
    const idx = { ordered: 0, grower: 1, moving: 2 }[stage];
    const tr = track(['Besteld', 'Bij kweker', 'Onderweg', 'Binnen'], [fD(o.ordered), `± ${fD(e.at[0][1])}`, `± ${fD(e.at[Math.max(ti - 1, 0)][1])}`, `± ${fD(e.likely)}`], idx, ST[it.st].tone);
    const d = growerOff(o);
    const facts = `<dl class="qgrid">
      ${fact('Verwacht binnen', cap(fD(e.likely)), `tussen ${fRange(e.early, e.late)} · ${sureTxt(e.sure)}`)}
      ${fact('Kweker', h(gName(o)), `${h(GROWERS[o.grower].place)} ${GROWERS[o.grower].cc}`)}
      ${fact('Voor', h(custName(o)), o.ci ? `${o.ci} · gaat ${fD(o.needBy)} weg` : 'geen klantorder')}
      ${fact('Kweker mailde', o.says ? `“${h(o.says.txt)}”` : 'Nog niets', o.says ? `${fD(o.says.day)} · ${d === 0 ? 'zelfde dag als wij' : d > 0 ? `${dg(d)} later dan wij` : `${dg(-d)} eerder dan wij`}` : 'geen bevestiging in de mail', o.says && growerFar(o) ? 'far' : '')}
      ${fact('Inkooporder', `<span class="mono">${o.id}</span>`, `${nf(o.qty)} ${h(pName(o))} ${h(o.size)} · besteld ${fD(o.ordered)}`)}
    </dl>`;
    const btns = `<div class="btns">${o.draft && attn(s) ? `<button class="btn btn-leaf btn-sm" type="button" data-vd="draft" data-key="${key}">${V.draft === key ? 'Concept verbergen' : 'Concept-mail'}</button>` : ''}<button class="btn btn-line btn-sm" type="button" data-vd="got" data-id="${o.id}">Is binnen</button><button class="lnk" type="button" data-vd="how" data-key="${key}" aria-expanded="${V.how === key}">${V.how === key ? 'Verberg de schatting' : 'Hoe we dit schatten'}</button></div>`;
    const draft = V.draft === key && o.draft ? `<label class="eyebrow" for="vd-draft-${o.id}">Concept, jij verstuurt het zelf</label><textarea class="vdraft" id="vd-draft-${o.id}">${h(o.draft)}</textarea><div class="btns"><button class="btn btn-line btn-sm" type="button" data-vd="copy" data-id="${o.id}">Kopieer tekst</button></div>` : '';
    const how = V.how === key ? `<div class="ib-how">${stepTable(o)}<div class="how">${howHtml(o)}</div></div>` : '';
    return `${tr}${facts}${o.note ? `<p class="ib-note">${h(o.note)}</p>` : ''}${attn(s) && o.todo ? `<p class="todo"><b>Wat je kunt doen:</b> ${h(o.todo)}</p>` : ''}${btns}${draft}${how}`;
  }
  function buyDetail(it) {
    const { n, r } = it.b, o = r.o, g = GROWERS[o.grower];
    return `${track(['Besteld', 'Bij kweker', 'Onderweg', 'Binnen'], [fD(off(new Date(placedAt()))), '', '', `± ${fD(off(o.arrive))}`], 0, 'ok')}
      <dl class="qgrid">
        ${fact('Verwacht binnen', cap(fD(off(o.arrive))), 'volgens de offerte')}
        ${fact('Kweker', h(g.name), `${h(g.place)} ${g.cc}`)}
        ${fact('Voor', h(CUSTOMERS[n.cust].name), `${n.order}`)}
        ${fact('Offerte', `<span class="mono">${h(o.file)}</span>`, `${nf(r.q)} ${h(PLANTS[n.plant].nl)} ${h(n.size)}`, 'wide')}
      </dl>
      <p class="ib-note">Zelf besteld via je bestellijst. Zodra de kweker bevestigt, komt hier zijn bevestiging bij.</p>
      <div class="btns"><a class="btn btn-line btn-sm" href="#/desk/quotes">Naar Offertes</a></div>`;
  }
  function gotDetail(it) {
    const g = it.g;
    return `<dl class="qgrid">
        ${fact('Binnen', cap(fD(g.day)), g.of ? `${nf(g.qty)} van de ${nf(g.of)}` : `${nf(g.qty)} stuks`)}
        ${fact('Kweker', h(g.grower))}
        ${fact('Voor', g.cust ? h(CUSTOMERS[g.cust].name) : 'Eigen voorraad', g.order || '')}
        ${fact('Inkooporder', `<span class="mono">${g.id}</span>`, `${h(g.plant)} ${h(g.size)}`)}
      </dl>${g.issue ? `<p class="ib-note">Op de pakbon: ${h(g.issue)}.</p>` : ''}
      <div class="btns"><a class="btn btn-line btn-sm" href="#/desk/slips">Naar Pakbonnen</a></div>`;
  }
  const SUP_TONE = { in: 'done', wait: 'ok', buy: 'info', risk: 'risk' };
  const SUP_WORD = { in: 'Binnen', wait: 'Onderweg', buy: 'Nog inkopen', risk: 'Risico' };
  function coDetail(it) {
    const { co, sd, sup, step, hint } = it, c = CUSTOMERS[co.cust];
    const parts = sup.reduce((t, l) => t.concat(l.parts), []);
    const bought = !parts.some(p => p.st === 'buy'), allIn = parts.every(p => p.st === 'in');
    const reached = step >= 1 ? step + 1 : allIn ? 1 : bought ? 0 : -1;
    const last = Math.max(...parts.filter(p => p.day != null).map(p => p.day), -99);
    const restDay = last > -99 ? `± ${fD(Math.max(last, 0))}` : '';
    const tr = track(['Inkoop', 'Binnen', 'Gepakt', 'Onderweg', 'Geleverd'],
      [bought ? 'geregeld' : 'nog niet alles', allIn ? 'alles' : reached >= 1 ? (restDay ? `deels, rest ${restDay}` : 'deels') : restDay, '', fD(sd), fD(off(co.when))], reached, ST[it.st].tone,
      [!bought && reached >= 0 ? 0 : -1, !allIn && reached >= 1 ? 1 : -1]);
    const lines = `<ul class="ib-lines">${sup.map(l => `<li><span class="ib-l"><b>${nf(l.qty)} ${h(PLANTS[l.plant].nl)}</b> <span class="size">${h(l.size)}</span></span>${l.parts.map(p => `<span class="ib-p"><span class="pill mini ${PILL[SUP_TONE[p.st]]}"><i aria-hidden="true">${p.st === 'in' ? '✓' : p.st === 'risk' ? '!' : p.st === 'buy' ? '+' : '→'}</i>${SUP_WORD[p.st]}</span><span>${l.parts.length > 1 ? `${nf(p.q)}: ` : ''}${h(p.txt)}</span></span>`).join('')}</li>`).join('')}</ul>`;
    const facts = `<dl class="qgrid">
      ${fact('Weg uit Nootdorp', cap(fD(sd)), sd < 0 && step < 2 ? 'die dag is voorbij' : '')}
      ${fact('Bij de klant', cap(fD(off(co.when))), `${h(c.city)}, ${COUNTRY_NL[c.cc] || c.cc}`)}
      ${fact('De klant ziet', `“${STEPS_EN[step]}”`, `${STEPS_NL[step]} · gezet ${fWhen(setAtOf(co))}`)}
      ${fact('Order', `<span class="mono">${co.id}</span>`, `besteld ${fD(off(co.ordered))}`)}
    </dl>`;
    const nextStep = hint ? hint.to : step >= 1 && step < 3 ? step + 1 : it.st === 'ready' ? 1 : null;
    const todos = it.st === 'risk' ? [...new Set(parts.filter(p => p.st === 'risk' && p.todo).map(p => p.todo))] : [];
    const btns = `<div class="btns">${it.st === 'buy' || parts.some(p => p.st === 'buy') ? '<a class="btn btn-leaf btn-sm" href="#/desk/quotes">Naar Offertes</a>' : ''}${nextStep != null ? `<button class="btn btn-line btn-sm" type="button" data-act="step" data-id="${co.id}" data-step="${nextStep}">Zet op ${STEPS_NL[nextStep]}</button>` : ''}<a class="lnk" href="#/desk/customers/${co.cust}">Naar ${h(c.name)}</a></div>`;
    return `${tr}${lines}${facts}${todos.map(t => `<p class="todo"><b>Wat je kunt doen:</b> ${h(t)}</p>`).join('')}${hint ? `<p class="match"><b>Voorstel:</b> ${h(hint.why)} De klant ziet nog “${STEPS_EN[step]}”.</p>` : ''}${btns}`;
  }
  function itemHtml(it, live) {
    const open = !live && V.ib === it.key, tone = ST[it.st].tone;
    const body = `${pill(it.st)}<span class="ib-txt"><b>${h(it.what)}</b><span class="ib-sub">${h(it.who)}${it.note ? ` · <em>${h(it.note)}</em>` : ''}</span></span>`;
    if (live) return `<li class="ib-it t-${tone}"><div class="ib-row">${body}</div></li>`;
    const detail = !open ? '' : it.dir === 'out' ? coDetail(it) : it.o ? poDetail(it) : it.b ? buyDetail(it) : gotDetail(it);
    return `<li class="ib-it t-${tone}${open ? ' open' : ''}" id="${safeId(it.key)}">
      <div class="ib-row" role="button" tabindex="0" aria-expanded="${open}" data-ib="${it.key}">${body}<span class="ib-chev" aria-hidden="true"></span></div>
      ${open ? `<div class="ib-detail">${detail}</div>` : ''}
    </li>`;
  }
  function dayHtml(n, g, live) {
    const col = (dir, list) => `<div class="ib-col c-${dir}${list.length ? '' : ' empty'}"><span class="ib-colh">${dir === 'in' ? '↓ Binnenkomen' : '↑ Verzenden'}</span>${list.length ? `<ul>${list.sort(byTone).map(it => itemHtml(it, live)).join('')}</ul>` : '<p class="ib-none">—</p>'}</div>`;
    const tag = n === 0 ? 'Vandaag' : n === 1 ? 'Morgen' : n === -1 ? 'Gisteren' : '';
    return `<div class="ib-day${n === 0 ? ' is-today' : ''}${n < 0 ? ' past' : ''}${g.in.length || g.out.length ? '' : ' quiet'}" id="ib-day-${n}" data-label="${fD(n)}">
      <div class="ib-date"><b>${dow(n)} ${D(n).getDate()}</b><span>${mon3(n)}${live && D(n).getDay() === 1 ? ` · wk ${isoWeek(D(n))}` : ''}</span>${tag ? `<em>${tag}</em>` : ''}</div>
      ${col('in', g.in)}${col('out', g.out)}
    </div>`;
  }
  function group(items) {
    const by = {};
    items.forEach(it => { (by[it.day] = by[it.day] || { in: [], out: [] })[it.dir].push(it); });
    return n => by[n] || { in: [], out: [] };
  }
  const boardHead = () => `<div class="ib-head" aria-hidden="true"><span></span><span><b>↓ Binnenkomen</b> van kwekers</span><span><b>↑ Verzenden</b> naar klanten</span></div>`;
  /* the week on the desk: earlier days of this week fold into one line, so the board starts at today */
  function weekBoard() {
    const items = allItems(), g = group(items), ws = BASE_MON + V.week * 7;
    const first = V.week === 0 ? Math.min(ws, 0) : ws, days = [];
    for (let n = first; n <= ws + 6; n++) {
      const x = g(n);
      if (D(n).getDay() === 0 && !x.in.length && !x.out.length && n !== 0) continue;
      days.push(n);
    }
    const past = V.week === 0 ? days.filter(n => n < 0) : [];
    let pastRow = '';
    if (past.length) {
      const ins = past.reduce((s, n) => s + g(n).in.length, 0), outs = past.map(n => g(n).out).reduce((t, a) => t.concat(a), []);
      const sh = outs.filter(it => it.st === 'shipped').length, dn = outs.filter(it => it.st === 'done').length;
      pastRow = `<div class="ib-past"><div class="ib-date"><b>Eerder</b><span>deze week</span><button type="button" class="ib-past-btn" data-vd="past" aria-expanded="${V.past}">${V.past ? 'Verberg' : 'Toon'}</button></div><div class="ib-col c-in"><span class="ib-colh">↓ Binnenkomen</span><p>${ins ? `${ins} binnen` : 'niets binnengekomen'}</p></div><div class="ib-col c-out"><span class="ib-colh">↑ Verzenden</span><p>${outs.length ? [sh ? `${sh} onderweg naar de klant` : '', dn ? `${dn} geleverd` : '', outs.length - sh - dn ? `${outs.length - sh - dn} anders` : ''].filter(Boolean).join(', ') : 'niets verzonden'}</p></div>
        </div>`;
    }
    const shown = V.past ? days : days.filter(n => n >= 0 || V.week !== 0);
    return `<div class="ib">${boardHead()}${pastRow}${shown.map(n => dayHtml(n, g(n), false)).join('')}</div>`;
  }

  /* the month: per day how much comes in and goes out; the colour is the worst status that day */
  const DOW_SHORT = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
  const monthDate = mo => new Date(T0.getFullYear(), T0.getMonth() + mo, 1);
  const monthName = mo => cap(monthDate(mo).toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }));
  function monthBounds(mo) {
    const fs = off(monthDate(mo)), fe = off(new Date(T0.getFullYear(), T0.getMonth() + mo + 1, 0));
    return { fs, fe, gs: fs - ((D(fs).getDay() + 6) % 7), ge: fe + (6 - ((D(fe).getDay() + 6) % 7)) };
  }
  function countChip(list, dir, n) {
    if (!list.length) return '';
    const tone = n < 0 ? 'done' : list.map(it => ST[it.st].tone).sort((a, b) => TONE_RANK[a] - TONE_RANK[b])[0];
    const bad = list.filter(it => ['bad', 'late', 'risk'].includes(ST[it.st].tone)).length;
    const words = dir === 'in' ? ['binnenkomen', 'binnengekomen'] : ['verzenden', 'verzonden'];
    return `<span class="mc t-${tone}" title="${list.length} ${n < 0 ? words[1] : words[0]}${bad ? `, waarvan ${bad} met een waarschuwing` : ''}"><i aria-hidden="true">${dir === 'in' ? '↓' : '↑'}</i>${list.length}${bad && n >= 0 ? '<b aria-hidden="true">!</b>' : ''}<span class="sr-only"> ${dir === 'in' ? 'binnen' : 'weg'}${bad ? `, ${bad} met een waarschuwing` : ''}</span></span>`;
  }
  function monthHtml(mo, live) {
    const { fs, fe, gs, ge } = monthBounds(mo), g = group(allItems());
    let rows = '';
    for (let w = gs; w <= ge; w += 7) {
      let cells = '';
      for (let n = w; n < w + 7; n++) {
        const x = g(n), inMonth = n >= fs && n <= fe, chips = countChip(x.in, 'in', n) + countChip(x.out, 'out', n);
        const cls = `mday${inMonth ? '' : ' m-out'}${n < 0 ? ' past' : ''}${n === 0 ? ' is-today' : ''}${D(n).getDay() === 0 ? ' sun' : ''}${chips ? '' : ' m-empty'}`;
        const inner = `<span class="md-h"><b class="md-n num">${D(n).getDate()}</b>${n === 0 ? '<span class="md-today">vandaag</span>' : ''}</span>${chips ? `<span class="mcs">${chips}</span>` : ''}`;
        cells += live || !chips ? `<div class="${cls}">${inner}</div>` : `<button type="button" class="${cls}" data-vd="to-day" data-day="${n}" aria-label="${cap(fD(n))}: toon in de week">${inner}</button>`;
      }
      const wn = isoWeek(D(w));
      rows += `<div class="mrow">${live ? `<span class="mwk">wk ${wn}</span>` : `<button type="button" class="mwk" data-vd="to-week" data-w="${(w - BASE_MON) / 7}" title="Week ${wn} in de weekplanning">wk ${wn}</button>`}${cells}</div>`;
    }
    return `<div class="mcal" style="--rows:${(ge - gs + 1) / 7}"><div class="mhead" aria-hidden="true"><span></span>${DOW_SHORT.map(d => `<span>${d}</span>`).join('')}</div>${rows}</div>`;
  }

  const SCREEN_ICO = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 20.5h7M12 16.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  function planSection() {
    const m = mode(), away = m === 'month' ? V.month !== 0 : V.week !== 0;
    return `<section aria-labelledby="vd-h-cal">
  <div class="sec-head">
    <h2 id="vd-h-cal">Binnenkomen en verzenden</h2>
    <div class="cal-tools">
      <div class="seg" role="group" aria-label="Planning per week of per maand"><button type="button" data-vd="view" data-v="week" aria-pressed="${m === 'week'}">Week</button><button type="button" data-vd="view" data-v="month" aria-pressed="${m === 'month'}">Maand</button></div>
      <div class="cal-nav"><button class="vicon" type="button" data-vd="prev" aria-label="${m === 'month' ? 'Vorige maand' : 'Vorige week'}">‹</button><span class="m${m === 'month' ? ' mo' : ''}">${m === 'month' ? monthName(V.month) : `Week ${isoWeek(D(BASE_MON + V.week * 7))}`}</span><button class="vicon" type="button" data-vd="next" aria-label="${m === 'month' ? 'Volgende maand' : 'Volgende week'}">›</button></div>
      ${away ? '<button type="button" class="lnk" data-vd="now">Vandaag</button>' : ''}
      <button type="button" class="vlive" data-vd="live" title="Open de planning als live scherm in een eigen venster, om op een groot beeldscherm te laten staan">${SCREEN_ICO}Live scherm</button>
    </div>
  </div>
  ${m === 'month' ? `<div class="mcal-wrap">${monthHtml(V.month, false)}</div><p class="ib-hint">Klik op een dag om hem in de week te zien. ↓ komt binnen, ↑ gaat weg; de kleur is de zwaarste status van die dag.</p>` : weekBoard()}
</section>`;
  }
  /* one fold with every status word, in the order goods move */
  const flow = keys => `<p class="ib-flow">${keys.map(k => pill(k)).join('<span class="ib-arr" aria-hidden="true">→</span>')}</p>`;
  const legendHtml = () => `<div class="ib-legend">
    <div><h3>Binnenkomen, van kweker naar Nootdorp</h3>${flow(['ordered', 'grower', 'moving', 'in'])}<p>Waar een order nu is, schatten we uit de gewone duur van elke stap bij die kweker en route.</p></div>
    <div><h3>Verzenden, van Nootdorp naar de klant</h3>${flow(['buy', 'wait', 'ready', 'packed', 'shipped', 'done'])}<p>Gepakt, Onderweg en Geleverd zet jij; de klant ziet alleen wat jij zet.</p></div>
    <div><h3>Waarschuwingen</h3><dl>
      <dt>${pill('late')}</dt><dd>De waarschijnlijkste dag is voorbij en hij is nog niet binnen.</dd>
      <dt>${pill('over')}</dt><dd>Ook de traagste dag is voorbij, of een order had al weg gemoeten.</dd>
      <dt>${pill('risk')}</dt><dd>Iets voor een klant komt misschien pas na de dag dat zijn order weggaat, volgens onze schatting of volgens de kweker zelf, of het kwam in een andere maat binnen.</dd>
    </dl></div>
    <div><h3>Zo rekent de desk</h3><ul>
      <li>Een ontvangstdag is onze eigen schatting: de dag dat jij bestelde, plus per stap hoe lang die bij deze kweker en route meestal duurt</li>
      <li>Op het bord staat elke order op zijn waarschijnlijkste dag; wat al voorbij is maar nog niet binnen, staat bij vandaag</li>
      <li>Een verzenddag is de dag dat de klant het heeft, min de gewone dagen onderweg naar dat land; een zondag schuift naar zaterdag</li>
      <li>Wat een kweker mailt, staat er ter vergelijking bij</li>
    </ul></div>
    <p class="vrule">De desk rekent, schat en waarschuwt. <b>Jij bestelt, belt en beslist.</b> Meld je een order als binnen, dan telt die levering mee voor volgende schattingen.</p>
  </div>`;

  /* ---------- the page ---------- */
  function view() {
    const items = allItems(), t = tally(items), n = needCount();
    const lede = `Vandaag ${t.inToday ? `komen er nog <b>${t.inToday}</b> ${t.inToday === 1 ? 'levering' : 'leveringen'} binnen` : 'komt er niets meer binnen'} en ${t.outToday ? `${t.outToday === 1 ? 'gaat er <b>1</b> order' : `gaan er <b>${t.outToday}</b> orders`} weg` : 'gaat er niets weg'}. ${n ? `<b>${n} ${n === 1 ? 'vraagt' : 'vragen'} iets van jou.</b>` : 'Niets vraagt nu iets van jou.'}`;
    const status = `<div class="status" aria-label="Vandaag">
      <div class="${t.inToday ? 's-ok' : 's-none'}"><b class="num">${t.inToday}</b><span>Vandaag<br>binnen</span></div>
      <div class="${t.outToday ? 's-ok' : 's-none'}"><b class="num">${t.outToday}</b><span>Vandaag<br>weg</span></div>
      <div class="${t.late ? 's-over' : 's-none'}"><b class="num">${t.late}</b><span>Te laat of<br>vertraagd</span></div>
      <div class="${t.risk ? 's-risk' : 's-none'}"><b class="num">${t.risk}</b><span>Risico<br>klant</span></div></div>`;

<div class="vd-head">

function whyLoses(n, a, b) {
  const diff = a.total - b.total, d = k => b.parts[k] - a.parts[k];
  const what = P.score.freight ? 'per stuk op de stoep' : 'per stuk';
  const loss = [], gain = [];
  if (d('price') < 0) loss.push([-d('price'), `${eur(b.cmp - a.cmp)} duurder ${what}`]);
  if (d('price') > 0) gain.push([d('price'), `${eur(a.cmp - b.cmp)} goedkoper ${what}`]);
  if (d('lead') < 0) loss.push([-d('lead'), `komt ${b.daysLate === 1 ? '1 dag' : b.daysLate + ' dagen'} later dan de klant nodig heeft`]);
  if (d('lead') > 0) gain.push([d('lead'), 'op tijd']);
  if (d('travel') < 0) loss.push([-d('travel'), `${hrs(b.o.travelH)} onderweg tegen ${hrs(a.o.travelH)}`]);
  if (d('travel') > 0) gain.push([d('travel'), `kortere reis (${hrs(b.o.travelH)})`]);
  if (d('qty') < 0) loss.push([-d('qty'), `biedt ${qty(b.o.qty)} van de ${qty(n.qty)} nodig`]);
  if (d('qty') > 0) gain.push([d('qty'), 'dekt het hele aantal']);
  if (d('valid') < 0) loss.push([-d('valid'), `offerte verlopen op ${fDay(b.o.valid)}`]);
  if (d('valid') > 0) gain.push([d('valid'), 'offerte nog geldig']);
  loss.sort((x, y) => y[0] - x[0]); gain.sort((x, y) => y[0] - x[0]);
  const who = esc(GROWERS[b.o.grower].name);
  if (diff === 0) return `<b>Waarom nummer 2 tweede is:</b> ${who} heeft dezelfde score; ${eur(Math.abs(b.landed - a.landed))} duurder per stuk op de stoep geeft de doorslag.`;
  let s = `<b>Waarom nummer 2 verliest, ${diff} ${diff === 1 ? 'punt' : 'punten'} minder:</b> ${who}: ${loss.map(([p, t]) => `${t} <span class="pts">−${p}</span>`).join(', ')}.`;
  if (gain.length) s += ` Wint terug op ${gain.map(([p, t]) => `${t} <span class="gain">+${p}</span>`).join(', ')}, niet genoeg.`;
  return s;
}

/* what is wrong with a quote line, worst first: expired, then late, then too few */
function qFit(n, r) {

/* ---- Beste deals: every offer as the grower sent it, without a customer, ranked on a score of its own ----
   The same pdf line can serve two customers; here it counts once. Without a customer there is no travel time and no day
   it is needed, so this score uses only price per piece (without freight), how soon it ships compared with the fastest
   offer for the same plant, how much of the total demand it covers, and whether it is still valid. */
const D_STATES = {
  ok: { label: 'Dekt alles', icon: '✓', pill: 'ok', order: 0, dot: 'var(--st-ok)', means: 'Genoeg voor alle bestellingen van deze plant samen, en nog geldig.' },
  short: { label: 'Dekt een deel', icon: '!', pill: 'risk', order: 1, dot: 'var(--st-risk)', means: 'Minder dan alle bestellingen samen nodig hebben; genoeg voor een deel.' },
  expired: { label: 'Verlopen', icon: '✕', pill: 'error', order: 2, dot: 'var(--st-bad)', means: 'De prijs geldt niet meer. Eerst een nieuwe prijs vragen.' },
};
const D_PARTS = [{ k: 'price', short: 'Prijs' }, { k: 'lead', short: 'Levering' }, { k: 'qty', short: 'Aantal' }, { k: 'valid', short: 'Geldig' }];
const dPill = s => { const d = D_STATES[s]; return `<span class="pill ${d.pill}"><i aria-hidden="true">${d.icon}</i>${d.label}</span>`; };
function qDeals() {
  const cfg = P.score, map = new Map(), demand = {};
  NEEDS.forEach(n => { demand[pkey(n)] = (demand[pkey(n)] || 0) + n.qty; });
  allOffers().forEach(o => {
    const n = NEEDS.find(x => x.id === o.need);
    if (!n) return;
    const key = [o.grower, n.plant, n.size, o.price, o.pack.per, o.pack.n || '', o.qty, o.file].join('|');
    if (!map.has(key)) map.set(key, { key, o, plant: n.plant, size: n.size, pk: pkey(n), ids: [] });
    const d = map.get(key);
    d.ids.push(o.id);
    if (+o.ship < +d.o.ship) d.o = o;
  });
  const deals = [...map.values()];
  const sumW = D_PARTS.reduce((t, p) => t + (Number(cfg.w[p.k]) || 0), 0) || 1, W = {};
  D_PARTS.forEach(p => { W[p.k] = (Number(cfg.w[p.k]) || 0) * 100 / sumW; });
  const by = {};
  deals.forEach(d => {
    d.unit = perPiece(d.o); d.expired = daysFrom(TODAY, d.o.valid) < 0; d.demand = demand[d.pk];
    (by[d.pk] = by[d.pk] || []).push(d);
  });
  Object.values(by).forEach(list => {
    const live = list.filter(d => !d.expired), best = Math.min(...(live.length ? live : list).map(d => d.unit)), fastest = Math.min(...list.map(d => +d.o.ship));
    list.forEach(d => {
      d.later = Math.round((+d.o.ship - fastest) / 864e5);
      const f = { price: Math.min(1, best / d.unit), lead: Math.max(0, 1 - (cfg.latePct / 100) * d.later), qty: d.o.qty >= d.demand ? 1 : cfg.qtyMode === 'ratio' ? d.o.qty / d.demand : 0, valid: d.expired ? 0 : 1 };
      d.W = W; d.parts = {};
      D_PARTS.forEach(p => { d.parts[p.k] = Math.round(W[p.k] * f[p.k]); });
      d.total = D_PARTS.reduce((t, p) => t + d.parts[p.k], 0);
      d.s = d.expired ? 'expired' : d.o.qty >= d.demand ? 'ok' : 'short';
      d.cheapest = d.unit <= best + 0.0005;
    });
  });
  return deals.sort((a, b) => (b.total - a.total) || (a.unit - b.unit));
}

  return `<li class="qd ${d.s}${rank === 1 ? ' top' : ''}" data-open="${open}">

document.addEventListener('click', e => {

  const show = e.target.closest('[data-qd-show]');
  if (show) { P.qGroup = 'plant'; savePrefs(); UI.qPlant = show.dataset.qdShow; UI.qCust = ''; UI.qnOpen = {}; render(false); window.scrollTo({ top: 0 }); return; }
  const dtog = e.target.closest('[data-qd-tog]'), dmain = e.target.closest('.qd-main');
  if (dtog || (dmain && !e.target.closest('button, a, input, label, select, textarea'))) {
    const k = dtog ? dtog.dataset.qdTog : dmain.dataset.qd;
    UI.qdOpen = UI.qdOpen || {}; UI.qdOpen[k] = !UI.qdOpen[k]; render(false);

    return;
  }
  if (e.target.closest('[data-qsel-reset]')) { UI.qPlant = ''; UI.qCust = ''; UI.qnOpen = {}; render(false); return; }
  const qx = e.target.closest('[data-qx]');

    const id = qx.dataset.qx; UI.qxOpen = UI.qxOpen || {}; UI.qxOpen[id] = !UI.qxOpen[id]; render(false);
    const t = document.querySelector(`[data-qx="${id}"]`); if (t) t.focus({ preventScroll: true });

  const add = e.target.closest('[data-qadd]');
  if (add) { dropOffer(add.dataset.qadd, 'order'); return; }
  const del = e.target.closest('[data-qdel]');
  if (del) {
    const id = del.dataset.qdel, x = offerInfo(id);
    delete S.ticks[id];
    commit(x ? `Van de bestellijst gehaald: ${pn(x.n.plant)} voor ${CUSTOMERS[x.n.cust].name}, bij ${GROWERS[x.r.o.grower].name}.` : 'Van de bestellijst gehaald.');

  const ntog = e.target.closest('[data-qn-tog]'), nmain = e.target.closest('.qn-main');

  if (!tog && (!main || e.target.closest('button, a, input, label, select, textarea'))) return;

  if (tog) { const t = document.querySelector(`[data-qr-tog="${id}"]`); if (t) t.focus({ preventScroll: true }); }

const IV_DONE = { approved: 'Goedgekeurd', sent: 'In Exact', paid: 'Betaald', discarded: 'Weggegooid' };
const IV_ORDER = Object.keys(IV_STATES).sort((a, b) => IV_STATES[a].order - IV_STATES[b].order);

function ivState(x) {
  const { inv, k } = x;
  if (k.rank === 'credit') return 'credit';
  if (k.rank === 'review') return 'check';
  if (k.rank === 'suspicious') return inv.lookalike || !k.grower || (!k.order && k.slip === 'no') ? 'fraud' : 'pattern';
  if (k.rank === 'hold') return !k.slipDoc || k.slipDoc.issue === 'partial' ? 'wait' : 'error';
  return 'ok';
}
function ivWhy(x, s) {
  const { inv, k } = x, po = k.po, sl = k.slipDoc, g = inv.grower ? GROWERS[inv.grower] : null;
  switch (s) {
    case 'fraud': return inv.lookalike ? `Onbekende afzender die lijkt op ${esc(GROWERS[inv.lookalike].name)}. Geen bestelling, geen pakbon, en de mail vraagt om vandaag te betalen.` : 'Geen bestelling en geen pakbon bij deze factuur.';
    case 'pattern': return k.dup ? `Zelfde factuurnummer als een factuur uit wk ${isoWeek(inv.dupOf)}, die toen al naar de boekhouding ging.` : `Ander rekeningnummer dan bij eerdere facturen van ${esc(g.name)} (eindigt op ${inv.iban}, bekend is ${g.iban}).`;
    case 'error':
      if (sl && sl.issue === 'fewer') return `${qty(po.qty - sl.got)} stuks minder geleverd dan gefactureerd: ${eur(k.value - k.expected)} te veel.`;
      if (sl && sl.issue === 'size') return `Andere maat geleverd: ${esc(sl.gotSize)} in plaats van ${esc(po.size)}.`;
      if (k.amount === 'differs' && k.expected != null) return `Bedrag wijkt af: ${eur(k.value)} gefactureerd, ${eur(k.expected)} verwacht.`;
      return 'Klopt niet met de bestelling.';
    case 'wait': return sl && sl.issue === 'partial' ? `Deellevering: ${qty(sl.got)} van ${qty(sl.of)} binnen, de rest ${wkTxt(sl.rest)}.` : 'De pakbon is nog niet binnen.';
    case 'check': return 'Het totaal is niet zeker gelezen.';
    case 'credit': return `Credit op ${esc(inv.credit.for)}: ${esc(inv.credit.why)}.`;
    default: return `Bestelling ${inv.po}, pakbon en bedrag kloppen.`;
  }
}
function ivAct(x, s) {
  const { inv, k, st } = x, id = inv.id;
  if (st === 'approved') return '<span class="state">Wacht om naar Exact te gaan</span><a class="btn btn-line btn-sm" href="#/desk/accounting">Boekhouding</a>';
  if (st === 'sent') return '<span class="state">In Exact; betalen doe je daar</span>';
  if (st === 'paid') return '<span class="state">Betaald, door jou afgevinkt</span>';
  if (st === 'discarded') return '<span class="state">Weggegooid, nergens gemeld</span>';
  const bin = `<button class="btn btn-bad btn-sm" id="dc-${id}" data-act="discard" data-id="${id}">Weggooien</button>`;
  const lay = `<button class="btn btn-line btn-sm" id="hs-${id}" data-act="hold-seen" data-id="${id}">Laat liggen</button>`;
  switch (s) {
    case 'ok': return k.rank === 'later' ? `<span class="state">Goedkeuren kan vanaf ${fDay(addDays(inv.due, -7))}</span>` : `<button class="btn btn-leaf btn-sm" id="ap-${id}" data-act="approve" data-id="${id}">Goedkeuren</button>`;
    case 'credit': return `<button class="btn btn-line btn-sm" id="ap-${id}" data-act="approve" data-id="${id}">Credit goedkeuren</button>`;
    case 'fraud': return bin;
    case 'pattern': return st === 'seen' ? `<span class="state">Ligt stil</span>${bin}` : lay + bin;
    case 'error': case 'wait': return st === 'seen' ? '<span class="state">Gezien, blijft liggen</span>' : lay;
    case 'check': return '<a class="btn btn-line btn-sm" href="#/desk/review">Bekijken</a>';
  }
  return '';
}
function ivRow(x) {
  const { inv, k, st } = x, s = x.s, done = IV_DONE[st], open = !!(UI.ivOpen && UI.ivOpen[inv.id]), d = IV_STATES[s];
  const pill = done ? `<span class="pill done"><i aria-hidden="true">✓</i>${done}</span>` : `<span class="pill ${s}"><i aria-hidden="true">${d.icon}</i>${d.label}</span>`;
  const soon = !done && inv.due && !inv.credit && daysFrom(TODAY, inv.due) <= 2;
  const detail = open ? `<div class="ivr-detail" id="ivd-${inv.id}">
      ${inv.credit ? '' : indicators(k)}
      ${k.notice ? `<p class="notice${s === 'fraud' || s === 'pattern' ? ' bad' : ''}">${k.notice}</p>` : ''}

      <span class="ivr-due${soon ? ' soon' : ''}">${inv.credit ? 'geen betaling' : inv.due ? fWD(inv.due) : '—'}</span>

    </div>${detail}

}
function viewInvoices() {
  const list = invList().map(x => Object.assign(x, { s: ivState(x) }));
  const open = list.filter(x => !IV_DONE[x.st]), done = list.filter(x => IV_DONE[x.st]);
  const f = UI.ivFilter && (UI.ivFilter === 'all' || UI.ivFilter === 'done' || open.some(x => x.s === UI.ivFilter)) ? UI.ivFilter : 'all';

${fold('iv-legend', 'Wat betekenen de statussen?', '', `<dl class="iv-legend">${IV_ORDER.map(k => `<dt><span class="pill ${k}"><i aria-hidden="true">${IV_STATES[k].icon}</i>${IV_STATES[k].label}</span></dt><dd>${IV_STATES[k].means} <b>${IV_STATES[k].todo}</b></dd>`).join('')}</dl>`, { cls: 'block' })}`);

const SL_ORDER = Object.keys(SL_STATES).sort((a, b) => SL_STATES[a].order - SL_STATES[b].order);
const slState = s => s.issue || 'ok';
const slPill = k => { const d = SL_STATES[k]; return `<span class="pill ${d.pill}"><i aria-hidden="true">${d.icon}</i>${d.label}</span>`; };

/* what was ordered: Jan's purchase order, or the open order Vandaag keeps for it */
function slipInfo(s) {
  const po = POS[s.po] || null, vo = VD.po(s.po);
  const plant = po ? po.plant : vo ? vo.plant : null;
  return {
    po, plant, name: vo && vo.name ? vo.name : plant ? pn(plant) : '', size: po ? po.size : vo ? vo.size : '',
    ordered: po ? po.qty : vo ? vo.qty : null, price: po ? po.price : null,
    cust: po ? po.cust : vo ? vo.cust : null, ci: po ? po.order : vo ? vo.ci : null,
    says: vo ? vo.says : null, inv: INVOICES.find(i => i.slip === s.id) || null,
  };
}
function slWhy(s, x) {
  const what = `${x.name} ${x.size}`;
  switch (slState(s)) {
    case 'fewer': return `${qty(s.got)} van ${qty(s.of)} ${what} binnen: <span class="nb">${qty(s.of - s.got)} minder</span> dan besteld.`;
    case 'partial': return `${qty(s.got)} van ${qty(s.of)} ${what} binnen. De rest komt <span class="nb">${wkTxt(s.rest)}</span>.`;
    case 'size': return `${qty(x.ordered)} ${x.name} geleverd als <span class="nb">${esc(s.gotSize)}</span>; besteld was <span class="nb">${esc(x.size)}</span>.`;
    case 'later': return `${qty(x.ordered)} ${what} bevestigd voor <span class="nb">${wkTxt(s.confirmed)}</span>; besteld voor <span class="nb">${wkTxt(s.promised)}</span>.`;
    default: return s.kind === 'Bevestiging' ? `${esc(s.what)}.` : `${esc(s.what)}, zoals besteld.`;
  }
}
function slChecks(s, x) {
  const st = slState(s), items = [['Bestelling', s.po, !!(x.po || x.plant)]];
  if (s.kind === 'Pakbon') {
    items.push(['Plant', x.name, true]);
    items.push(['Maat', st === 'size' ? `${s.gotSize} i.p.v. ${x.size}` : x.size, st !== 'size']);
    items.push(['Aantal', st === 'fewer' || st === 'partial' ? `${qty(s.got)} van ${qty(s.of)}` : `${qty(x.ordered)} van ${qty(x.ordered)}`, st !== 'fewer' && st !== 'partial']);
  } else {
    items.push(['Aantal', `${qty(x.ordered)} van ${qty(x.ordered)}`, true]);
    items.push(['Week', st === 'later' ? `${wkTxt(s.confirmed)} i.p.v. ${wkTxt(s.promised)}` : x.says ? wkTxt(x.says.date) : 'zoals besteld', st !== 'later']);
  }
  return `<ul class="ind" aria-label="Controles">${items.map(([l, v, ok]) => `<li class="${ok ? 'y' : 'n'}"><span aria-hidden="true">${ok ? '✓' : '✕'}</span> ${l} <b>${esc(String(v))}</b></li>`).join('')}</ul>`;
}
/* the invoice that leans on this document, with its status from Facturen */
function slInvoice(x) {

/* ================= Klanten ================= */
const CUST_FILTERS = [['all', 'Alle'], ['next', 'Volgende stap'], ['open', 'Open bestelling'], ['waiting', 'Wacht op Campo'], ['quiet', 'Stil geworden']];
const custFlags = (k, st) => ({ all: true, next: nextOpen(k), open: st.open.length > 0, waiting: waitingOn(k), quiet: st.quiet });
function custMatches(k, q) {
  if (!q) return true;
  const c = CUSTOMERS[k];
  return `${c.name} ${c.city} ${c.contact} ${COUNTRY_NL[c.cc]}`.toLowerCase().includes(q.trim().toLowerCase());
}
function custListHtml(stats, sel) {
  const keys = Object.keys(CUSTOMERS)
    .filter(k => custMatches(k, UI.custQuery) && custFlags(k, stats[k])[UI.custFilter])
    .sort((a, b) => (Number(!(nextOpen(a) || waitingOn(a))) - Number(!(nextOpen(b) || waitingOn(b)))) || CUSTOMERS[a].name.localeCompare(CUSTOMERS[b].name));
  if (!keys.length) return '<li class="cust-none">Geen klant gevonden.</li>';
  return keys.map(k => {
    const c = CUSTOMERS[k], st = stats[k];
    const badges = (waitingOn(k) ? '<span class="chip bad">Wacht op Campo</span>' : '') + (nextOpen(k) ? `<span class="chip wait">${NEXT[SHEETS[k].next]}</span>` : '') + (st.quiet ? '<span class="chip info">Stil geworden</span>' : '');
    return `<li><a class="cust-item${k === sel ? ' on' : ''}" href="#/desk/customers/${k}"${k === sel ? ' aria-current="true"' : ''}><span class="ci-top"><b>${esc(c.name)}</b>${badges}</span><span class="ci-sub">${esc(c.city)} ${c.cc} · ${pl(st.count, 'bestelling', 'bestellingen')} · laatste ${st.last ? fDay(st.last.ordered) : '—'}${st.open.length ? ` · ${st.open.length} open` : ''}</span></a></li>`;
  }).join('');
}
function custOverview(stats) {
  const keys = Object.keys(CUSTOMERS).sort((a, b) => stats[b].value - stats[a].value);
  const value = keys.reduce((s, k) => s + stats[k].value, 0), count = keys.reduce((s, k) => s + stats[k].count, 0);
  return `<div class="cd-head"><p class="eyebrow">Alle klanten</p><h2>${keys.length} klanten</h2><p class="muted">${qty(count)} bestellingen en ${eur0(value)} omzet in de afgelopen twaalf maanden. </p></div>
  <div class="tbl-wrap"><table class="ov"><thead><tr><th>Klant</th><th class="r">Bestellingen 12 mnd</th><th class="r">Omzet 12 mnd</th><th>Laatste bestelling</th><th class="r">Open</th><th>Volgende stap</th></tr></thead><tbody>
  ${keys.map(k => { const c = CUSTOMERS[k], st = stats[k]; return `<tr><td class="nw"><a href="#/desk/customers/${k}"><b>${esc(c.name)}</b></a><span class="ci-sub">${esc(c.city)} ${c.cc}</span></td><td class="r num">${st.count}</td><td class="r num nw">${eur0(st.value)}</td><td class="nw">${st.last ? fWD(st.last.ordered) : '—'}</td><td class="r num">${st.open.length || '—'}</td><td>${nextOpen(k) ? `<span class="chip wait">${NEXT[SHEETS[k].next]}</span>` : st.quiet ? '<span class="chip info">Stil geworden</span>' : '<span class="faint">—</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function nextBox(k) {
  const sh = SHEETS[k], chosen = S.next[k];
  const draft = chosen && chosen.choice === 'lead' && sh.draft ? sh.draft() : null;
  return `<div class="next">
    <p>${esc(sheetWhy(k))}</p>
    <div class="next-opts">${Object.keys(NEXT).map(o => `<button type="button" id="nx-${k}-${o}" class="${chosen ? (chosen.choice === o ? 'chosen' : '') : (sh.next === o ? 'sug' : '')}" data-act="next" data-id="${k}" data-choice="${o}">${NEXT[o]}${!chosen && sh.next === o && o !== 'none' ? ' · voorstel' : ''}</button>`).join('')}</div>
    ${chosen ? `<p class="small muted">Gekozen: “${NEXT[chosen.choice]}”, ${fWhen(new Date(chosen.at))}. <button class="lnk" data-act="next-clear" data-id="${k}">Wijzigen</button></p>` : ''}
    ${draft ? `<pre class="draft" id="draft-${k}">${esc(draft)}</pre><button class="btn btn-line btn-sm" data-act="copy" data-from="draft-${k}">Kopieer tekst</button>` : ''}
  </div>`;
}
function openOrder(o) {
  const st = stepOf(o);
  return `<div class="so">
    <div class="so-top"><span class="mono">${o.id}</span><span>${o.lines.map(([p, size, n]) => `${qty(n)} ${pn(p)} ${size}`).join(' · ')}</span><span class="faint">verwacht ${fWD(o.when)}</span></div>
    <div class="seg-ctl" role="group" aria-label="Stap die de klant ziet bij ${o.id}">${STEPS_NL.map((s, i) => `<button type="button" id="st-${o.id}-${i}" class="${i === st ? 'on' : ''}" data-act="step" data-id="${o.id}" data-step="${i}" aria-pressed="${i === st}">${s}</button>`).join('')}</div>
    ${o.hint && st < o.hint.to ? `<p class="hint">Voorstel: ${STEPS_NL[o.hint.to]}. ${esc(o.hint.why)} De klant ziet “${STEPS_EN[st]}” tot jij het zet.</p>` : `<p class="faint small">De klant ziet “${STEPS_EN[st]}”, door jou gezet ${fWhen(setAtOf(o))}.</p>`}
  </div>`;
}
function histTable(k, st) {
  const showAll = !!UI.histAll[k], rows = showAll ? st.os : st.os.slice(0, 12);
  return `<div class="tbl-wrap flat"><table class="hist"><thead><tr><th>Referentie</th><th>Besteld</th><th>Geleverd</th><th>Inhoud</th><th class="r">Bedrag excl. btw</th><th>Status</th></tr></thead><tbody>
  ${rows.map(o => { const s = stepOf(o); return `<tr><td class="nw mono">${o.id}</td><td class="nw">${fWD(o.ordered)}</td><td class="nw">${s === 3 ? fDay(o.when) : `<span class="faint">verwacht ${fDay(o.when)}</span>`}</td><td>${o.lines.map(([p, size, n]) => `<span class="ln">${qty(n)} ${pn(p)} <span class="faint">${size}</span></span>`).join('')}</td><td class="r num nw">${eur(orderValue(o))}</td><td><span class="chip${s === 3 ? '' : ' info'}">${STEPS_NL[s]}</span></td></tr>`; }).join('')}
  </tbody></table></div>
  ${st.os.length > 12 ? `<p class="hist-more"><button class="lnk" id="ha-${k}" data-act="hist-all" data-id="${k}">${showAll ? 'Toon alleen de laatste 12' : `Toon alle ${st.os.length} bestellingen`}</button></p>` : ''}`;
}

    <div><dt>Afleveradres</dt><dd>${lines(c.addr)}</dd></div>

    <div><dt>Gemiddeld per bestelling</dt><dd>${eur0(st.avg)}</dd></div>

  </dl>
  <p class="cd-pattern">Bestelt ${rhythmTxt(st.rhythm)}. Koopt vooral ${st.top.map(pn).join(', ')}.${st.quiet ? ' <span class="chip info">Bestelt minder dan gewoonlijk</span>' : ''}</p>
  ${fold(`cd-next-${k}`, 'Volgende stap', chosen ? `gekozen: ${NEXT[chosen.choice]}` : sh.next !== 'none' ? `voorstel: ${NEXT[sh.next]}` : 'niets open', nextBox(k), { cls: 'panel', h: 'h3' })}
  ${fold(`cd-open-${k}`, 'Open bestellingen', `${st.open.length}`, st.open.length ? st.open.map(openOrder).join('') : '<p class="exc-none">Geen open bestellingen.</p>', { cls: 'panel', h: 'h3' })}
  ${fold(`cd-hist-${k}`, 'Alle bestellingen', `${pl(st.os.length, 'bestelling', 'bestellingen')} sinds ${oldest ? fDate(oldest.ordered) : '—'}`, histTable(k, st), { cls: 'panel', h: 'h3' })}
  ${fold(`cd-mail-${k}`, 'Laatste mail van de klant', fWhen(sh.last.at), `<p class="cd-mail">${esc(sh.last.text)}</p>`, { cls: 'panel', h: 'h3' })}`;
}

  const keys = Object.keys(CUSTOMERS), stats = {};
  keys.forEach(k => { stats[k] = custStats(k); });
  const cur = sel && CUSTOMERS[sel] ? sel : null;
  return desk('customers', `
${pageHead('Uit de mail · Klantmail', 'Klanten', 'Alle klanten met hun gegevens, wensen en bestellingen, en per klant één voorstel voor de volgende stap.')}
<div class="cust-layout${cur ? ' has-sel' : ''}">
  <aside class="cust-list" aria-label="Alle klanten">
    <div class="cust-tools">
      <label class="sr-only" for="cust-q">Zoek een klant</label>
      <input type="search" id="cust-q" placeholder="Zoek op naam of plaats" value="${esc(UI.custQuery)}" autocomplete="off">
      <div class="filters" role="group" aria-label="Filter">${CUST_FILTERS.map(([f, l]) => { const n = keys.filter(k => custFlags(k, stats[k])[f]).length; return `<button type="button" id="cf-${f}" class="${UI.custFilter === f ? 'on' : ''}" data-act="cust-filter" data-id="${f}" aria-pressed="${UI.custFilter === f}">${l} <span class="num">${n}</span></button>`; }).join('')}</div>

    <ul id="cust-ul">${custListHtml(stats, cur)}</ul>

}

    if (r.kind === 'plant') {
      return `<article class="rev${st ? ' done' : ''}">
        <div class="inv-top"><span class="chip wait">Offerte</span><b>${esc(GROWERS[r.grower].name)}</b><span class="faint small">${esc(r.file)}</span></div>
        <pre class="raw">${esc(r.raw)}</pre>${conf}<p>${esc(r.reason)} Beste gok: <b>${esc(r.guess)}</b>.</p>
        ${st ? `<p class="notice ${st.ok ? 'info' : ''}">${st.ok ? 'Bevestigd. Onthouden op deze computer; de regel doet nu mee in de bestellijst.' : 'Weggelaten uit de vergelijking.'}</p>`
             : '<div class="rev-form"><button class="btn btn-leaf btn-sm" id="r1-yes" data-act="r1" data-ok="1">Ja, dat klopt</button><button class="btn btn-line btn-sm" id="r1-no" data-act="r1" data-ok="0">Nee, laat weg</button></div>'}

        <pre class="raw">${esc(r.raw)}</pre>${conf}<p>${esc(r.reason)}</p>

    </article>`;
  };

${fold('rv-learned', 'Onthouden op deze computer', pl(S.learned.length, 'verbetering', 'verbeteringen'), `<p class="intro">Correcties die bij volgende offertes van dezelfde kweker vanzelf gelden.</p><ul class="plain">${S.learned.slice().reverse().map(l => `<li>${esc(l.text)} <span class="faint small">· ${fDay(new Date(l.at))}</span></li>`).join('')}</ul>`, { cls: 'block' })}`);

/* ================= Boekhouding (Exact) ================= */
/* Purchase invoices Jan approved go to Exact as a purchase entry with the pdf; paying happens in Exact, never here.
   The page shows what has to be paid in which week, what is ready for Exact, what is in Exact, what is held back,
   where the money goes and the fixed costs per month. */
const BOOKS = 'Exact';
// the fixed-cost row for the accounting package used to name Moneybird; the package is Exact
if (Array.isArray(P.costs)) P.costs.forEach(c => { if (/Moneybird/i.test(c.name)) c.name = 'Boekhoudpakket Exact (abonnement)'; });

const ACC_STATES = [
  { k: 'todo', label: 'Nog goed te keuren', color: '#8db884' },
  { k: 'ready', label: 'Klaar voor Exact', color: '#4a8a56' },
  { k: 'exact', label: 'In Exact, nog te betalen', color: '#1f5138' },
];
const invCC = inv => (inv.grower ? GROWERS[inv.grower].cc : inv.cc || 'NL');
const vatOf = inv => {
  const cc = invCC(inv);
  if (cc === 'NL') return { label: 'btw 9%', title: 'Voorstel: binnenland, laag tarief voor bloemen en planten' };
  if (EU_CC.has(cc)) return { label: 'btw verlegd', title: 'Voorstel: levering uit de EU, de btw is verlegd naar Campo' };
  return { label: 'btw bij invoer', title: 'Voorstel: van buiten de EU, btw bij invoer' };
};
const accSum = xs => xs.reduce((s, x) => s + (x.k.value || 0), 0);
const shortRange = (a, b) => (a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONS.nl[b.getMonth()]}` : `${a.getDate()} ${MONS.nl[a.getMonth()]} – ${b.getDate()} ${MONS.nl[b.getMonth()]}`);

function accData() {
  const list = invList();
  const stateOf = x => (x.st === 'sent' ? 'exact' : x.st === 'approved' ? 'ready' : 'todo');
  // what still has to be paid: invoices that check out, not paid yet; credit notes are offset in Exact, not paid
  const payable = list.filter(x => ['today', 'week', 'later'].includes(x.k.rank) && x.k.value != null && !['paid', 'discarded'].includes(x.st));
  const blocked = list.filter(x => ['suspicious', 'hold'].includes(x.k.rank) && x.st !== 'discarded');
  const ready = list.filter(x => x.st === 'approved'), inExact = list.filter(x => x.st === 'sent'), paid = list.filter(x => x.st === 'paid');
  const unread = list.filter(x => x.k.value == null && x.st !== 'discarded');
  // the payment calendar: four weeks from now (on a Sunday the week ahead), anything earlier counts in the first week
  const start = TODAY.getDay() === 0 ? addDays(TODAY, 1) : TODAY, W0 = addDays(start, -((start.getDay() + 6) % 7));
  const weeks = [0, 1, 2, 3].map(i => ({ from: addDays(W0, 7 * i), to: addDays(W0, 7 * i + 6), items: [] }));
  const later = { later: true, items: [] };
  payable.forEach(x => { const i = Math.floor(daysFrom(W0, x.inv.due) / 7); (i > 3 ? later : weeks[Math.max(0, i)]).items.push(x); });
  const rows = weeks.concat(later.items.length ? [later] : []).map(w => {
    const by = {}; ACC_STATES.forEach(s => { by[s.k] = w.items.filter(x => stateOf(x) === s.k); });
    return Object.assign(w, { by, total: accSum(w.items) });
  });
  // where the money goes: the last 30 days, without suspicious or discarded invoices
  const recent = list.filter(x => x.k.rank !== 'suspicious' && x.st !== 'discarded' && x.k.value != null && daysFrom(x.inv.date, TODAY) <= 30);
  const byGrower = {};
  recent.forEach(x => { const g = x.inv.grower; byGrower[g] = byGrower[g] || { g, total: 0, n: 0 }; byGrower[g].total += x.k.value; byGrower[g].n += 1; });
  const growers = Object.values(byGrower).sort((a, b) => b.total - a.total);
  const regions = [['NL', 'Binnenland'], ['EU', 'EU'], ['XX', 'Buiten de EU']].map(([k, label]) => {
    const xs = recent.filter(x => { const cc = invCC(x.inv); return k === 'NL' ? cc === 'NL' : k === 'EU' ? cc !== 'NL' && EU_CC.has(cc) : !EU_CC.has(cc); });
    return { k, label, total: accSum(xs), n: xs.length, vat: xs.length ? vatOf(xs[0].inv).label : (k === 'NL' ? 'btw 9%' : k === 'EU' ? 'btw verlegd' : 'btw bij invoer') };
  });
  const in7 = payable.filter(x => daysFrom(TODAY, x.inv.due) <= 7);
  return { list, payable, blocked, ready, inExact, paid, unread, rows, growers, regions, recentTotal: accSum(recent), in7, stateOf };
}

function accKpis(d) {
  const tile = (label, value, sub, cls, icon) => `<div class="acc-kpi${cls ? ' ' + cls : ''}"><span class="lbl">${icon || ''}${label}</span><b class="val">${value}</b><span class="sub">${sub}</span></div>`;
  const in7exact = d.in7.filter(x => x.st === 'sent');
  return `<div class="acc-kpis" role="group" aria-label="Samenvatting">
    ${tile('Te betalen, komende 7 dagen', eur0(accSum(d.in7)), d.in7.length ? `${pl(d.in7.length, 'factuur', 'facturen')}${in7exact.length ? `, waarvan ${eur0(accSum(in7exact))} al in Exact` : ''}` : 'Niets dat binnen een week vervalt')}
    ${tile('Klaar voor Exact', eur0(accSum(d.ready)), d.ready.length ? `${pl(d.ready.length, 'factuur', 'facturen')} goedgekeurd door jou` : 'Keur facturen goed bij Facturen')}

function accCalendar(d) {
  const max = Math.max(1, ...d.rows.map(r => r.total));
  const legend = `<div class="acc-legend" aria-hidden="true">${ACC_STATES.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  const rows = d.rows.map(r => {
    const name = r.later ? 'Later' : `wk ${isoWeek(r.from)}`, when = r.later ? `na ${fDay(d.rows[3].to)}` : shortRange(r.from, r.to);
    const segs = ACC_STATES.filter(s => r.by[s.k].length).map(s => {
      const v = accSum(r.by[s.k]);
      return `<span class="seg" tabindex="0" style="width:${(v / max * 100).toFixed(2)}%;background:${s.color}" data-v="${eur(v)}" data-l="${s.label} · ${pl(r.by[s.k].length, 'factuur', 'facturen')}" data-c="${s.color}" aria-label="${name}: ${s.label}, ${eur(v)}"></span>`;
    }).join('');
    return `<li class="cal-row"><span class="cal-lbl"><b>${name}</b><span>${when}</span></span><span class="cal-bar">${segs || '<span class="cal-none">niets</span>'}</span><span class="cal-val">${r.total ? eur0(r.total) : '—'}</span></li>`;
  }).join('');
  const table = `<details class="acc-tbl"><summary>Als tabel</summary><div class="tbl-wrap flat"><table><thead><tr><th>Week</th>${ACC_STATES.map(s => `<th class="r">${s.label}</th>`).join('')}<th class="r">Totaal</th></tr></thead><tbody>
    ${d.rows.map(r => `<tr><td class="nw">${r.later ? 'Later' : `wk ${isoWeek(r.from)} · ${shortRange(r.from, r.to)}`}</td>${ACC_STATES.map(s => `<td class="r num">${r.by[s.k].length ? eur(accSum(r.by[s.k])) : '—'}</td>`).join('')}<td class="r num"><b>${eur(r.total)}</b></td></tr>`).join('')}
  </tbody></table></div></details>`;
  const held = d.blocked.length ? `<p class="acc-note warn"><span class="acc-ico" aria-hidden="true">!</span><span>${eur0(accSum(d.blocked))} aan tegengehouden facturen staat hier niet in. <a href="#/desk/invoices">Bekijk waarom</a></span></p>` : '';
  return `<section class="acc-panel" aria-labelledby="cal-h">
    <div class="acc-ph"><h2 id="cal-h">Betaalkalender</h2><p>Wat er per week vervalt, excl. btw, op de vervaldatum van de factuur.</p></div>
    ${legend}<ul class="cal">${rows}</ul>${held}${table}
  </section>`;
}

function accWhere(d) {
  const max = Math.max(1, ...d.growers.map(g => Math.abs(g.total)));
  const bars = d.growers.map(g => {

      <span class="track" aria-hidden="true"><span class="fill" style="width:${(Math.max(0, g.total) / max * 100).toFixed(2)}%"></span></span></li>`;

  const regions = `<dl class="acc-regions">${d.regions.map(r => `<div><dt>${r.label}</dt><dd><b>${eur0(r.total)}</b><span>${r.n ? pl(r.n, 'factuur', 'facturen') : 'geen'} · ${r.vat}</span></dd></div>`).join('')}</dl>`;
  return `<p class="intro">Inkoopfacturen van de laatste 30 dagen per kweker, excl. btw. Verdachte facturen tellen niet mee${d.unread.length ? `; ${pl(d.unread.length, 'factuur is', 'facturen zijn')} nog niet gelezen` : ''}.</p>

function accTip(seg) {
  let tip = document.getElementById('acc-tip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'acc-tip'; tip.className = 'acc-tip'; tip.setAttribute('role', 'presentation'); document.body.appendChild(tip); }
  if (!seg) { tip.hidden = true; return; }
  const v = document.createElement('b'), l = document.createElement('span'), k = document.createElement('i');
  v.textContent = seg.dataset.v; k.style.background = seg.dataset.c; l.append(k, document.createTextNode(seg.dataset.l));
  tip.replaceChildren(v, l); tip.hidden = false;
  const r = seg.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2))}px`;
  tip.style.top = `${r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8}px`;
}
document.addEventListener('pointerover', e => { const s = e.target.closest && e.target.closest('.cal .seg'); if (s) accTip(s); });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.cal .seg')) accTip(null); });
document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.cal .seg'); if (s) accTip(s); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.cal .seg')) accTip(null); });
window.addEventListener('hashchange', () => accTip(null));
window.addEventListener('scroll', () => { const t = document.getElementById('acc-tip'); if (t && !t.hidden) t.hidden = true; }, { passive: true });
